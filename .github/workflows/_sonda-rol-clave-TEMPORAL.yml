# ============================================================================
# 🔴 SONDA TEMPORAL — SE BORRA EN CUANTO DÉ SU RESULTADO. NO MERGEAR ESTO.
# ----------------------------------------------------------------------------
# Contesta UNA pregunta que bloquea D1, D3 y la reactivación del trackeador:
# ¿qué rol declara el secret `SUPABASE_KEY`, `anon` o `service_role`?
#
# Si es `anon`, cerrar las políticas de las `monitor_*` rompe el trackeador el
# día que vuelva a arrancar — y como está parado desde el 11-jul, el fallo no se
# vería hasta entonces, que es la peor forma de encontrarlo.
#
# 🔒 EL ROL NO ES SECRETO; LA CLAVE SÍ. Este workflow NO imprime nunca el valor,
#    ni un trozo con material de la clave. Solo: longitud, formato y rol.
#    · JWT (`eyJ…`)      → se descodifica SOLO el payload y se filtra `"role":"…"`.
#    · `sb_publishable_` / `sb_secret_` → se imprime el PREFIJO LITERAL detectado,
#      no un recorte del valor (recortar 15 caracteres de `sb_secret_` filtraría 5
#      caracteres de la clave; el prefijo ya dice el rol).
#
# Va con `on: push` a esta rama a propósito: `workflow_dispatch` exige que el
# .yml esté en la rama por defecto (CLAUDE.md §5) y esto NO se va a mergear.
# ============================================================================
name: ZZ Sonda temporal - rol de SUPABASE_KEY

on:
  push:
    branches: [claude/encargo-moloka-audit-21b839]

jobs:
  rol:
    runs-on: ubuntu-latest
    steps:
      - name: Qué rol declara la clave (sin revelarla)
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -uo pipefail
          k="${SUPABASE_KEY:-}"
          if [ -z "$k" ]; then
            echo "::error::El secret SUPABASE_KEY no está definido o está vacío."
            exit 1
          fi
          echo "longitud de la clave: ${#k} caracteres"
          case "$k" in
            eyJ*)
              echo "formato: JWT (clave de la generación antigua)"
              # base64url -> base64, y se le devuelve el relleno que el JWT quita.
              p=$(printf '%s' "$k" | cut -d. -f2 | tr '_-' '/+')
              case $(( ${#p} % 4 )) in
                2) p="${p}==" ;;
                3) p="${p}=" ;;
              esac
              rol=$(printf '%s' "$p" | base64 -d 2>/dev/null | grep -o '"role":"[^"]*"' || true)
              if [ -n "$rol" ]; then
                echo "ROL DECLARADO -> ${rol}"
              else
                echo "::warning::No se pudo leer el rol del payload."
              fi
              ;;
            sb_publishable_*)
              echo "formato: sb_publishable_  ->  ROL DECLARADO -> \"role\":\"anon\" (clave PUBLICABLE)"
              ;;
            sb_secret_*)
              echo "formato: sb_secret_  ->  ROL DECLARADO -> \"role\":\"service_role\" (clave SECRETA)"
              ;;
            *)
              echo "::warning::Formato no reconocido. No se imprime nada del valor."
              ;;
          esac
          echo "---"
          echo "Recordatorio: BORRAR este workflow en cuanto se lea el resultado."
