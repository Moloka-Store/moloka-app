name: Moloka - Procesar CANAL amazon_es

# PR-C: mete España en canales_producto con la comisión y la logística REALES por
# producto (mediana de las últimas 10 ventas de transacciones_movimientos), igual
# que la v1 hace para amazon_it/amazon_fr. Lee de la BD (no de Storage), así que
# NO necesita SUPABASE_KEY. A DEMANDA. Se lanza DESPUÉS de cada carga de
# transacciones (el cargador avisa en su resumen de que amazon_es quedó desfasado).
# Escalera: staging ensayo → staging aplicar → SQL → producción ensayo → aplicar → SQL.
on:
  workflow_dispatch:
    inputs:
      entorno:
        description: 'Base de datos destino'
        type: choice
        options: [staging, produccion]
        default: staging
      modo:
        description: 'ensayo = solo dice qué escribiría; aplicar = UPSERT de amazon_es en canales_producto'
        type: choice
        options: [ensayo, aplicar]
        default: ensayo

concurrency:
  group: procesar-canal-amazon-es
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ubuntu-24.04
    # 🔴 TOPE CONTRA CUELGUES (encargo AJ, 24-sep-2026). Sin él, GitHub espera 6 h. El
    #    24-sep el ledger se quedó 71 min colgado esperando la respuesta del refresco
    #    del Trackeador: la base se reinició a mitad (06:35:16 Madrid) y nadie se lo dijo (run 35956134193).
    #    15 min, medido con los runs de los nueve procesar-*.yml (622 runs): el éxito más
    #    largo de todos fue paneu-aptos, 587 s, el 29-jul; desde el 29-jul ninguno pasa
    #    de 137 s. Un corte por tope sale `cancelled` y el paso del registro lo apunta
    #    así (probado con tope de 1 min en staging, run 35843826193).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --quiet psycopg2-binary

      - name: Ejecutar procesador
        env:
          ENTORNO: ${{ inputs.entorno }}
          MODO: ${{ inputs.modo }}
          DB_URL: ${{ inputs.entorno == 'produccion' && secrets.SUPABASE_DB_URL || secrets.STAGING_DB_URL }}
        run: python -u procesador_canal_amazon_es.py
