name: Moloka - Procesar LEDGER

# 7ª pieza de la Fase 0 de la v2 (el LIBRO MAYOR de movimientos FBA). A DEMANDA,
# sin reloj. Espejo de procesar-internacional.yml. STAGING + ENSAYO por defecto.
# Carga POR RANGO de fechas (no foto): reemplaza [fecha_min, fecha_max] del
# fichero y deja intacto lo anterior. Escalera: staging ensayo → staging aplicar
#           → verificación SQL → producción ensayo → producción aplicar → SQL.
on:
  workflow_dispatch:
    inputs:
      entorno:
        description: 'Base de datos destino'
        type: choice
        options: [staging, produccion]
        default: staging
      modo:
        description: 'ensayo = solo comprueba y dice qué escribiría; aplicar = recierra el rango en ledger_movimientos'
        type: choice
        options: [ensayo, aplicar]
        default: ensayo

concurrency:
  group: procesar-ledger
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --quiet supabase psycopg2-binary

      # 🔒 CÓMO SE LEE UN TSV DE AMAZON, antes del procesador. La comilla es TEXTO y
      #    una que abra un campo sin cerrar FUSIONA FILAS en silencio. El test lleva los
      #    cuatro casos medidos y vigila también que el LEDGER siga fuera del cambio.
      #    En este repo nada corre en push ni en PR: un test que no se lanza aquí es
      #    decoración.
      - name: Mesa de pruebas del parseo TSV
        run: python -u test_tsv_quote_none.py

      # 🔴 EL GANCHO DEL REFRESCO. `refrescar_vistas()` corre DESPUES del commit y
      #    NO aborta: si falla, la carga ya esta escrita y lo unico que queda es el
      #    grito. O sea que un fallo suyo no tumba este workflow y se descubriria
      #    dias despues, con la pantalla enseñando ventas viejas. Esta mesa prueba
      #    que GRITA, que grita lo que hace falta para arreglarlo, y --la mitad que
      #    se olvida-- que NO avisa a la app cuando el refresco fue mal.
      - name: Mesa de pruebas del refresco de materializadas
        run: python -u test_refrescar_vistas.py

      - name: Ejecutar procesador
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ENTORNO: ${{ inputs.entorno }}
          MODO: ${{ inputs.modo }}
          DB_URL: ${{ inputs.entorno == 'produccion' && secrets.SUPABASE_DB_URL || secrets.STAGING_DB_URL }}
        run: python -u procesador_ledger.py
