name: Moloka - Backup BD

# Copia diaria a Cloudflare R2. Desde el 30-jul-2026 copia DOS cosas:
#   · la BD (pg_dump --schema=public)              -> s3://moloka-backups/bd/
#   · los FICHEROS de Supabase Storage             -> s3://moloka-backups/storage/<bucket>/
# El pg_dump copiaba los APUNTES, no las FACTURAS. Y desde el DROP de la columna
# `crudo` de keepa_escaparate_hist (PR #74, 29-jul) ese histórico depende de unos
# CSV que viven SOLO en el bucket `informes`: sin esta copia no hay de dónde
# reconstruirlos.
#
# 🔒 ORDEN DELIBERADO: el Storage se copia DESPUÉS de subir la BD a R2. Si se
#    pusiera antes, un tropiezo bajando ficheros dejaría el volcado de la base sin
#    subir — y la base es lo más crítico. Así, pase lo que pase con el Storage, la
#    copia de la BD ya está a salvo (y el fallo salta igual por el Telegram).

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

concurrency:
  group: backup-bd
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # Hasta hoy este job no bajaba el repo porque no ejecutaba nada de dentro.
      # Ahora sí: necesita backup_storage.py.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 1) Instalar cliente Postgres 17 (la BD es 17.6)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common >/dev/null
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh >/dev/null 2>&1 || true
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: 2) Volcar la BD (pg_dump)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          FECHA=$(date -u +%Y-%m-%d_%H%M)
          echo "FECHA=$FECHA" >> "$GITHUB_ENV"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --schema=public --no-owner --no-privileges \
            --clean --if-exists \
            | gzip > "moloka_${FECHA}.sql.gz"
          ls -lh "moloka_${FECHA}.sql.gz"

      - name: 3) Verificar que la copia NO es falsa
        run: |
          F="moloka_${FECHA}.sql.gz"
          gunzip -t "$F"
          BYTES=$(stat -c%s "$F")
          if [ "$BYTES" -lt 500000 ]; then
            echo "::error::Copia sospechosamente pequena ($BYTES bytes)"; exit 1
          fi
          zcat "$F" | grep -q "CREATE TABLE" || { echo "::error::Sin CREATE TABLE"; exit 1; }
          zcat "$F" | grep -q "productos"    || { echo "::error::No aparece la tabla productos"; exit 1; }
          echo "Copia verificada: $BYTES bytes"

      - name: 4) Subir la BD a Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID:         ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          aws s3 cp "moloka_${FECHA}.sql.gz" "s3://moloka-backups/bd/moloka_${FECHA}.sql.gz" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --region auto
          echo "Subido a R2: bd/moloka_${FECHA}.sql.gz"

      # --- LOS FICHEROS (facturas e informes) --------------------------------
      # `fotos-fabrica` NO entra: 2.531 objetos / 598 MB medidos el 30-jul. Se
      # decide aparte. Para meterlo bastaría con anadirlo a BUCKETS.
      - name: 5) Bajar el Storage a disco (facturas e informes)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BUCKETS: 'facturas-pdfs,informes'
          DESTINO: storage_backup
        run: |
          pip install --quiet supabase
          python -u backup_storage.py

      - name: 6) Sincronizar el Storage con R2
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID:         ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # 🔒 SIN --delete, y es deliberado: esto es una COPIA DE SEGURIDAD, no un
          # espejo. Si alguien borra un fichero en Supabase, la copia en R2 tiene que
          # sobrevivir — es justo el caso contra el que protege (los CSV de Keepa no
          # se borran nunca). Consecuencia buscada: R2 puede tener MÁS ficheros que
          # Supabase, nunca menos.
          aws s3 sync storage_backup/ "s3://moloka-backups/storage/" \
            --endpoint-url "$EP" --region auto --no-progress
          echo "--- Lo que hay en R2 tras sincronizar ---"
          for B in facturas-pdfs informes; do
            N=$(aws s3 ls "s3://moloka-backups/storage/$B/" --recursive \
                  --endpoint-url "$EP" --region auto | wc -l)
            echo "  storage/$B/: $N objeto(s)"
          done

      - name: 7) Telegram OK
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          BYTES=$(stat -c%s "moloka_${FECHA}.sql.gz")
          MB=$(awk "BEGIN {printf \"%.1f\", $BYTES/1048576}")
          SMB=$(awk "BEGIN {printf \"%.1f\", ${STORAGE_BYTES:-0}/1048576}")
          curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="OK Backup Moloka (${FECHA}) -> R2: BD ${MB} MB + ${STORAGE_OBJETOS:-0} ficheros de Storage (${SMB} MB)" >/dev/null

      - name: 8) Telegram FALLO (solo si algo peta)
        if: failure()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="FALLO BACKUP BD MOLOKA - mirar GitHub Actions (backup-bd)" >/dev/null
