name: Moloka - Procesar INVENTARIO_FBA

# El informe «Gestión de inventario de Logística de Amazon». Existe por UNA cosa:
# `inbound_shipped`, las unidades EN TRÁNSITO — el único dato de salud_fba que no
# cubre ninguna otra tabla, y salud_fba lleva congelado desde el 16-ago.
#
# A DEMANDA, sin reloj. Espejo de procesar-internacional.yml. STAGING + ENSAYO por
# defecto. Escalera: staging ensayo → staging aplicar → verificación SQL →
#            producción ensayo → producción aplicar → verificación SQL.
#
# ⚠️ ANTES DEL PRIMER ENSAYO hay que aplicar migraciones/2026-08-23_inventario_fba.sql
#    (crea la tabla CERRADA). El procesador NO activa
#    la RLS —era un lock exclusivo en cada carga— y aborta pidiéndola si no está.
#
# 🔴 EL RESCATE DEL 7-sep-2026, Y EL ORDEN IMPORTA. Ese día Amazon sirvió el informe
#    con 24 columnas, la Guarda 1 lo rechazó y la carga se quedó cerrada: la foto viva
#    es del 6-sep. El fichero sigue en el buzón. Para meterlo en su sitio:
#        fichero = 50742020703.txt   ·   entorno = produccion   ·   modo = ensayo
#    🔴 ESE NOMBRE SE CORRIGIÓ EL 7-sep-2026 Y CONVIENE SABER POR QUÉ: el encargo
#       decía `50740020703.txt`, que es el contenido de las 09:2x. Fernando eligió el
#       de las 09:56. Más abajo, en las mediciones, `50740020703.txt` sigue citado a
#       propósito: es el fichero sobre el que se midió el informe de 24 columnas ese
#       día, y eso no se reescribe. Lo que se carga es el otro.
#    y, si el ensayo cuadra, el mismo disparo con modo = aplicar.
#    ⚠️ HAY QUE HACERLO **ANTES** DE CARGAR NINGUNA FOTO MÁS NUEVA. `guarda_no_retroceder`
#       impide cargar una foto anterior a la que ya está: en cuanto entre la del 8-sep,
#       la del 7 ya no se puede meter y ese día queda para siempre fuera del histórico.
#    ⚠️ Y OJO: en el buzón hay CUATRO .txt subidos el 7-sep, pero sólo DOS contenidos
#       (medido por el eTag, que es el MD5): 50738020703 y 50740020703 son el mismo
#       fichero, y 50742020703 y su copia (1) son el mismo. Fernando eligió el de las
#       09:56, **50742020703.txt**. Se carga POR SU NOMBRE; sin el input `fichero` se
#       cargaría «el más reciente», que aquí es una lotería.
#
# 🔑 EL ORDEN CON EL LEDGER, Y POR QUÉ IMPORTA (medido el 7-sep-2026). La Guarda 10
#    compara la caída del disponible contra lo que salió del almacén, y eso lo dice
#    `ledger_movimientos` — que **no tiene reloj**: `procesar-ledger.yml` es sólo
#    `workflow_dispatch` y se carga cuando alguien pulsa el botón. Además su último día
#    viene siempre cortado a la hora de la descarga.
#    Consecuencia práctica: **si quieres que opine el ledger, cárgalo ANTES que el
#    inventario**. Si no, opina la película del propio inventario, que es un dato
#    completo pero describe el pasado. Las dos cosas las dice el log, con su nombre.
#
# 🔒 EL BUZÓN LO ABRE `migraciones/2026-08-23_jubilar_salud_fba.sql`, que mete
#    `informes/inventario_fba/` en `moloka_buzones_fase0()` y saca de ahí a
#    `salud_fba` — un relevo, 8 carpetas antes y 8 después. De esa función cuelgan
#    las cuatro políticas `buzones_v2_*` de storage.objects (la lista blanca de
#    subida de Elena), por eso se vio aparte y no de polizón.
#    CONSECUENCIA PRÁCTICA mientras esa migración no esté aplicada en ese entorno:
#    subir el informe al buzón DESDE LA APP da «new row violates row-level security
#    policy». Esta cañería funciona igual —lee el Storage con la clave de servicio,
#    que salta la RLS—, así que el fichero puede entrar por el conector de Supabase.
on:
  workflow_dispatch:
    inputs:
      entorno:
        description: 'Base de datos destino'
        type: choice
        options: ['staging', 'produccion']
        default: 'staging'
      modo:
        description: 'ensayo = solo comprueba y dice qué escribiría; aplicar = vuelca inventario_fba'
        type: choice
        options: ['ensayo', 'aplicar']
        default: 'ensayo'
      # 🔴 EL FICHERO EXACTO, y es lo que convierte esta cañería en un buzón de la
      #    app. Sin este input, la v2 no puede disparar: procesaría «el más reciente»
      #    del buzón, que con dos informes dentro es una lotería — Elena soltaría el
      #    suyo y podría cargarse el de otro día, con la pantalla diciendo «Procesado».
      #    Vacío = el más reciente, que es como se lanzó a mano hasta el 24-ago-2026.
      # ⚠️ `required: false` y default entrecomillado: un `workflow_dispatch` rechaza
      #    el disparo ENTERO (422) si le falta un input declarado obligatorio, y la app
      #    lo manda sólo cuando la ficha lo declara.
      fichero:
        description: 'Nombre EXACTO del .txt del buzon (informes/inventario_fba/). Vacio = el mas reciente.'
        type: string
        required: false
        default: ''
      # 🔒 Las válvulas, con nombre y por defecto APAGADAS. Que existan aquí, a la
      #    vista, es parte del trato: una guarda que se salta editando el código se
      #    salta sin que quede constancia.
      permitir_umbral_bajo:
        description: 'Cargar aunque el fichero traiga menos de 150 filas (Guarda 4). Sólo si el catálogo ha encogido DE VERDAD.'
        type: choice
        options: ['no', 'si']
        default: 'no'
      exigir_inbound:
        description: 'ABORTAR si el informe no trae NADA en tránsito, en vez de sólo gritarlo (Guarda 7b).'
        type: choice
        options: ['no', 'si']
        default: 'no'
      # 🔴 ESTAS DOS FALTABAN AQUÍ, Y LAS DOS EXISTÍAN YA EN EL CÓDIGO. Se leen del
      #    entorno desde su PR, pero no se podían poner desde este botón: o sea que la
      #    única forma de usarlas era editar el .py, que es exactamente lo que el trato
      #    de las válvulas dice que no se hace. Una válvula que no está a la vista se
      #    salta sin que quede constancia.
      permitir_salto:
        description: 'Cargar aunque el disponible caiga mas de lo que se vendio (Guarda 10). Solo si el salto es REAL.'
        type: choice
        options: ['no', 'si']
        default: 'no'
      permitir_modelo_nuevo:
        description: 'Cargar aunque la cabecera no sea ninguno de los dos modelos conocidos, el de 26 ni el de 24 (Guarda 14).'
        type: choice
        options: ['no', 'si']
        default: 'no'
      # 🔴 LA SEGUNDA LLAVE DEL CERROJO (Guarda 12), Y NO ES UNA VALVULA COMO LAS
      #    OTRAS. Las de arriba SALTAN una guarda; esta no salta nada: es la mitad
      #    humana de una decision que tiene dos mitades. El procesador mide si algun
      #    consumidor sigue leyendo el nulo como cero — y esa medicion puede mantener
      #    CERRADO, pero **no puede abrir**. Abrir lo activa Fernando, aqui.
      #    🔑 Por que: la medicion mira UNA expresion en CUATRO objetos. Si el nulo se
      #       leyera como cero en un sitio que no mira, diria «limpio» y la carga se
      #       abriria sola con el disponible ~250 uds corto.
      abrir_transito_desconocido:
        description: 'Dejar entrar una foto SIN el transito entre centros (Guarda 12). Solo con Fernando delante y las vistas ya arregladas.'
        type: choice
        options: ['no', 'si']
        default: 'no'

# ⚠️ Las opciones y los defaults van ENTRECOMILLADOS: en YAML un `no` suelto es el
#    BOOLEANO false, no la cadena "no" (el problema de Noruega: NO = Norway). Medido
#    el 11-ago-2026 sobre procesar-custom-analytics.yml, donde `options: [no, si]` se
#    leía `[False, 'si']`.

concurrency:
  group: procesar-inventario-fba
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ubuntu-24.04
    # 🔴 TOPE CONTRA CUELGUES (encargo AJ, 24-sep-2026). Sin él, GitHub espera 6 h. El
    #    24-sep el ledger se quedó 71 min colgado esperando la respuesta del refresco
    #    del Trackeador: la base se reinició a mitad (06:35:16 Madrid) y nadie se lo dijo (run 35956134193).
    #    15 min, medido con los runs de los nueve procesar-*.yml (622 runs): el éxito más
    #    largo de todos fue paneu-aptos, 587 s, el 29-jul; desde el 29-jul ninguno pasa
    #    de 137 s. Un corte por tope sale `cancelled` y el paso del registro lo apunta
    #    así (probado con tope de 1 min en staging, run 35843826193).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --quiet supabase psycopg2-binary

      # 🔒 CÓMO SE LEE UN TSV DE AMAZON, antes del procesador. La comilla es TEXTO y
      #    una que abra un campo sin cerrar FUSIONA FILAS en silencio.
      - name: Mesa de pruebas del parseo TSV
        run: python -u test_tsv_quote_none.py

      # 🔴 LAS GUARDAS DE ESTA CAÑERÍA, VISTAS ROJAS Y VISTAS CALLADAS. En este repo
      #    nada corre en push ni en PR: un test que no se lanza aquí es decoración.
      #    Las 12 guardas se rompieron a mano el 23-ago-2026 y las 12 se pusieron
      #    rojas; el suite también comprueba la mitad que se olvida — que con el
      #    fichero sano NO dice nada.
      - name: Mesa de pruebas de las guardas de inventario_fba
        run: python -u test_inventario_fba.py

      - name: Ejecutar procesador
        id: procesador
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ENTORNO: ${{ inputs.entorno }}
          MODO: ${{ inputs.modo }}
          FICHERO: ${{ inputs.fichero }}
          DB_URL: ${{ inputs.entorno == 'produccion' && secrets.SUPABASE_DB_URL || secrets.STAGING_DB_URL }}
          PERMITIR_UMBRAL_BAJO: ${{ inputs.permitir_umbral_bajo == 'si' && '1' || '0' }}
          EXIGIR_INBOUND: ${{ inputs.exigir_inbound == 'si' && '1' || '0' }}
          PERMITIR_SALTO: ${{ inputs.permitir_salto == 'si' && '1' || '0' }}
          PERMITIR_MODELO_NUEVO: ${{ inputs.permitir_modelo_nuevo == 'si' && '1' || '0' }}
          ABRIR_TRANSITO_DESCONOCIDO: ${{ inputs.abrir_transito_desconocido == 'si' && '1' || '0' }}
        run: python -u procesador_inventario_fba.py

      # ═══ LA LÍNEA DEL REGISTRO (encargo H, 23-sep-2026) · SIEMPRE EL ÚLTIMO PASO DEL JOB ═══
      # 🔴 POR QUÉ: hasta hoy este procesador no dejaba en la base ninguna fila de «esto falló»: un
      #    rollback no deja rastro (parte E, 23-sep, tabla a-bis). Este paso apunta en
      #    `registro_ejecuciones` una línea con el color REAL del job (`job.status`) y el modo. La
      #    lee la revisión mensual con el conector de solo lectura.
      # 🔑 VA A LA MISMA BASE QUE LA CARGA: la misma expresión de `DB_URL` que el paso del procesador.
      #    Un ensayo en staging se apunta en staging, y uno en producción en producción, con su modo:
      #    un ensayo verde NO es una carga.
      # 🔒 UN FALLO AL APUNTAR NUNCA CAMBIA EL COLOR DEL JOB NI LO RETRASA: `continue-on-error`, un
      #    minuto de tope y 45 s para psql. Sin credenciales nuevas: la cadena de siempre, que entra
      #    como `postgres`, el dueño de `registrar_ejecucion`.
      # 🔑 Y AQUÍ, ADEMÁS, LA GUARDA SALTADA (2 bis): si PERMITIR_SALTO o PERMITIR_UMBRAL_BAJO han
      #    dejado pasar la Guarda 10 o la 4, el procesador lo ha dejado en la SALIDA de su paso
      #    (`guarda_10` / `guarda_4`, con sus cifras: `dejar_constancia()`), y va a
      #    `guardas_saltadas`. Las válvulas que se abrieron en el botón, aunque no llegaran a
      #    hacer falta, van a `filas.valvulas_abiertas`: una válvula abierta ya es algo que mirar.
      - name: Apuntar la ejecución en el registro
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          DB_URL: ${{ inputs.entorno == 'produccion' && secrets.SUPABASE_DB_URL || secrets.STAGING_DB_URL }}
          R_RESULTADO: ${{ job.status }}
          R_MODO: ${{ inputs.modo }}
          R_GUARDA_4: ${{ steps.procesador.outputs.guarda_4 }}
          R_GUARDA_10: ${{ steps.procesador.outputs.guarda_10 }}
          V_PERMITIR_UMBRAL_BAJO: ${{ inputs.permitir_umbral_bajo }}
          V_EXIGIR_INBOUND: ${{ inputs.exigir_inbound }}
          V_PERMITIR_SALTO: ${{ inputs.permitir_salto }}
          V_PERMITIR_MODELO_NUEVO: ${{ inputs.permitir_modelo_nuevo }}
          V_ABRIR_TRANSITO_DESCONOCIDO: ${{ inputs.abrir_transito_desconocido }}
        run: |
          set -uo pipefail
          if [ -z "${DB_URL:-}" ]; then
            echo "::warning title=Registro sin apuntar::Este run no tiene cadena de la base; la línea no se escribe y el job conserva su color."
            exit 0
          fi
          wf="${GITHUB_WORKFLOW_REF%%@*}"; wf="${wf##*/}"
          empezado=""
          arranque="$(ps -o lstart= -C Runner.Worker 2>/dev/null | head -n1 || true)"
          [ -n "$arranque" ] && empezado="$(date -u -d "$arranque" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || true)"
          guardas="$(printf '%s\n' "${R_GUARDA_4:-}" "${R_GUARDA_10:-}" | jq -cRs 'split("\n") | map(select(length > 0) | . as $t | (try fromjson catch {ilegible: $t})) | if length == 0 then empty else . end' 2>/dev/null || true)"
          filas="$(jq -cn --arg u "${V_PERMITIR_UMBRAL_BAJO:-}" --arg e "${V_EXIGIR_INBOUND:-}" --arg s "${V_PERMITIR_SALTO:-}" --arg m "${V_PERMITIR_MODELO_NUEVO:-}" --arg a "${V_ABRIR_TRANSITO_DESCONOCIDO:-}" \
            '[if $u == "si" then "permitir_umbral_bajo" else empty end, if $e == "si" then "exigir_inbound" else empty end, if $s == "si" then "permitir_salto" else empty end, if $m == "si" then "permitir_modelo_nuevo" else empty end, if $a == "si" then "abrir_transito_desconocido" else empty end] | if length == 0 then empty else {valvulas_abiertas: .} end' 2>/dev/null || true)"
          if timeout 45 psql "$DB_URL" -X -q -At -v ON_ERROR_STOP=1 \
               -v repo="$GITHUB_REPOSITORY" -v workflow="$wf" -v job="$GITHUB_JOB" \
               -v run_id="$GITHUB_RUN_ID" -v run_attempt="$GITHUB_RUN_ATTEMPT" -v evento="$GITHUB_EVENT_NAME" \
               -v resultado="$R_RESULTADO" -v modo="${R_MODO:-}" -v filas="$filas" -v guardas="$guardas" \
               -v empezado="$empezado" <<'SQL'
          set statement_timeout = '15s';
          select public.registrar_ejecucion(
            p_repo => :'repo', p_workflow => :'workflow', p_job => :'job',
            p_run_id => :'run_id'::bigint, p_run_attempt => :'run_attempt'::integer,
            p_evento => :'evento', p_resultado => :'resultado', p_modo => nullif(:'modo', ''),
            p_filas => nullif(:'filas', '')::jsonb, p_guardas_saltadas => nullif(:'guardas', '')::jsonb,
            p_empezado_en => nullif(:'empezado', '')::timestamptz);
          SQL
          then
            echo "Apuntado en registro_ejecuciones: ${wf} · ${GITHUB_JOB} · ${R_RESULTADO} · modo ${R_MODO:-—}${guardas:+ · guardas saltadas: $guardas}"
          else
            rc=$?
            echo "::warning title=Registro sin apuntar::No se pudo escribir la línea en registro_ejecuciones (salida ${rc}). El job conserva su color."
            exit "$rc"
          fi
