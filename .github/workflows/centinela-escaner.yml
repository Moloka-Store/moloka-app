# ============================================================
# Moloka - Centinela del proveedor mudo
# Ubicacion: .github/workflows/centinela-escaner.yml
#
# QUE HACE: lanza centinela_escaner.py, que mira la ULTIMA escritura de cada
# director en `escaner_memoria` y avisa por TELEGRAM si alguno lleva mas horas
# calladas que su umbral. Sale en ROJO cuando avisa.
#
# POR QUE: el 9-sep-2026 DBLine dejo de escribir a las 10:31 UTC y OcioStock a
# las 15:01; no se supo hasta el 10-sep por la tarde. Dos dias. El run de cada
# director salia rojo en Actions, pero un rojo en Actions no llega a donde esta
# Fernando, y "Que reponer" seguia ensenando el catalogo de anteayer.
#
# HORARIO: CUATRO PASADAS, 06:00 / 10:00 / 14:00 / 18:00 UTC (el cron de GitHub
# va en UTC; en verano Espana = UTC+2, o sea 08:00 / 12:00 / 16:00 / 20:00).
#   - La primera, a primera hora espanola. La ultima, a las 18:00 UTC: ningun
#     aviso llega a una hora en la que ya no se puede hacer nada con el.
#   - Y NO HAY PASADAS DE NOCHE A PROPOSITO. El hueco de 18:00 a 06:00 no retrasa
#     nada: con los horarios reales de los cuatro directores, el plazo de ninguno
#     puede vencerse entre las 15:00 y las 04:00 UTC (su franja de escritura mas
#     su umbral cae siempre dentro de 04:00-15:00). Lo comprueba el banco, que
#     saca la ventana de las cifras de HORARIOS y la cruza con ESTE cron.
#   - Bajo de 8 pasadas a 4 el 10-sep-2026: con umbrales de 22 y 26 h, la demora
#     maxima del aviso pasa de 2 h a 4 h y no cambia ninguna decision -- cuando
#     salta, el proveedor lleva casi un dia callado --, y a cambio los correos de
#     fallo de GitHub de un dia mudo bajan de 8 a 4.
#   OJO: en invierno (UTC+1) esto se corre 1 h antes en hora local. Aceptable.
#
# BLINDAJE:
#   - concurrency: dos pasadas no se pisan (cancel-in-progress: false).
#   - timeout-minutes: 10 => son cuatro consultas; mas que eso es que algo cuelga.
#   - workflow_dispatch: se puede lanzar a mano para probar.
#
# 🔒 LA LLAVE DE SERVICIO, como el escaner desde el 10-sep-2026. Un centinela que
#    lea con la anonima puede recibir 200 con CERO FILAS y declarar mudos a los
#    cuatro (o, peor, no ver la tabla y callarse). Sin la llave no arranca.
# ============================================================
name: Moloka - Centinela del proveedor mudo

on:
  schedule:
    - cron: '0 6,10,14,18 * * *'
  workflow_dispatch:

concurrency:
  group: centinela-escaner
  cancel-in-progress: false

jobs:
  centinela:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install supabase requests

      - name: Mirar la ultima escritura de cada director
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_TOKEN:       ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u centinela_escaner.py
