# ============================================================
# Moloka - El vigilante del escaner 2
# Ubicacion: .github/workflows/centinela-escaner.yml
#
# QUE HACE: lanza centinela_escaner.py, que mira si cada proveedor con horario en
# disp_parametros (TCG, HEO, DBLine, OcioStock, OSMA) ha perdido las dos ultimas lecturas
# previstas de su horario, y avisa por TELEGRAM: al caducar, un recordatorio cada 6 h
# como mucho mientras siga, y al volver a leer. Sale en ROJO mientras algo este caducado.
# La regla y su porque, en la cabecera del .py.
#
# >>> EL RELOJ ES CRON-JOB.ORG, NO ESTE FICHERO <<<  Como las pasadas: el `schedule:` de
#     GitHub llega horas tarde en esta cuenta (medido del 17 al 27-nov-2026: dos vueltas al
#     dia de las cuatro previstas, a las 01-03 UTC y a las 14-16 UTC). El trabajo de
#     cron-job.org (lo da de alta Fernando): POST a la API de dispatches de este workflow
#     con {"ref":"main"} y sin inputs, todos los dias a las :55 de 07 a 21 (Europe/Madrid).
#     Tiene que coincidir con RELOJ del .py, que el banco cruza con los horarios.
#
# EL `schedule:` SE QUEDA DE RESPALDO, A PROPOSITO: si el trabajo de cron-job.org se para
#   (cron-job.org lo desactiva solo tras varios fallos seguidos, o caduca la llave que usa,
#   y con ella se paran tambien las pasadas), algo sigue mirando, aunque llegue tarde. Una
#   vuelta de mas no repite ningun aviso (la marca) y de noche no suena (el .py calla
#   fuera de 07:00-22:59 de Madrid y lo deja para la mañana).
#
# ENSAYO (a mano): `ensayo: si` lee la base y escribe el informe, sin Telegram y sin tocar
#   la marca. Es lo que se puede lanzar desde una rama sin avisar a nadie.
#
# BLINDAJE:
#   - concurrency: dos vueltas no se pisan (cancel-in-progress: false).
#   - timeout-minutes: 10 => son unas pocas consultas; mas que eso es que algo cuelga.
#
# 🔒 LA LLAVE DE SERVICIO: con la anonima se pueden recibir cero filas sin error y declarar
#    caducados a todos (o no ver nada y callarse). Sin la llave no arranca.
# 🔴 REPO PUBLICO: el registro solo lleva estados, horas y recuentos; el motivo de una
#    pasada va solo al Telegram.
# ============================================================
name: Moloka - Centinela del proveedor mudo

on:
  workflow_dispatch:
    inputs:
      ensayo:
        description: 'Ensayo: lee la base y escribe el informe, sin Telegram y sin tocar la marca'
        type: choice
        options: ['no', 'si']
        default: 'no'
  schedule:
    - cron: '35 7,11,15 * * *'

concurrency:
  group: centinela-escaner
  cancel-in-progress: false

jobs:
  centinela:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install supabase requests tzdata

      - name: Mirar si cada proveedor sigue leyendo
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_TOKEN:       ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          CENTINELA_ENSAYO:     ${{ inputs.ensayo }}
        run: python -u centinela_escaner.py
