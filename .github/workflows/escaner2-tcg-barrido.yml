# ============================================================
# Moloka - Escaner 2 · BARRIDO DEL ESCANEO PRO DE TCG (encargo T3, 14-oct-2026; copiado del de OcioStock, encargo OC3)
#
# Lo disparan los botones de la v2 (moloka-app-v2, Escaneo PRO · tarjeta TCG), con el mismo mecanismo que HEO
# (workflow_dispatch con GH_TOKEN). El input `modo` dice cual de los tres:
#   marcas   · las marcas de la fila TCG de reglas_director (marcas y marcas_es), Magic y Yu-Gi-Oh en CUALQUIER
#              idioma y sin el corte de rank del viejo (y el valor si no llega nada);
#   todas    · todas las marcas, solo lo que se puede comprar ya, SIN leer reglas_director;
#   elegidas · las marcas del selector de la v2 (input `marcas`, lista JSON), SIN leer reglas_director. El selector de
#              TCG no tiene ofertas: el input `ofertas` tiene que llegar a false.
#
# 🔴 LOS INPUTS VIAJAN POR `env:`, NUNCA DENTRO DE `run:` (como en el de HEO): por env llegan como texto y el programa
#    los valida antes de abrir ningun cliente.
#
# trabaja sobre la foto de disponibilidad que ya esta en la base
# (escaner2-tcg-disponibilidad.yml, con el precio del tramo mas barato ya aplicado). Construye la FOTO de la pasada
# (disponible y sin preventa, sin chase suelto, una fila por EAN con su tramo mas barato) y deja en el almacen cerrado
# `escaner2` la lista de EAN para los cuatro Visualizadores de Keepa (ES, IT, FR, DE).
#
# 🆕 EN DIRECTO (encargo PD, 27-nov-2026; Fernando: «El PRO tiene que ser en directo»): ANTES de construir la foto,
#    el barrido LEE A TCG EN ESE MOMENTO con la MISMA pasada que la lectura horaria (escaner2_tcg_disponibilidad.py, con sus guardas
#    y disp_aplicar_pasada; escaner2_pro_en_directo.py). Solo sigue si esa pasada de ESTE run queda 'aplicada' o
#    «al día»; si no, la pasada del barrido queda 'fallida' con el motivo y NO hay foto: nunca se valora con la lectura
#    guardada. Por eso este workflow lleva ahora los secretos de TCG y, para las novedades de esa pasada, los de Keepa y
#    Telegram, como el horario.
#
# 🆕 LA PAGINA ANTI-ROBOTS DE TCG (la de escaner2_tcg_web.Pared, que la web ensena a ALGUNAS maquinas en el login):
#    si la ve el job `barrer`, la pasada del barrido SIGUE 'descargando' y lo intenta `barrer_2` (y luego `barrer_3`),
#    jobs del MISMO run, cada uno en otra maquina, que retoman la misma pasada. Asi la pantalla de la v2 no la pierde:
#    es la misma fila y el mismo run en marcha. En el ultimo intento, 'fallida' con el motivo. (La horaria lo hace
#    relanzando su workflow; aqui no, porque la pantalla solo sigue la ultima pasada y los runs del barrido.)
#
# 🔴 REPO PUBLICO: este registro lo ve cualquiera. El programa SOLO imprime estados y recuentos; nada de precios,
#    EAN, nombres ni el texto de un error (va a la base, que es privada).
# 🔒 Los secretos del proveedor (y los de Keepa y Telegram) SOLO en el paso de la lectura; los rescates, solo la base.
# >>> SIN RELOJ <<<  Solo cuando se pulsa el boton (o a mano desde Actions).
# ============================================================
name: Moloka - Escaner 2 · Barrido TCG

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'marcas (las de siempre), todas (todas las marcas) o elegidas (las del selector de la v2)'
        type: choice
        options: ['marcas', 'todas', 'elegidas']
        default: 'marcas'
        required: false
      marcas:
        description: 'Solo en el modo elegidas: la lista de marcas, en JSON (["Funko", "Ultra Pro"])'
        type: string
        default: ''
        required: false
      ofertas:
        description: 'El selector de TCG no tiene ofertas: dejar en false'
        type: boolean
        default: false
        required: false

# 🔒 Barrido y cruce de TCG, de uno en uno (el cruce lee la foto que el barrido deja): grupo PROPIO, que no espera
#    a HEO. 🆕 (Encargo PD) La LECTURA del barrido (sus jobs `barrer…`) entra ADEMAS en el grupo de la horaria.
concurrency:
  group: escaner2-tcg-pro
  cancel-in-progress: false

jobs:
  # 🆕 (Encargo PD, 27-nov-2026) PRIMERO SE ABRE LA PASADA, en un job aparte y sin esperar turno: la pantalla de la v2
  #    la ve «descargando» al momento, aunque la lectura tenga que esperar a la horaria.
  abrir:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      pasada: ${{ steps.abrir.outputs.pasada }}
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --quiet supabase==2.31.0

      - name: Abrir la pasada del barrido
        id: abrir
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MODO_BARRIDO:         ${{ inputs.modo }}
          MARCAS_ELEGIDAS:      ${{ inputs.marcas }}
          OFERTAS_ELEGIDAS:     ${{ inputs.ofertas }}
          PYTHONIOENCODING:     utf-8
        run: python -u escaner2_tcg_barrido.py --abrir

  barrer:
    needs: abrir
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # 🔒 EL GRUPO DE LA LECTURA HORARIA (escaner2-tcg): nunca dos lecturas de TCG a la vez, ni dos sesiones en su web. Si la
    #    horaria esta leyendo, este job espera a que acabe (la pasada del barrido ya esta abierta: la pantalla la ve).
    concurrency:
      group: escaner2-tcg
      cancel-in-progress: false
    outputs:
      pared:     ${{ steps.barrer.outputs.pared }}
      pasada:    ${{ steps.barrer.outputs.pasada }}
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --quiet supabase==2.31.0 openpyxl==3.1.5 pandas==3.0.0 numpy==2.4.6 psycopg2-binary==2.9.13 curl_cffi==0.15.0 requests==2.34.2

      - name: La lectura de TCG en directo, y de ella la pasada y la lista
        id: barrer
        # El tope en el PASO (15 min), no solo en el job (20): si se agota, los rescates de abajo tienen tiempo.
        timeout-minutes: 15
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MODO_BARRIDO:         ${{ inputs.modo }}
          MARCAS_ELEGIDAS:      ${{ inputs.marcas }}
          OFERTAS_ELEGIDAS:     ${{ inputs.ofertas }}
          TCG_USER:             ${{ secrets.TCG_USER }}
          TCG_PASS:             ${{ secrets.TCG_PASS }}
          KEEPA_API_KEY:        ${{ secrets.KEEPA_API_KEY }}
          TELEGRAM_TOKEN:       ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          INTENTO:              '1'
          ESCANER2_PASADA:      ${{ needs.abrir.outputs.pasada }}
          PYTHONIOENCODING:     utf-8
        run: python -u escaner2_tcg_barrido.py

      # 🔴 SI EL RUN MUERE A MEDIAS, NADA SE QUEDA COLGADO: ni la lectura de este run en 'leyendo' ni la pasada del
      #    barrido en 'descargando' (las dos quedan 'fallida'; solo las de ESTE run).
      - name: Rescate · la lectura de este run, si se ha quedado leyendo
        if: failure() || cancelled()
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONIOENCODING:     utf-8
        run: python -u escaner2_tcg_disponibilidad.py --rescate

      - name: Rescate · la pasada de este run, si se ha quedado descargando
        if: failure() || cancelled()
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONIOENCODING:     utf-8
        run: python -u escaner2_rescate.py pasada

  barrer_2:
    needs: [abrir, barrer]
    if: needs.barrer.outputs.pared == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # 🔒 EL GRUPO DE LA LECTURA HORARIA (escaner2-tcg): nunca dos lecturas de TCG a la vez, ni dos sesiones en su web. Si la
    #    horaria esta leyendo, este job espera a que acabe (la pasada del barrido ya esta abierta: la pantalla la ve).
    concurrency:
      group: escaner2-tcg
      cancel-in-progress: false
    outputs:
      pared:     ${{ steps.barrer.outputs.pared }}
      pasada:    ${{ steps.barrer.outputs.pasada }}
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --quiet supabase==2.31.0 openpyxl==3.1.5 pandas==3.0.0 numpy==2.4.6 psycopg2-binary==2.9.13 curl_cffi==0.15.0 requests==2.34.2

      - name: Intento 2 en otra máquina · la lectura de TCG y de ella la pasada
        id: barrer
        # El tope en el PASO (15 min), no solo en el job (20): si se agota, los rescates de abajo tienen tiempo.
        timeout-minutes: 15
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MODO_BARRIDO:         ${{ inputs.modo }}
          MARCAS_ELEGIDAS:      ${{ inputs.marcas }}
          OFERTAS_ELEGIDAS:     ${{ inputs.ofertas }}
          TCG_USER:             ${{ secrets.TCG_USER }}
          TCG_PASS:             ${{ secrets.TCG_PASS }}
          KEEPA_API_KEY:        ${{ secrets.KEEPA_API_KEY }}
          TELEGRAM_TOKEN:       ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          INTENTO:              '2'
          ESCANER2_PASADA:      ${{ needs.barrer.outputs.pasada }}
          PYTHONIOENCODING:     utf-8
        run: python -u escaner2_tcg_barrido.py

      # 🔴 SI EL RUN MUERE A MEDIAS, NADA SE QUEDA COLGADO: ni la lectura de este run en 'leyendo' ni la pasada del
      #    barrido en 'descargando' (las dos quedan 'fallida'; solo las de ESTE run).
      - name: Rescate · la lectura de este run, si se ha quedado leyendo
        if: failure() || cancelled()
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONIOENCODING:     utf-8
        run: python -u escaner2_tcg_disponibilidad.py --rescate

      - name: Rescate · la pasada de este run, si se ha quedado descargando
        if: failure() || cancelled()
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONIOENCODING:     utf-8
        run: python -u escaner2_rescate.py pasada

  barrer_3:
    needs: [abrir, barrer_2]
    if: needs.barrer_2.outputs.pared == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # 🔒 EL GRUPO DE LA LECTURA HORARIA (escaner2-tcg): nunca dos lecturas de TCG a la vez, ni dos sesiones en su web. Si la
    #    horaria esta leyendo, este job espera a que acabe (la pasada del barrido ya esta abierta: la pantalla la ve).
    concurrency:
      group: escaner2-tcg
      cancel-in-progress: false
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --quiet supabase==2.31.0 openpyxl==3.1.5 pandas==3.0.0 numpy==2.4.6 psycopg2-binary==2.9.13 curl_cffi==0.15.0 requests==2.34.2

      - name: Intento 3 en otra máquina · la lectura de TCG y de ella la pasada
        id: barrer
        # El tope en el PASO (15 min), no solo en el job (20): si se agota, los rescates de abajo tienen tiempo.
        timeout-minutes: 15
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MODO_BARRIDO:         ${{ inputs.modo }}
          MARCAS_ELEGIDAS:      ${{ inputs.marcas }}
          OFERTAS_ELEGIDAS:     ${{ inputs.ofertas }}
          TCG_USER:             ${{ secrets.TCG_USER }}
          TCG_PASS:             ${{ secrets.TCG_PASS }}
          KEEPA_API_KEY:        ${{ secrets.KEEPA_API_KEY }}
          TELEGRAM_TOKEN:       ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          INTENTO:              '3'
          ESCANER2_PASADA:      ${{ needs.barrer_2.outputs.pasada }}
          PYTHONIOENCODING:     utf-8
        run: python -u escaner2_tcg_barrido.py

      # 🔴 SI EL RUN MUERE A MEDIAS, NADA SE QUEDA COLGADO: ni la lectura de este run en 'leyendo' ni la pasada del
      #    barrido en 'descargando' (las dos quedan 'fallida'; solo las de ESTE run).
      - name: Rescate · la lectura de este run, si se ha quedado leyendo
        if: failure() || cancelled()
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONIOENCODING:     utf-8
        run: python -u escaner2_tcg_disponibilidad.py --rescate

      - name: Rescate · la pasada de este run, si se ha quedado descargando
        if: failure() || cancelled()
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONIOENCODING:     utf-8
        run: python -u escaner2_rescate.py pasada

  # 🔴 EL ULTIMO RESCATE: si un job de la lectura no llega a correr (cancelado mientras esperaba su turno, o un intento
  #    de otra maquina que no arranca), la pasada de este run no se queda 'descargando' para siempre.
  rescate:
    needs: [abrir, barrer, barrer_2, barrer_3]
    if: always() && needs.abrir.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --quiet supabase==2.31.0

      - name: Rescate · la pasada de este run, si sigue descargando
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONIOENCODING:     utf-8
        run: python -u escaner2_rescate.py pasada
