name: Moloka - Cargar ASIN manual (one-off)

# Carga ÚNICA a mano: 25 ASIN + 3 nombres. A DEMANDA, sin reloj.
# Por defecto: PRODUCCIÓN + ENSAYO (corre entero y se deshace: no toca nada de Elena).
# Mira SIEMPRE la línea MODO: del log (el desplegable se queda donde lo dejaste).
on:
  workflow_dispatch:
    inputs:
      destino:
        description: 'Base de datos destino'
        type: choice
        # 🔴 30-sep-2026 (encargo A): staging se jubiló. Solo queda producción; lo que no escribe es el modo ensayo (rollback).
        options: [produccion]
        default: produccion
      modo:
        description: 'ensayo = solo comprueba y lista; aplicar = escribe los 25 ASIN'
        type: choice
        options: [ensayo, aplicar]
        default: ensayo

concurrency:
  group: cargar-asin-manual
  cancel-in-progress: false

jobs:
  cargar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --quiet psycopg2-binary

      - name: Ejecutar carga
        env:
          DESTINO: ${{ inputs.destino }}
          MODO: ${{ inputs.modo }}
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -u cargar_asin_manual.py
