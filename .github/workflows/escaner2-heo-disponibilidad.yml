# ============================================================
# Moloka - Escaner 2 · DISPONIBILIDAD DE HEO (encargo E, tramo 3, pieza 1, 29-sep-2026)
#
# Baja el catalogo de HEO (todas las marcas, sueltos y cajas, disponible o no; lo que no trae codigo
# de barras solo se cuenta) y deja en la base lo que tiene HEO ahora (`disp_estado`) y lo que ha
# cambiado desde la pasada anterior (`disp_cambio`). Sin Keepa y sin Amazon. Si uno de los tres
# endpoints de HEO no llega entero, la pasada se cierra 'fallida' y no se aplica. Es la pieza de la
# que saldran las novedades de Funko y, cuando Fernando lo decida, la fuente de «lo que tiene HEO»
# para Reponer y el Trackeador.
#
# Vive aqui porque aqui estan las credenciales de HEO. Repo publico: no gasta minutos.
#
# 🔒 NO TOCA EL ESCANER VIEJO NI EL ESCANER 2: ni director-heo.yml, ni escaner_memoria, ni
#    escaner2_*. Solo disp_pasada, disp_lectura y la funcion disp_aplicar_pasada (tablas de la
#    migracion 20260929070300 de moloka-app-v2, que tiene que estar APLICADA antes del primer run).
#
# >>> SIN RELOJ, A PROPOSITO <<<  Se lanza a mano desde Actions. El reloj es cron-job.org (un
#     `schedule:` de GitHub llega ~5 h tarde en esta cuenta, medido el 17-sep-2026) y lo encienden
#     Fernando y Cowork con Fernando delante: laborables cada hora de 08:00 a 20:00 y a las 21:00;
#     sabado y domingo a las 08:00 y a las 09:00. En punto (el director viejo va a y media).
#     La tarea: POST https://api.github.com/repos/Moloka-Store/moloka-app/actions/workflows/escaner2-heo-disponibilidad.yml/dispatches
#     con cuerpo {"ref":"main"} y las mismas cabeceras que ya usan los directores.
# ============================================================
name: Moloka - Escaner 2 · Disponibilidad HEO

on:
  workflow_dispatch:

# 🔒 EL MISMO GRUPO QUE EL BARRIDO Y EL CRUCE DE ESCANEO PRO (revision de Cowork, 29-sep-2026): no se
#    baja HEO dos veces a la vez con las mismas credenciales. Sin cancelar lo que esta en curso.
#    ⚠️ Lo que hace GitHub con un grupo, dicho para que no sorprenda: un run que llega mientras otro
#    corre queda PENDIENTE, y en cada grupo solo hay UN pendiente; si llega otro, el pendiente anterior
#    se CANCELA sin llegar a correr (no el que esta en curso). Ver el parte del 29-sep-2026.
concurrency:
  group: escaner2-heo
  cancel-in-progress: false

jobs:
  leer:
    runs-on: ubuntu-24.04
    # Solo leer el repo: todo lo demas lo hace con la llave de servicio de Supabase.
    permissions:
      contents: read
    # La API de HEO son tres endpoints paginados de 500 en 500: el barrido tarda 5-6 min (medido).
    timeout-minutes: 30
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        # Las mismas versiones FIJADAS que el barrido (requests: API de HEO · supabase: base).
        run: pip install supabase==2.31.0 requests==2.34.2

      - name: Leer HEO y aplicar la pasada
        # El tope va en el PASO (25 min), no solo en el job (30): si se agota, el rescate corre.
        timeout-minutes: 25
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HEO_USER:             ${{ secrets.HEO_USER }}
          HEO_PASS:             ${{ secrets.HEO_PASS }}
          PYTHONIOENCODING:     utf-8
        run: python -u escaner2_heo_disponibilidad.py

      # 🔴 SI EL RUN MUERE A MEDIAS, LA PASADA NO SE QUEDA 'leyendo' PARA SIEMPRE.
      - name: Rescate · si el run ha fallado, la pasada de este run queda 'fallida'
        if: failure() || cancelled()
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONIOENCODING:     utf-8
        run: python -u escaner2_heo_disponibilidad.py --rescate
