# MEDIDOR · ¿cambia algo parsear los TSV de Amazon con QUOTE_NONE? SOLO LECTURA.
#
# 🔴 POR QUÉ UN WORKFLOW Y NO UNA CONSULTA: lo que se compara son DOS PARSEOS DEL MISMO
#    FICHERO, y los ficheros están en el buzón de Storage, que es privado. La base guarda
#    el `crudo` de cuatro de los cinco informes, pero el `crudo` es la fila YA PARSEADA:
#    sirve para ver qué produjo el parseo de entonces, no para volver a parsear. Para
#    comparar dos lecturas hace falta el fichero.
#
# 🔒 NO ESCRIBE NADA: ni en la base ni en el Storage. Lista, baja y compara en memoria.
name: Moloka - MEDIR QUOTE_NONE (los cinco TSV)

on:
  workflow_dispatch:

concurrency:
  group: medir-quote-none
  cancel-in-progress: false

jobs:
  medir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 🔴 psycopg2 SÍ hace falta, y lo escribí al revés: puse «aquí no hace falta, el
      #    medidor no importa ningún procesador». Es cierto que no importa ninguno — pero
      #    importa `foto_comun` (para `listar_buzon`/`descargar_buzon`), y ESE sí lo importa
      #    arriba del todo. El run 32472323573 murió con `ModuleNotFoundError: psycopg2`.
      # ⚠️ La lección, que es la de siempre: escribí en un comentario algo que no había
      #    comprobado. Reusar la pieza de verdad tiene ese precio, y sigue siendo mejor
      #    trato que copiar el código de bajar ficheros.
      - name: Instalar dependencias
        run: pip install --quiet supabase psycopg2-binary

      - name: Medir
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -u medir_quote_none.py
