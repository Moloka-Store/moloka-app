name: Moloka - Procesar CUSTOM ANALYTICS

# Procesador propio de Fase 0 para el export "Custom Analytics" del Seller (el eje
# de la DEMANDA: visitas, sesiones, conversión y LA BUY BOX, por ASIN). A DEMANDA,
# sin reloj. Espejo de procesar-transacciones.yml. El fichero no trae el país: lo
# manda el selector. La FECHA sí la trae (wb.properties.created → leido_at).
# Cajón PELÍCULA DE LECTURAS desde el 10-ago-2026: cada carga apila UNA lectura del
# contador y recierra por IGUALDAD de (pais, leido_at), dejando intactas las demás
# lecturas y países. Escalera: staging ensayo → staging aplicar → verificación SQL →
# producción ensayo → producción aplicar → SQL.
#
# ⚠️ ESTE WORKFLOW LO DISPARA LA APP DE ELENA, no solo una persona desde aquí. La ficha
#   `custom_analytics` de `lib/buzones/catalogo.ts` (repo moloka-app-v2) lo lanza desde
#   la pantalla de Buzones con `entorno: produccion` y `modo: aplicar` FIJOS. Por eso los
#   inputs de este fichero no se tocan a la ligera: quitar uno que la app todavía manda
#   hace que GitHub rechace el disparo entero y Elena se come el error sin saber por qué.
#   Se amplía antes de contraer (ver los dos inputs OBSOLETOS de abajo).
#
# ============================================================================
# CÓMO SE LANZA UNA CARGA A MANO (sin depender de que nadie se acuerde)
# ----------------------------------------------------------------------------
#   entorno = produccion   ·   modo = aplicar
#   pais    = el del fichero        (ES / IT / FR — lo verifica la guarda 6.6)
#   fichero = el nombre EXACTO subido a informes/custom_analytics/
#
# 🔴 UNA EJECUCIÓN POR FICHERO. Los tres países se cargan por separado: no hay
#    forma de subir tres en una pasada, ni debe haberla (cada uno declara su país).
#
# 🔴 Y SI HAY MÁS DE UNA LECTURA DEL MISMO PAÍS, SIEMPRE DE MÁS ANTIGUA A MÁS
#    NUEVA — Y NADIE LO COMPRUEBA POR TI. El orden NO es cosmético.
#    ⚠️ Aquí ponía que "si se mete primero la del 7 y luego la del 30 de julio, la
#    vieja parece un retroceso y se rechaza". ERA FALSO, y corregirlo importa porque
#    es texto que se lee justo antes de lanzar. La guarda 6.14 solo compara HACIA
#    ADELANTE: si la lectura que subes es ANTERIOR a la última cargada, ni la mira.
#    De eso avisa la 6.8, que GRITA y SIGUE. Medido el 10-ago-2026 (run 31416925455):
#    `CA_ES_02ago_DISCONTINUO.xlsx` —246 ASIN contra 321, un retroceso global de
#    verdad— pasó el ensayo ENTERO sin que nada lo parase.
#    Consecuencia práctica: meterlas desordenadas NO da error, mete una lectura mala
#    en medio de la serie y el `lag()` de `v_demanda_asin_ultima` calcula el delta
#    contra la lectura equivocada. El agujero "VIEJA DETRÁS DE NUEVA" está ABIERTO y
#    anotado en §2 de CLAUDE.md.
#    La fecha de cada fichero es su `wb.properties.created`, y el ENSAYO la imprime
#    para todos los ficheros del buzón antes de tocar nada — lánzalo con
#    `modo=ensayo` si no sabes en qué orden van. Hoy es tu única red.
#
# ⚠️ QUÉ ESPERAR DE LAS GUARDAS, PARA QUE UN ROJO NO PAREZCA UNA AVERÍA. Las tres
#    abortan sin escribir nada, y ninguna de las tres es un fallo del sistema:
#    · 6.6  el país no cuadra al cruzar cuotas con transacciones
#           → te has equivocado de selector, o el .xlsx es de otro marketplace.
#    · 6.15 la lectura trae los MISMOS datos que la anterior de ese país
#           → Amazon no ha refrescado su panel. NO es un fallo y no se pierde nada:
#             el fichero se queda en el buzón. Mira hasta qué fecha dice el Seller
#             que hay datos y vuelve a intentarlo cuando ese aviso avance.
#    · 6.14 este fichero no es la siguiente lectura del mismo contador
#           → se exportó con OTRO RANGO. Vuelve al Seller, pon «Desde el inicio
#             de año» (§2 de CLAUDE.md), re-exporta y sube ese.
#           Aborta si CUALQUIERA de estos CUATRO (criterio de Fernando, 11-ago-2026):
#             1. algún acumulado viene NEGATIVO
#             2. ≥5% de las comparaciones ASIN×métrica bajan
#             3. un desplome de TRÁFICO (visitas, sesiones o buybox_visiones), con el
#                valor anterior ≥100, se lleva MÁS DE LA MITAD
#             4. bajan las NUEVE métricas acumuladas a la vez
#           🔴 EL CRITERIO 3 SOLO MIRA TRÁFICO, y no es un descuido: **Amazon recalcula
#           PEDIDOS, no TRÁFICO.** Una cancelación mueve unidades y euros —un ASIN con
#           UNA unidad que se cancela es un −100%—, pero nadie devuelve una visita. Las
#           seis de pedido quedan fuera del 3 y las cubre el 2, que es el que coge el
#           caso masivo. Medido el 11-ago-2026 sobre cuatro pares: en los tres buenos,
#           CERO desplomes de tráfico; en el malo, 610.
#           ⚠️ Si el 3 salta SOLO, no re-exportes: no está probado que el tráfico no
#           pueda bajar legítimamente (una fusión de fichas, una depuración de tráfico
#           inválido). Ése es el caso a estudiar, y el log lo dice con esas palabras.
#           Si baja algo pero ninguno de los cuatro salta, es Amazon recalculando
#           (cancelaciones, devoluciones) → GRITA la lista entera y CARGA.
#           ⚠️ OJO CON LOS DOS CRITERIOS QUE YA SE PROBARON Y NO VALÍAN, porque el
#           que los eche de menos los va a querer devolver: «cualquier bajada»
#           rechazó una carga BUENA de IT en producción el 10-ago-2026 (run
#           31416495261) por DOS bajadas sobre 1.008 —un ASIN, 9→8 unidades y 19,99 €
#           menos, o sea UNA CANCELACIÓN—, y «cualquier total que baje» hace lo mismo
#           un piso más arriba en los países chicos. El criterio 4 es la versión de
#           ése que sí distingue.
#           🔒 Y el diagnóstico se CALCULA: el log imprime la tabla de totales y las
#           cuatro cifras en las que se basa, así que el veredicto se comprueba en vez
#           de creerse.
#    · 6.14 ZONA GRIS: la comparación no puede probar nada
#           → NO dice que el fichero esté mal: dice que no lo sabe, y para. Pasa
#             cuando quedan menos de 20 ASIN comunes con la lectura anterior (o menos
#             del 30% de ella), o cuando esa lectura es de hace más de 31 días.
#             Mira lo que dice el log, y si estás seguro, relanza con `forzar = si`.
#             `forzar` levanta SOLO esto: los cuatro criterios de arriba siguen.
#
# 🔒 Y en `ensayo` NO se escribe nada: corre entero contra la base real y se deshace.
#    Es gratis, así que ante la duda, ensayo primero.
# ============================================================================
on:
  workflow_dispatch:
    inputs:
      entorno:
        description: 'Base de datos destino'
        type: choice
        options: [staging, produccion]
        default: staging
      modo:
        # ⚠️ Esto decía "recierra la ventana en demanda_asin" hasta el 10-ago-2026, y era
        #   una frase del modelo VIEJO que se leía en el propio formulario de disparo.
        #   Ya no hay ventanas: se apila una lectura.
        description: 'ensayo = corre entero contra la base real y lo DESHACE, no escribe nada (es gratis: ante la duda, ensayo). aplicar = apila la lectura en demanda_asin'
        type: choice
        options: [ensayo, aplicar]
        default: ensayo
      pais:
        description: 'País del fichero (LO MANDA EL SELECTOR, no se deduce). La guarda 6.6 lo VERIFICA cruzando cuotas con transacciones: si no cuadra, ABORTA.'
        type: choice
        options: [ES, IT, FR]
        default: ES
      # (Aquí vivían `periodo_desde` y `periodo_hasta`, y se fueron el 10-ago-2026 al
      #  cerrarse la secuencia de tres pasos: el procesador dejó de usarlos, luego la ficha
      #  de moloka-app-v2 dejó de mandarlos, y solo entonces se borran de aquí. Ese orden
      #  era obligatorio: un `workflow_dispatch` rechaza el disparo ENTERO si le llega un
      #  input no declarado, así que borrarlos antes le habría dado 422 a Elena.)
      fichero:
        # Con ES/IT/FR en la misma carpeta, "el más reciente" es una lotería: aquí
        # pedir el nombre EXACTO es lo NORMAL. Vacío = el más reciente. Si el nombre
        # no está en el buzón, ABORTA (no cae al más reciente). El catálogo v2 pasa
        # el nombre exacto (inputFichero: 'fichero').
        # 🔴 Esta frase prometía hasta el 10-ago-2026 que "la guarda 6.14 rechaza una vieja
        #   detrás de una nueva". ERA FALSO, y es la clase de mentira que más daño hace:
        #   la promesa está en la pantalla desde la que se lanza, así que quien la lee se
        #   confía. La 6.14 solo compara HACIA ADELANTE (`leido_at > ref_cual`); una lectura
        #   anterior a la última la ve la guarda 6.8, que GRITA y sigue. Medido: el fichero
        #   `CA_ES_02ago_DISCONTINUO.xlsx` —un retroceso global de verdad, 246 ASIN contra
        #   321— pasó el ensayo entero sin que nada lo parase (run 31416925455).
        #   El agujero "VIEJA DETRÁS DE NUEVA" sigue ABIERTO, y lo que este PR le quita es
        #   una esquina, no el agujero: el criterio 1 de la 6.14 (ningún acumulado
        #   negativo) mide el FICHERO y no la comparación, así que corre mande quien mande
        #   el orden. Ese CA_ES_02ago_DISCONTINUO trae dos negativos, o sea que hoy sí lo
        #   pararía metido por detrás. Pero un export de otro rango SIN negativos seguiría
        #   colándose: el orden de carga sigue siendo responsabilidad de quien lanza.
        description: 'Nombre EXACTO del .xlsx del buzón. UNA ejecución por fichero. 🔴 Si hay varias lecturas del mismo país, cárgalas TÚ de MÁS ANTIGUA a MÁS NUEVA: NADIE lo comprueba del todo. Los criterios 2, 3 y 4 de la 6.14 solo miran hacia adelante; una lectura anterior a la última solo la AVISA la 6.8, que no aborta. Vacío = el más reciente.'
        type: string
        required: false
        default: ''
      forzar:
        # 🔴 INPUT NUEVO (11-ago-2026), y nace con default 'no' A PROPÓSITO: añadir un
        #   input con default es compatible hacia atrás, así que la ficha `custom_analytics`
        #   de moloka-app-v2 puede seguir sin mandarlo y el botón de Elena no se entera.
        #   Lo contrario —quitar un input que la app manda— es lo que da 422 (ver arriba).
        # 🔒 QUÉ LEVANTA Y QUÉ NO. Levanta SOLO la ZONA GRIS de la 6.14: los casos en que
        #   la comparación con la lectura anterior no puede probar nada (quedan cuatro ASIN
        #   comunes, o la referencia es de hace meses). NO levanta los cuatro criterios de
        #   aborto duro: eso sería apagar la evidencia en vez de mirarla, o sea un
        #   `ON_ERROR_STOP=0` con otro nombre (§3 de CLAUDE.md).
        description: 'Solo para la ZONA GRIS de la guarda 6.14 (cuando la comparación con la lectura anterior no puede probar nada). NO levanta los cuatro criterios de aborto. Déjalo en «no» salvo que el log te haya pedido expresamente relanzar con «si».'
        type: choice
        # 🔴 ENTRECOMILLADOS, y no es manía: en YAML un `no` suelto es el BOOLEANO false
        #   (el "problema de Noruega": `NO` = Norway = false). Medido el 11-ago-2026 con
        #   PyYAML sobre este mismo fichero: `options: [no, si]` se lee `[False, 'si']`.
        #   Con comillas es la cadena 'no', que es lo que el procesador espera leer.
        options: ['no', 'si']
        default: 'no'

concurrency:
  group: procesar-custom-analytics
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        # Primer procesador que lee un .xlsx → openpyxl (versión ya fijada en
        # requirements.txt, para no estrenar otra). Los workflows instalan a mano,
        # no usan requirements.txt.
        run: pip install --quiet supabase psycopg2-binary openpyxl==3.1.5

      - name: Ejecutar procesador
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ENTORNO: ${{ inputs.entorno }}
          MODO: ${{ inputs.modo }}
          PAIS: ${{ inputs.pais }}
          FICHERO: ${{ inputs.fichero }}
          FORZAR: ${{ inputs.forzar }}
          DB_URL: ${{ inputs.entorno == 'produccion' && secrets.SUPABASE_DB_URL || secrets.STAGING_DB_URL }}
        run: python -u procesador_custom_analytics.py
