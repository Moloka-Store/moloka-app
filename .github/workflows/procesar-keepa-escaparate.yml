name: Moloka - Procesar KEEPA_ESCAPARATE

# 🔑 EL TÍTULO DE CADA CORRIDA LLEVA EL MODO Y EL FICHERO (encadenado, 01-oct-2026). No es
#    decoración: es la MEMORIA del encadenado. El job `encadenar` y la ruta de disparo de la v2
#    cuentan los intentos de un fichero contando corridas con este título, sin tabla nueva.
# 🔒 El texto está repetido en DOS sitios más, y tiene que ser EL MISMO al carácter:
#    `titulo_corrida()` en encadenar_keepa_escaparate.py (lo vigila test_encadenar_keepa.py
#    leyendo este YAML) y `porFichero.tituloCorrida` en lib/buzones/catalogo.ts de la v2.
run-name: "Keepa · ${{ inputs.modo }} · ${{ inputs.fichero || '(el más reciente)' }}"

# Pieza nueva de la Fase 0 de la v2. A DEMANDA, sin reloj. Espejo de
# procesar-salud-fba.yml. Por defecto: PRODUCCIÓN + ENSAYO (no toca nada).
# Cadena (desde el 30-sep-2026, sin staging): ensayo en producción → aplicar →
#           verificación SQL.
on:
  workflow_dispatch:
    inputs:
      entorno:
        description: 'Base de datos destino'
        type: choice
        # 🔴 30-sep-2026 (encargo A): staging se jubiló. Solo queda producción; lo que no escribe es el modo ensayo (rollback).
        options: [produccion]
        default: produccion
      modo:
        description: 'ensayo = solo comprueba y dice qué escribiría; aplicar = vuelca keepa_escaparate'
        type: choice
        options: [ensayo, aplicar]
        default: ensayo
      fichero:
        # Cada export de Keepa es de UN país. Con los cuatro (DE/FR/IT/ES) en el
        # buzón, "el más reciente" procesaría siempre el mismo: esto deja elegir.
        # Si el nombre no está en el buzón, ABORTA (no cae al más reciente).
        description: 'Nombre EXACTO del .csv a procesar. Vacío = el más reciente (por defecto).'
        type: string
        required: false
        default: ''
      encadenado:
        # 🆕 01-oct-2026. Lo pone a true SOLO el job `encadenar` al lanzar el siguiente fichero.
        # Cambia una cosa: un fichero cuya foto viva de su país ya es de un día POSTERIOR se
        # SALTA en verde en vez de abortar en rojo por la Guarda 11 (ahí el fichero lo ha
        # elegido una máquina mirando el buzón, no una persona). A mano, déjalo en false.
        description: 'Uso interno del encadenado. A mano: false.'
        type: boolean
        default: false

concurrency:
  group: procesar-keepa-escaparate
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ubuntu-24.04
    # 🔴 TOPE CONTRA CUELGUES (encargo AJ, 24-sep-2026). Sin él, GitHub espera 6 h. El
    #    24-sep el ledger se quedó 71 min colgado esperando la respuesta del refresco
    #    del Trackeador: la base se reinició a mitad (06:35:16 Madrid) y nadie se lo dijo (run 35956134193).
    #    15 min, medido con los runs de los nueve procesar-*.yml (622 runs): el éxito más
    #    largo de todos fue paneu-aptos, 587 s, el 29-jul; desde el 29-jul ninguno pasa
    #    de 137 s. Un corte por tope sale `cancelled` y el paso del registro lo apunta
    #    así (probado con tope de 1 min en staging, run 35843826193).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --quiet supabase psycopg2-binary

      # 🔒 La mesa de pruebas de la guarda de columnas, ANTES del procesador. Va aquí y
      #    no en un workflow suyo porque en este repo NADA corre en push ni en PR: un
      #    test que no se lanza es decoración, y la casa ya se comió un falso verde por
      #    eso. Tarda menos de un segundo, no toca red ni base, y sólo ejercita la
      #    guarda — si esto se pone rojo, es que la guarda está rota de verdad.
      - name: Mesa de pruebas del inventario de columnas
        run: python -u test_inventario_tipadas.py

      # 🔴 LAS COLUMNAS GENERADAS NO SE ARCHIVAN, Y ESTE PASO ES EL QUE LO SUJETA.
      #    `archivar_foto()` saca las columnas de `pg_attribute`: una sola columna
      #    `GENERATED ALWAYS AS (...) STORED` en la foto haria que su guarda
      #    `faltan_en_hist` PARASE ESTA CARGA, y con un error que no menciona la
      #    palabra "generada" por ninguna parte. Tarda menos de un segundo y no toca
      #    ni red ni base.
      - name: Mesa de pruebas del archivado (columnas generadas)
        run: python -u test_archivar_foto.py

      - name: Ejecutar procesador
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ENTORNO: ${{ inputs.entorno }}
          MODO: ${{ inputs.modo }}
          FICHERO: ${{ inputs.fichero }}
          ENCADENADO: ${{ inputs.encadenado }}
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -u procesador_keepa_escaparate.py

      # ═══ LA LÍNEA DEL REGISTRO (encargo H, 23-sep-2026) · SIEMPRE EL ÚLTIMO PASO DEL JOB ═══
      # 🔴 POR QUÉ: hasta hoy este procesador no dejaba en la base ninguna fila de «esto falló»: un
      #    rollback no deja rastro (parte E, 23-sep, tabla a-bis). Este paso apunta en
      #    `registro_ejecuciones` una línea con el color REAL del job (`job.status`) y el modo. La
      #    lee la revisión mensual con el conector de solo lectura.
      # 🔑 VA A LA MISMA BASE QUE LA CARGA: la misma expresión de `DB_URL` que el paso del procesador.
      #    Va a producción, como la carga (staging se jubiló el 30-sep-2026), y con su modo:
      #    un ensayo verde NO es una carga.
      # 🔒 UN FALLO AL APUNTAR NUNCA CAMBIA EL COLOR DEL JOB NI LO RETRASA: `continue-on-error`, un
      #    minuto de tope y 45 s para psql. Sin credenciales nuevas: la cadena de siempre, que entra
      #    como `postgres`, el dueño de `registrar_ejecucion`.
      - name: Apuntar la ejecución en el registro
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R_RESULTADO: ${{ job.status }}
          R_MODO: ${{ inputs.modo }}
        run: |
          set -uo pipefail
          if [ -z "${DB_URL:-}" ]; then
            echo "::warning title=Registro sin apuntar::Este run no tiene cadena de la base; la línea no se escribe y el job conserva su color."
            exit 0
          fi
          wf="${GITHUB_WORKFLOW_REF%%@*}"; wf="${wf##*/}"
          empezado=""
          arranque="$(ps -o lstart= -C Runner.Worker 2>/dev/null | head -n1 || true)"
          [ -n "$arranque" ] && empezado="$(date -u -d "$arranque" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || true)"
          guardas=""
          filas=""
          if timeout 45 psql "$DB_URL" -X -q -At -v ON_ERROR_STOP=1 \
               -v repo="$GITHUB_REPOSITORY" -v workflow="$wf" -v job="$GITHUB_JOB" \
               -v run_id="$GITHUB_RUN_ID" -v run_attempt="$GITHUB_RUN_ATTEMPT" -v evento="$GITHUB_EVENT_NAME" \
               -v resultado="$R_RESULTADO" -v modo="${R_MODO:-}" -v filas="$filas" -v guardas="$guardas" \
               -v empezado="$empezado" <<'SQL'
          set statement_timeout = '15s';
          select public.registrar_ejecucion(
            p_repo => :'repo', p_workflow => :'workflow', p_job => :'job',
            p_run_id => :'run_id'::bigint, p_run_attempt => :'run_attempt'::integer,
            p_evento => :'evento', p_resultado => :'resultado', p_modo => nullif(:'modo', ''),
            p_filas => nullif(:'filas', '')::jsonb, p_guardas_saltadas => nullif(:'guardas', '')::jsonb,
            p_empezado_en => nullif(:'empezado', '')::timestamptz);
          SQL
          then
            echo "Apuntado en registro_ejecuciones: ${wf} · ${GITHUB_JOB} · ${R_RESULTADO} · modo ${R_MODO:-—}${guardas:+ · guardas saltadas: $guardas}"
          else
            rc=$?
            echo "::warning title=Registro sin apuntar::No se pudo escribir la línea en registro_ejecuciones (salida ${rc}). El job conserva su color."
            exit "$rc"
          fi

  # ═══ EL ENCADENADO (01-oct-2026) · la red de DEBAJO de la cola de la página ═══
  # 🔴 POR QUÉ: los CSV de Keepa se cargan de uno en uno (el `concurrency` de arriba y el 409 de
  #    la ruta de la v2), y quien los ponía en fila era la PÁGINA de Buzones. Si la página se
  #    cerraba, la fila moría: el 01-oct-2026 se subieron cuatro países y se cargaron dos.
  #    Este job, al acabar una carga, busca lo que falta en el buzón y lanza el siguiente. El
  #    cómo y el porqué de cada regla, en la cabecera de encadenar_keepa_escaparate.py.
  # 🔑 CORRE TAMBIÉN SI LA CARGA FALLÓ (no solo si salió bien): si no, un fichero malo pararía
  #    la fila entera y los países de detrás se quedarían sin cargar. No hay bucle: un fichero
  #    se intenta como mucho DOS veces (el de la página + un reintento de aquí).
  # 🔒 NO corre en `ensayo` (no hay carga que encadenar) ni si la carga se CANCELÓ (si alguien
  #    para una corrida a mano, el encadenado no la desobedece lanzando otra).
  # 🔒 Va en un job aparte para que el paso del registro siga siendo el ÚLTIMO del job
  #    `procesar` (test_registro_ejecuciones.py) y para que sus permisos no lleguen a la carga:
  #    `actions: write` (lanzar la siguiente corrida con el GITHUB_TOKEN de este run, sin llave
  #    nueva) vive SOLO aquí.
  # 🔒 `continue-on-error`: un fallo del encadenado no pone en rojo una carga que salió bien. Lo
  #    que no se encadene lo sigue avisando la tarjeta de Keepa en Buzones.
  # ⏱️ El tope es el mismo que el de `procesar` porque test_topes_cuelgue.py exige a TODO job de
  #    un procesar-*.yml uno por encima del éxito más largo medido; este job tarda segundos.
  encadenar:
    needs: procesar
    if: ${{ always() && inputs.modo == 'aplicar' && (needs.procesar.result == 'success' || needs.procesar.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --quiet supabase psycopg2-binary

      - name: Buscar el siguiente fichero del buzón y lanzarlo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GH_TOKEN: ${{ github.token }}
          PROPIO_FICHERO: ${{ inputs.fichero }}
          PROPIO_RESULTADO: ${{ needs.procesar.result }}
        run: python -u encadenar_keepa_escaparate.py
