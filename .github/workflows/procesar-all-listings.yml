name: Moloka - Procesar ALL_LISTINGS

# Fase 0 de la v2. A DEMANDA, sin reloj (Diseño §3.2.5).
# Por defecto: STAGING + ENSAYO (no toca nada de Elena).
on:
  workflow_dispatch:
    inputs:
      destino:
        description: 'Base de datos destino'
        type: choice
        options: [staging, produccion]
        default: staging
      modo:
        description: 'ensayo = solo cuenta; aplicar = rellena SKUs'
        type: choice
        options: [ensayo, aplicar]
        default: ensayo

concurrency:
  group: procesar-all-listings
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --quiet supabase psycopg2-binary

      # 🔒 CÓMO SE LEE UN TSV DE AMAZON, antes del procesador. La comilla es TEXTO y
      #    una que abra un campo sin cerrar FUSIONA FILAS en silencio. El test lleva los
      #    cuatro casos medidos y vigila también que el LEDGER siga fuera del cambio.
      #    En este repo nada corre en push ni en PR: un test que no se lanza aquí es
      #    decoración.
      - name: Mesa de pruebas del parseo TSV
        run: python -u test_tsv_quote_none.py

      # 🔴 EL GANCHO DEL REFRESCO. listings_amazon es el MAPA SKU -> ASIN de
      #    mv_ventas_ventanas: si cambia y no se refresca, las ventas de un SKU nuevo
      #    dejan de sumarse a su ASIN y el numero sale BAJO, en silencio. Esta mesa
      #    prueba que el gancho esta puesto, que grita si no puede refrescar, y que NO
      #    tumba la corrida (el commit ya paso: el informe esta a salvo).
      - name: Mesa de pruebas del refresco de materializadas
        run: python -u test_refrescar_vistas.py

      - name: Ejecutar procesador
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DESTINO: ${{ inputs.destino }}
          MODO: ${{ inputs.modo }}
          DB_URL: ${{ inputs.destino == 'produccion' && secrets.SUPABASE_DB_URL || secrets.STAGING_DB_URL }}
        run: python -u procesador_all_listings.py
