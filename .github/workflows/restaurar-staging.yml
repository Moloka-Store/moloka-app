name: Moloka - Restaurar backup en STAGING

# El SIMULACRO DE INCENDIO: coge el backup de R2 y lo restaura en staging para
# demostrar que la copia sirve de verdad.
#
# 🔴 PRIMER AGUJERO (hasta el 30-jul-2026): EL SIMULACRO NO PODIA FALLAR, ASI QUE
#   NO PROBABA NADA.
#   · psql corria con ON_ERROR_STOP=0 → seguia adelante pasara lo que pasara;
#   · la unica comprobacion posterior imprimia un numero y NO lo comparaba con nada.
#   Una restauracion que solo recuperase media base terminaba en VERDE.
#
# 🔴 SEGUNDO AGUJERO, EL GORDO (encontrado el 9-ago-2026, run 31296420722, en cuanto
#   el simulacro endurecido se pudo caer por primera vez). Se paro en la linea 27 de
#   111.734, antes de restaurar un solo dato:
#       psql:backup.sql:27: ERROR:  relation "public.monitor_resultados" does not exist
#   El dump se hacia con `--clean --if-exists`, o sea que empezaba por un bloque de
#   borrados, y ahi pg_dump escribe sentencias del tipo:
#       ALTER TABLE ONLY public.x DROP CONSTRAINT IF EXISTS y;
#   donde el "IF EXISTS" protege a la RESTRICCION, NO a la TABLA. Si la tabla no
#   esta, revienta. Traducido: aquel backup SOLO se podia restaurar encima de una
#   base que YA tuviera el esquema entero. En el incendio de verdad -- produccion
#   perdida, proyecto nuevo y VACIO -- habria fallado en esa misma linea 27.
#   El backup no estaba roto (los datos estaban); lo que estaba roto es que no habia
#   forma de distinguir "errores inofensivos de cabecera" de "restauracion a medias".
#
# 🔴 TERCER AGUJERO, el que hacia inutiles TODOS los ensayos: NADIE COMPROBABA QUE
#   STAGING SE PARECIERA A PRODUCCION. El 9-ago-2026 staging tenia 46 tablas + 8
#   vistas contra las 59 + 24 de produccion: faltaban 29 objetos, entre ellos
#   v_salud_asin y v_trackeador_cola. Con esa divergencia, cualquier ensayo de una
#   migracion en staging demostraba sobre produccion exactamente NADA. Un restore
#   que no termina diciendo "esto tiene TODO lo que tenia que tener" no es un
#   restore verificado: es un restore esperanzado.
#
# COMO QUEDA
#   1) El dump ya NO lleva `--clean` (backup-bd.yml): es solo CREATE + COPY. Un dump
#      que no borra nada tampoco puede destruir nada por su cuenta.
#   2) VACIAR lo hace este workflow, y vacia EL CAJON, NO TIRA EL MUEBLE: se borran
#      los objetos de `public`, pero NO se hace `DROP SCHEMA public`.
#      🔒 Por que importa: tirar el esquema se llevaria por delante sus permisos y,
#      sobre todo, sus DEFAULT PRIVILEGES -- los de §4 del CLAUDE.md, los que hacen
#      que en Supabase todo objeto nuevo nazca con `anon` dentro. Staging dejaria de
#      comportarse como produccion justo en la dimension donde mas caro sale que se
#      parezcan, y volveriamos a tener dos bases distintas por otro camino.
#   3) El vaciado y la carga van en LA MISMA transaccion (`--single-transaction`):
#      si algo falla, staging se queda EXACTAMENTE como estaba. Nunca vacia, nunca
#      a medias.
#   4) Y al final hay un VEREDICTO que compara staging contra EL PROPIO DUMP:
#      lo que el fichero dice traer -- TABLAS, VISTAS, FUNCIONES, SECUENCIAS y
#      POLITICAS RLS, que son las cinco clases que el vaciado borra -- contra lo que
#      quedo en staging, por su nombre; y las filas de CADA bloque `COPY` contra las
#      filas de esa tabla, por IGUALDAD EXACTA. Si no cuadra, ROJO con la lista.
#
#      🔑 PARA QUE SE LEE, que no es lo que parece: como el paso 4 corre con
#      ON_ERROR_STOP=1, cualquier sentencia que el dump TRAIGA y falle ya revienta el
#      restore entero. Asi que el inventario no sirve para pillar lo que el restore no
#      aplico -- eso ya esta cubierto. Sirve para distinguir DOS COSAS DISTINTAS:
#        · FALTA algo que el dump prometia → EL BACKUP NO LO TRAJO. Fallo de la COPIA.
#        · SOBRA algo que el dump no traia → el VACIADO del paso 4 no lo borro.
#      Los dos son rojos, pero no son el mismo problema y no se arreglan en el mismo
#      sitio. El mensaje dice cual es cual.
#
#      🔴 POR QUE CONTRA EL DUMP Y NO CONTRA PRODUCCION -- esto es el corazon del
#      asunto y se equivoco una version anterior de este mismo paso:
#      · El backup es de anoche y produccion no para (Elena carga informes a diario).
#        Comparar contra produccion VIVA daria ROJO en una restauracion PERFECTA en
#        cuanto produccion tuviera una fila mas. Y una guarda que da falsos rojos deja
#        de mirarse en dos semanas: asi es como se muere una guarda.
#      · Y sobre todo: EL DIA DEL INCENDIO NO HAY PRODUCCION CONTRA LA QUE COMPARAR.
#        Un veredicto que necesita produccion para funcionar es un veredicto que no
#        funciona el dia que hace falta. Lo que hay que demostrar es que el BACKUP
#        puede reconstruir lo que contiene, y eso se mide DENTRO del fichero.
#      · Efecto lateral que importa: este workflow NO necesita la credencial de
#        produccion. La base cuyo trabajo es vaciar y recargar no tiene por que poder
#        abrir la de Elena.
#      · Y no hay ni un numero fijo escrito a mano: los que caducan solos son los que
#        acaban tapando un agujero de 29 objetos con un verde.
#
#      ⚠️ Lo que este veredicto NO dice: si produccion ha cambiado desde el backup.
#      No es su trabajo. Como el backup ES produccion, una restauracion verificada
#      deja staging igual a produccion EN EL INSTANTE DE LA COPIA, que es justo lo que
#      hace que un ensayo signifique algo. Vigilar la deriva del dia a dia entre las
#      dos bases es otra guarda distinta, y va en otro sitio.

on:
  workflow_dispatch:
    inputs:
      fichero:
        description: "Nombre del backup (vacio = el mas reciente)"
        required: false
        default: ""
      motivo:
        description: "Para que restauras (lo veran las otras sesiones)"
        required: false
        default: ""

concurrency:
  group: restaurar-staging
  cancel-in-progress: false

jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      # Hace falta por `sql/capturar_politicas_fuera_de_public.sql`, que es la pieza
      # que este workflow comparte con `backup-bd.yml`. Se escribe una vez y la
      # consumen los dos: aqui para CONSERVAR lo que el backup no cubre, y alli para
      # que la copia deje de tener ese agujero.
      - uses: actions/checkout@v4

      - name: 1) Cerrojo anti-produccion
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          case "$STAGING_DB_URL" in
            *ogfbjjdxcltzpygzuyla*)
              echo "::error::Esa URL es la BD de PRODUCCION. Me niego."; exit 1;;
            "")
              echo "::error::Falta el secret STAGING_DB_URL"; exit 1;;
          esac
          echo "Cerrojo OK: no es produccion."

      - name: 2) Instalar cliente Postgres 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null

      # 🔴 STAGING ES COMPARTIDO. El 11-ago-2026 se restauró TRES VECES en una hora, y una
      #    de ellas se llevó por delante una vista que otra sesión ya había aplicado y
      #    verificado; esa sesión siguió midiendo sobre un ensayo que ya no existía.
      #    🔒 El `concurrency` de arriba impide que dos restauraciones se pisen entre sí,
      #       pero NO protege a quien está midiendo: para eso hace falta que se vea quién
      #       ha restaurado y cuándo. Este paso avisa; no impide nada, porque a veces hay
      #       que restaurar igual.
      # 🔒 La pregunta anti-cero, hecha codigo, ANTES de que este workflow la use en su
      #    paso 10 (`comparar_censos.py` corta si un censo viene vacio). Si el guarda
      #    esta roto, el veredicto de abajo se lo cree. `docs/guion-anti-cero.md`.
      - name: Mesa de pruebas del guion anti-cero
        run: python -u test_anti_cero.py

      - name: 2b) Quien restauro antes (staging es compartido)
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          psql "$STAGING_DB_URL" -q -c "
            create table if not exists public.staging_restauraciones (
              id            bigserial primary key,
              restaurado_en timestamptz not null default now(),
              quien         text,
              motivo        text,
              fichero       text,
              run_url       text
            );" 2>/dev/null || echo "(no se pudo asegurar la tabla; se continua)"
          echo "--- Ultimas restauraciones de staging ---"
          psql "$STAGING_DB_URL" -c "
            select restaurado_en, quien, coalesce(motivo,'-') as motivo
              from public.staging_restauraciones
             order by restaurado_en desc limit 5;" 2>/dev/null || true
          ULT=$(psql "$STAGING_DB_URL" -tAc "
            select coalesce(extract(epoch from (now() - max(restaurado_en)))::int, 999999)
              from public.staging_restauraciones;" 2>/dev/null || echo "999999")
          if [ "$ULT" -lt 3600 ] 2>/dev/null; then
            echo "::warning::Staging se restauro hace $((ULT/60)) minutos. Si alguien esta midiendo, le estas tirando el ensayo."
          fi

      - name: 3) Bajar el backup de R2
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID:         ${{ secrets.R2_ACCOUNT_ID }}
          FICHERO: ${{ github.event.inputs.fichero }}
        run: |
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          if [ -z "$FICHERO" ]; then
            FICHERO=$(aws s3 ls "s3://moloka-backups/bd/" --endpoint-url "$EP" --region auto \
                      | awk '{print $4}' | sort | tail -1)
          fi
          echo "Restaurando: $FICHERO"
          echo "BACKUP_FICHERO=$FICHERO" >> "$GITHUB_ENV"
          aws s3 cp "s3://moloka-backups/bd/$FICHERO" backup.sql.gz \
            --endpoint-url "$EP" --region auto

      # ── 4) Vaciar y restaurar, TODO EN UNA TRANSACCION ────────────────────
      # 🔒 Este paso es el unico que escribe, y en su entorno SOLO existe la URL de
      #    staging. La de produccion no esta aqui: no puede tocarla ni por error.
      #
      # 🔴 LO QUE EL BACKUP NO CUBRE, ESTE PASO LO CONSERVA -- y hay que entender por
      #   que existe esto, porque nacio de un susto de verdad (run 31299419508):
      #   el vaciado de `public` se llevaba por delante, VIA CASCADE, cuatro politicas
      #   de `storage.objects` (`buzones_v2_*`), porque su clausula usa
      #   `public.moloka_buzones_fase0()`. Y el backup NO PUEDE DEVOLVERLAS: se hace
      #   con `pg_dump --schema=public`, asi que `storage` no esta dentro. Aquella vez
      #   se salvaron de casualidad -- la restauracion fallo despues por otra cosa y la
      #   transaccion entera hizo rollback. De no fallar, habrian desaparecido y nada
      #   las habria recreado.
      #   Asi que ahora: se CAPTURAN antes de vaciar y se RECREAN despues de restaurar.
      #
      # 🔒 Y TODO -- comprobar, capturar, vaciar, cargar y recrear -- VA EN LA MISMA
      #   TRANSACCION, en un solo psql. Si el recrear quedara en una llamada aparte, un
      #   fallo ahi dejaria staging sin las politicas y sin vuelta atras: exactamente el
      #   escenario que aquel rollback evito por suerte. Es el mismo argumento por el
      #   que el vaciado y la carga van juntos.
      - name: 4) Restaurar en staging (comprobar + capturar + vaciar + cargar + recrear, en UNA transaccion)
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          gunzip -f backup.sql.gz
          echo "Lineas del dump: $(wc -l < backup.sql)"

          # 🔴 GUARDA DE FORMATO -- falla CERRADO y con el motivo dicho.
          #   Los backups anteriores al 9-ago-2026 se hicieron con `--clean --if-exists`
          #   y empiezan por un bloque de borrados que NO se puede aplicar sobre un
          #   `public` vacio (es exactamente el fallo del run 31296420722). Sin esta
          #   guarda, el job reventaria con un "relation does not exist" en la linea 27
          #   y habria que diagnosticarlo entero otra vez.
          if grep -qEm1 '^(ALTER TABLE ONLY .* DROP CONSTRAINT IF EXISTS|DROP (TABLE|VIEW|SEQUENCE|INDEX|FUNCTION|ROUTINE) IF EXISTS)' backup.sql; then
            echo "::error::'$BACKUP_FICHERO' es del formato ANTIGUO (pg_dump con --clean)."
            echo "::error::Trae un bloque de borrados que no se puede aplicar sobre un esquema vacio:"
            echo "::error::sus 'DROP CONSTRAINT IF EXISTS' protegen la restriccion, no la tabla."
            echo "::error::ESTO NO ES UNA AVERIA: es el ORDEN. Al fusionar el cambio, TODOS los"
            echo "::error::backups que ya habia en R2 son del formato viejo. Hay que generar uno"
            echo "::error::nuevo ANTES de restaurar:"
            echo "::error::  1. lanzar backup-bd.yml a mano (o esperar al cron: 02:15 UTC)"
            echo "::error::  2. y entonces relanzar este workflow"
            exit 1
          fi
          echo "Formato OK: el dump no trae bloque de borrados."

          # 🔴 SE FILTRA UNA SOLA SENTENCIA, POR SU NOMBRE, Y ES BENIGNA.
          #   `pg_dump --schema=public` incluye `CREATE SCHEMA public;`. Con `--clean`
          #   no molestaba porque delante iba un DROP; sin el, choca con el esquema que
          #   aqui se conserva A PROPOSITO (ver mas abajo: el cajon, no el mueble).
          #   Medido en el run 31299419508: `ERROR: schema "public" already exists` en
          #   la linea 26 del dump. Crear un esquema que ya existe, y que ademas
          #   queremos que siga existiendo, no aporta nada: se quita ESA linea y se
          #   dice cuantas se han quitado. Lo que NO se hace es filtrar por categorias.
          N_SCHEMA=$(grep -c '^CREATE SCHEMA public;$' backup.sql || true)
          echo "Sentencias 'CREATE SCHEMA public;' filtradas del dump: $N_SCHEMA"
          grep -v '^CREATE SCHEMA public;$' backup.sql > dump_sin_schema.sql

          # ── 4.1) ANTES DE TOCAR NADA: ¿puedo escribir en storage.objects? ─────
          # 🔴 NO SE DA POR HECHO PORQUE LA CONEXION SEA `postgres`: `storage` es de
          #   Supabase y sus permisos son suyos. Destruir las politicas y descubrir
          #   DESPUES que no puedo devolverlas es el peor orden posible. Asi que se
          #   prueba de verdad -- crear y borrar una politica de mentira -- antes de
          #   que el vaciado toque una sola cosa. Va dentro de la transaccion, asi que
          #   no deja rastro pase lo que pase.
          # ⚠️ AVISO PARA EL DIA QUE ESTO SE REUTILICE: el `CREATE POLICY` de prueba
          #   toma ACCESS EXCLUSIVE sobre `storage.objects`, y ese lock NO se suelta
          #   con el `DROP POLICY` -- los locks duran hasta el COMMIT, o sea hasta el
          #   final de TODA la restauracion. En staging da igual, no lo usa nadie. Pero
          #   si algun dia esta pieza se apunta a una base de la que dependa Elena, le
          #   bloquearia los buzones durante todo el restore. Ese dia hay que comprobar
          #   el permiso de otra forma (mirando el owner de la tabla, por ejemplo), no
          #   escribiendo en ella.
          cat > 00_permisos.sql <<'SQL'
          \echo '--- Comprobando que puedo escribir politicas en storage.objects ---'
          DO $$
          BEGIN
            EXECUTE 'CREATE POLICY moloka_prueba_permisos_restore ON storage.objects FOR SELECT USING (false)';
            EXECUTE 'DROP POLICY moloka_prueba_permisos_restore ON storage.objects';
            RAISE INFO 'Permiso OK: puedo crear y borrar politicas en storage.objects.';
          EXCEPTION WHEN OTHERS THEN
            RAISE EXCEPTION 'ABORTA ANTES DE TOCAR NADA: no puedo escribir politicas en storage.objects (%). '
                            'El vaciado de public destruiria las politicas de los buzones via CASCADE y no '
                            'habria forma de devolverlas: el backup no las trae.', SQLERRM;
          END $$;
          SQL

          # ── 4.2) CAPTURAR lo que el backup no cubre ───────────────────────────
          # 🔒 EL `SET LOCAL search_path = public` NO ES DECORACION, y esto costo un
          #   susto: `pg_policies.qual` devuelve la expresion RENDERIZADA con el
          #   search_path del momento, y ahi `moloka_buzones_fase0()` sale SIN
          #   esquema (porque `public` estaba en el path cuando se creo la politica).
          #   Como el dump hace `set_config('search_path','')` unas lineas mas abajo,
          #   al recrear la politica esa funcion NO resolveria. Se fija el MISMO path
          #   al capturar y al recrear, para reproducirla igual. Lo que NO se hace es
          #   reescribir la expresion cualificando la funcion a mano: eso seria
          #   reinterpretar una politica que no es nuestra.
          {
            echo "SET LOCAL search_path = public;"
            echo "\\echo '--- Capturando las politicas que viven fuera de public ---'"
            cat sql/capturar_politicas_fuera_de_public.sql
            cat <<'SQL'
          -- Censo de lo que hay FUERA de public, para poder demostrar al final que el
          -- CASCADE del vaciado no se ha llevado nada mas por delante.
          CREATE TEMP TABLE moloka_censo_fuera_public AS
            SELECT 'relaciones'::text AS que, count(*) AS n
              FROM pg_catalog.pg_class c
              JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
             WHERE n.nspname NOT IN ('public','information_schema') AND n.nspname NOT LIKE 'pg\_%'
            UNION ALL
            SELECT 'rutinas', count(*)
              FROM pg_catalog.pg_proc p
              JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
             WHERE n.nspname NOT IN ('public','information_schema') AND n.nspname NOT LIKE 'pg\_%';

          DO $$
          DECLARE n_pol int;
          BEGIN
            SELECT count(*) INTO n_pol FROM moloka_politicas_fuera_public;
            RAISE INFO 'Politicas capturadas fuera de public: %', n_pol;
          END $$;
          SQL
          } > 01_capturar.sql

          # ── 4.3) EL VACIADO ───────────────────────────────────────────────────
          # 🔒 Se borran los OBJETOS de public, no el esquema (ver cabecera).
          #    Los objetos que pertenecen a una extension se dejan en paz: el dump
          #    tampoco los trae, y borrarlos romperia la extension.
          cat > 02_vaciar.sql <<'SQL'
          \echo '--- Vaciando public en staging (el cajon, no el mueble) ---'
          DO $$
          DECLARE r record; n int := 0;
          BEGIN
            -- Vistas primero: dependen de las tablas.
            FOR r IN
              SELECT c.relname, c.relkind
                FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
               WHERE n.nspname = 'public' AND c.relkind IN ('v','m')
                 AND NOT EXISTS (SELECT 1 FROM pg_depend d WHERE d.objid = c.oid AND d.deptype = 'e')
            LOOP
              EXECUTE format('DROP %s IF EXISTS public.%I CASCADE',
                             CASE r.relkind WHEN 'm' THEN 'MATERIALIZED VIEW' ELSE 'VIEW' END,
                             r.relname);
              n := n + 1;
            END LOOP;

            FOR r IN
              SELECT c.relname
                FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
               WHERE n.nspname = 'public' AND c.relkind IN ('r','p')
                 AND NOT EXISTS (SELECT 1 FROM pg_depend d WHERE d.objid = c.oid AND d.deptype = 'e')
            LOOP
              EXECUTE format('DROP TABLE IF EXISTS public.%I CASCADE', r.relname);
              n := n + 1;
            END LOOP;

            FOR r IN
              SELECT c.relname
                FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
               WHERE n.nspname = 'public' AND c.relkind = 'S'
                 AND NOT EXISTS (SELECT 1 FROM pg_depend d WHERE d.objid = c.oid AND d.deptype = 'e')
            LOOP
              EXECUTE format('DROP SEQUENCE IF EXISTS public.%I CASCADE', r.relname);
              n := n + 1;
            END LOOP;

            -- 🔴 EL NOMBRE VA CUALIFICADO A MANO, NO POR `::regprocedure`.
            --   regprocedure imprime el nombre SIN el esquema cuando `public` esta en
            --   el search_path, y un DROP sin esquema se resuelve por search_path: en
            --   el mejor caso acierta por casualidad, en el peor borra la funcion de
            --   OTRO esquema.
            -- ⚠️ DROP ROUTINE cubre funciones y procedimientos, no AGREGADOS. Hoy en
            --   produccion las 16 son funciones normales (medido el 9-ago-2026). Si
            --   algun dia aparece un agregado, esto fallara con su nombre y su motivo
            --   -- falla CERRADO, que es como tiene que fallar.
            -- 🔴 Y ESTE CASCADE ES EL QUE SE SALE DE public: `moloka_buzones_fase0()`
            --   sostiene cuatro politicas de `storage.objects`. Por eso estan
            --   capturadas antes (4.2) y se recrean despues (4.5).
            FOR r IN
              SELECT format('%I.%I(%s)', ns.nspname, p.proname,
                            pg_get_function_identity_arguments(p.oid)) AS firma
                FROM pg_proc p JOIN pg_namespace ns ON ns.oid = p.pronamespace
               WHERE ns.nspname = 'public'
                 AND NOT EXISTS (SELECT 1 FROM pg_depend d WHERE d.objid = p.oid AND d.deptype = 'e')
            LOOP
              EXECUTE format('DROP ROUTINE IF EXISTS %s CASCADE', r.firma);
              n := n + 1;
            END LOOP;

            FOR r IN
              SELECT t.typname
                FROM pg_type t JOIN pg_namespace ns ON ns.oid = t.typnamespace
               WHERE ns.nspname = 'public' AND t.typtype IN ('e','d','c')
                 AND NOT EXISTS (SELECT 1 FROM pg_class c WHERE c.reltype = t.oid)
                 AND NOT EXISTS (SELECT 1 FROM pg_depend d WHERE d.objid = t.oid AND d.deptype = 'e')
            LOOP
              EXECUTE format('DROP TYPE IF EXISTS public.%I CASCADE', r.typname);
              n := n + 1;
            END LOOP;

            RAISE INFO 'Objetos borrados de public en staging: %', n;
          END $$;
          SQL

          # ── 4.5) RECREAR lo capturado, y demostrar que no falta nada mas ──────
          cat > 03_recrear.sql <<'SQL'
          -- Mismo search_path que al capturar (ver 4.2): sin esto,
          -- `moloka_buzones_fase0()` no resuelve y las politicas de los buzones no se
          -- pueden recrear.
          SET LOCAL search_path = public;
          \echo '--- Recreando las politicas de fuera de public que el backup no trae ---'
          DO $$
          DECLARE r record; n_creadas int := 0; n_ya int := 0;
          BEGIN
            FOR r IN SELECT * FROM moloka_politicas_fuera_public LOOP
              IF EXISTS (SELECT 1 FROM pg_catalog.pg_policies pp
                          WHERE pp.schemaname = r.schemaname
                            AND pp.tablename  = r.tablename
                            AND pp.policyname = r.policyname) THEN
                n_ya := n_ya + 1;      -- el CASCADE no llego a esta: se queda como esta
              ELSE
                EXECUTE r.sentencia;
                n_creadas := n_creadas + 1;
                RAISE INFO 'Recreada: %.% / %', r.schemaname, r.tablename, r.policyname;
              END IF;
            END LOOP;
            RAISE INFO 'Politicas fuera de public: % recreadas, % intactas.', n_creadas, n_ya;
          END $$;

          -- 🔴 LA DEMOSTRACION, no la confianza. El CASCADE del vaciado pudo llevarse
          --   por delante algo mas que politicas (una vista, un disparador, una funcion
          --   de otro esquema). Si el censo de fuera de public ha ENCOGIDO, se aborta y
          --   la transaccion entera se deshace: staging se queda como estaba. Esto es
          --   lo que convierte en garantia lo que el 9-ago-2026 fue pura suerte.
          DO $$
          DECLARE r record; fallos text := '';
          BEGIN
            FOR r IN
              SELECT c.que, c.n AS antes,
                     CASE c.que
                       WHEN 'relaciones' THEN (SELECT count(*) FROM pg_catalog.pg_class cl
                                                 JOIN pg_catalog.pg_namespace nn ON nn.oid = cl.relnamespace
                                                WHERE nn.nspname NOT IN ('public','information_schema')
                                                  AND nn.nspname NOT LIKE 'pg\_%')
                       ELSE                  (SELECT count(*) FROM pg_catalog.pg_proc pr
                                                 JOIN pg_catalog.pg_namespace nn ON nn.oid = pr.pronamespace
                                                WHERE nn.nspname NOT IN ('public','information_schema')
                                                  AND nn.nspname NOT LIKE 'pg\_%')
                     END AS ahora
                FROM moloka_censo_fuera_public c
            LOOP
              IF r.ahora < r.antes THEN
                fallos := fallos || format(E'\n  - %s: habia %s y quedan %s', r.que, r.antes, r.ahora);
              END IF;
            END LOOP;
            IF fallos <> '' THEN
              RAISE EXCEPTION E'ABORTA: el vaciado de public se ha llevado por delante cosas de OTROS esquemas:%\nStaging se queda como estaba. Mira que dependencia hay y captura tambien eso.', fallos;
            END IF;
            RAISE INFO 'Comprobado: fuera de public no falta nada.';
          END $$;

          -- Y que ninguna politica capturada se haya quedado sin recrear.
          DO $$
          DECLARE n_falta int;
          BEGIN
            SELECT count(*) INTO n_falta
              FROM moloka_politicas_fuera_public g
             WHERE NOT EXISTS (SELECT 1 FROM pg_catalog.pg_policies pp
                                WHERE pp.schemaname = g.schemaname
                                  AND pp.tablename  = g.tablename
                                  AND pp.policyname = g.policyname);
            IF n_falta > 0 THEN
              RAISE EXCEPTION 'ABORTA: % politica(s) capturada(s) no estan tras recrearlas.', n_falta;
            END IF;
          END $$;
          SQL

          # 🔒 UN SOLO psql PARA TODO. Si el recrear fuera una llamada aparte, un fallo
          #    ahi dejaria staging vaciado y SIN las politicas, sin vuelta atras.
          cat 00_permisos.sql 01_capturar.sql 02_vaciar.sql dump_sin_schema.sql 03_recrear.sql > restaurar.sql
          # Para poder traducir un "psql:restaurar.sql:X" a la linea del dump ORIGINAL,
          # que es lo que se contrasta contra el fichero de R2. Son DOS correcciones,
          # no una: el preambulo que va delante y las lineas filtradas. En esta casa el
          # numero de linea de un error es lo que ha resuelto los tres agujeros, asi
          # que la cuenta se da bien o no se da.
          PREAMBULO=$(cat 00_permisos.sql 01_capturar.sql 02_vaciar.sql | wc -l)
          echo "Traduccion de lineas para leer un error:"
          echo "  restaurar.sql:X  →  dump_sin_schema.sql: X - $PREAMBULO"
          echo "  y en el backup.sql ORIGINAL, $N_SCHEMA linea(s) mas abajo de esa,"
          echo "  si el error cae despues del 'CREATE SCHEMA public;' filtrado."

          if ! psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 --single-transaction \
                 -q -f restaurar.sql 2> restaurar_error.log; then
            echo "::error::La restauracion ha FALLADO. Staging se queda como estaba."
            echo "--- Donde se paro (psql se detiene en el PRIMER error) ---"
            head -40 restaurar_error.log
            echo "----------------------------------------------------------"
            echo "Esto NO es un fallo del workflow: es el HALLAZGO. Mira que sentencia"
            echo "es y decide si es benigna. Si lo es, se filtra ESE caso por su nombre."
            echo "Lo que NO se hace nunca es volver a poner ON_ERROR_STOP=0."
            exit 1
          fi
          echo "Restauracion aplicada sin errores."
          # Los avisos que no llegan a error tambien se miran. Y aqui hay que mirarlos
          # de verdad: los NOTICE de "drop cascades to ..." son los que descubrieron
          # que el vaciado se salia de public.
          if [ -s restaurar_error.log ]; then
            echo "--- Avisos de psql (no han parado la restauracion) ---"
            head -60 restaurar_error.log
          fi

      # ── 5) EL VEREDICTO ───────────────────────────────────────────────────
      # Aqui es donde el simulacro deja de ser esperanzado.
      #
      # Version 1 de este paso miraba 6 recuentos contra unos minimos puestos a ojo:
      # con aquellos numeros, un staging al que le faltaban 29 objetos ENTEROS salia
      # VERDE. Version 2 comparaba contra produccion viva, y estaba mal por dos
      # motivos que se explican en la cabecera: daba falsos rojos (el backup es de
      # anoche y produccion no para) y, sobre todo, EL DIA DEL INCENDIO NO HAY
      # PRODUCCION CONTRA LA QUE COMPARAR.
      #
      # 🔑 La pregunta correcta no es "¿se parece staging a produccion?", es
      #   "¿tiene staging TODO lo que el backup decia traer?". Y esa se contesta
      #   DENTRO del propio fichero: el dump lleva su numero de control escrito.
      #   Por eso este paso NO necesita la credencial de produccion.
      #
      # 🔑 PARA QUE SE LEE ESTE PASO -- importa, porque no es lo que parece.
      #   El paso 4 corre con ON_ERROR_STOP=1 y --single-transaction: CUALQUIER
      #   sentencia que el dump traiga y falle revienta el restore entero y este paso
      #   ni siquiera llega a correr. O sea que el inventario NO sirve para pillar
      #   "el restore no aplico algo": eso ya esta cubierto, y con creces.
      #   Sirve para pillar otras dos cosas, y conviene saber cual es cual:
      #     · FALTA algo que el dump prometia  → EL BACKUP NO LO TRAJO. Es un fallo
      #       de la COPIA, no de la restauracion. Es el caso que da miedo.
      #     · SOBRA algo que el dump no traia  → EL VACIADO del paso 4 no lo borro.
      #       Ese si es un fallo de este workflow, y hay que arreglarlo aqui.
      #   El recuento de filas, con ON_ERROR_STOP=1, es tirantes ademas de cinturon:
      #   su valor real es que PONE EL NUMERO DELANTE. Un numero que se mira es lo
      #   unico que ha detectado algo en toda esta historia.
      - name: 5) VEREDICTO - staging tiene TODO lo que el backup traia
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          # 🔴 LC_ALL=C NO ES DECORACION. `sort` ordena segun el idioma y `comm`/`join`
          #   comparan byte a byte: con un idioma que no sea C, en_US ignora el guion
          #   bajo al ordenar y los dos dejan de estar de acuerdo. Con nombres como
          #   `salud_fba` / `salud_fba_hist` eso significa diferencias INVENTADAS en el
          #   inventario -- justo el error que este paso existe para no cometer.
          # 🔒 pipefail: sin el, un `psql | sort > fichero` que falla en el psql sale 0
          #   (manda el `sort`), el fichero queda vacio y el veredicto se lo cree.
          export LC_ALL=C
          set -o pipefail

          case "$STAGING_DB_URL" in
            *ogfbjjdxcltzpygzuyla*) echo "::error::STAGING_DB_URL es produccion. Me niego."; exit 1;;
            "")                     echo "::error::Falta el secret STAGING_DB_URL"; exit 1;;
          esac

          FALLO=0

          # ── A) LO QUE EL DUMP DICE TRAER: un solo lector, una sola pasada ─────
          # Se cuentan TABLAS, VISTAS, FUNCIONES, SECUENCIAS y POLITICAS RLS. Las
          # cinco clases las borra el vaciado del paso 4, asi que las cinco tienen
          # que volver.
          #
          # 🔴 LAS FUNCIONES Y LAS POLITICAS NO SON UN ADORNO:
          #   · Un restore que recuperase las 59 tablas y las 24 vistas pero se dejase
          #     `frescura_informes()` saldria VERDE mirando solo tablas y vistas -- y de
          #     esa funcion cuelga la pantalla de Buzones de Elena entera.
          #   · Una POLITICA perdida deja una tabla con permisos distintos a los de
          #     produccion. El dia del incendio eso es, literalmente, la casa abierta.
          #   Medido el 9-ago-2026: produccion 16 funciones y 59 politicas sobre 37
          #   tablas; staging 14 y 56.
          #
          # ⚠️ LAS SECUENCIAS ENTRAN, PERO ESTA NO ES LA COMPROBACION QUE IMPORTA, y
          #   que quede escrito para que nadie se confie: aqui solo se mira que EXISTAN.
          #   Una secuencia puede volver existiendo y con el contador a 1 sobre una
          #   tabla llena, y entonces la PRIMERA insercion del dia del incendio choca
          #   con clave duplicada. Por nombre, eso sale VERDE. El contraste que de
          #   verdad vale es de VALORES: los `setval` del dump contra
          #   `pg_sequences.last_value`. Es otro diseno y va en su propio PR.
          #   Medido el 9-ago-2026: las 23 secuencias de produccion tienen el contador
          #   avanzado (0 sin estrenar), asi que esto le aplica a las 23.
          #   Mas abajo se imprime cuantos `setval` trae el dump, para que el agujero
          #   se vea en cada ejecucion en vez de vivir solo en este comentario.
          #   ✅ Y el `setval` YA ESTA MEDIDO, que era la duda: el dump del 9-ago-2026
          #   trae 23 sentencias `setval`, una por secuencia. Lo que falta es
          #   COMPARARLAS, no averiguar si estan.
          #
          # 🔴 LAS SECUENCIAS SE CUENTAN POR DOS SITIOS, Y OMITIR EL SEGUNDO DABA UN
          #   ROJO FALSO (medido en el run 31300759981: el veredicto decia 10 en el
          #   dump contra 23 en staging, y encima acusaba al vaciado de no haber
          #   borrado 13 que si habia borrado).
          #   El motivo: `pg_dump` solo escribe `CREATE SEQUENCE` para las secuencias
          #   SUELTAS o de columna `serial`. Las de una columna `IDENTITY` no llevan
          #   sentencia propia: se declaran DENTRO del `ALTER TABLE … ADD GENERATED …
          #   AS IDENTITY ( SEQUENCE NAME public.x_id_seq … )`, o sea que nacen y
          #   mueren con su tabla. Medido en produccion el 9-ago-2026: 10 sueltas y
          #   13 de identidad, que son las 23. Por eso se lee tambien la linea
          #   `SEQUENCE NAME`.
          #
          # 🔴 POR QUE UN SOLO LECTOR Y NO VARIOS `grep` SUELTOS: dentro de un bloque
          #   COPY las lineas son DATOS. Una columna de texto que empezara por
          #   "CREATE TABLE ..." o por "COPY ... FROM stdin;" enganaria a un grep, y el
          #   veredicto se inventaria un objeto que no existe. Un rojo falso es
          #   exactamente como se mata una guarda. Aqui, mientras estamos DENTRO de un
          #   bloque de datos, lo unico que se obedece es el terminador.
          #   🔒 PROBADO el 9-ago-2026 contra un dump de mentira hecho a proposito con
          #   esas lineas trampa DENTRO de los datos: el lector no se las tragó.
          # 🔒 EL TERMINADOR SE CONSTRUYE CON sprintf("%c.", 92) -- el caracter 92 es la
          #   contrabarra -- para no escribir NI UNA contrabarra en el codigo. Escrito
          #   como cadena con escapes dependia de cuantas capas de comillas atravesara
          #   el programa: medido, en una de ellas awk lo leia como un simple punto, no
          #   casaba nunca con el terminador y EL RECUENTO DE FILAS NO SE HACIA. Salia
          #   verde sin contar nada. Por lo mismo, la comilla doble se construye con
          #   sprintf("%c", 34).
          # 🔴 EL NOMBRE DE UNA POLITICA PUEDE LLEVAR ESPACIOS. Medido el 9-ago-2026:
          #   15 de las 59 politicas de produccion tienen nombres que pg_dump
          #   ENTRECOMILLA (los que crea el panel de Supabase, del tipo
          #   "Enable read access for all users"). Partir por espacios se rompe justo
          #   ahi, asi que el nombre se corta por su comilla de cierre y la tabla es el
          #   token siguiente al ` ON `.
          # ⚠️ Limite conocido: una politica cuyo nombre contuviera una comilla doble
          #   escapada se leeria mal y saldria como diferencia. Hoy no hay ninguna.
          awk '
            BEGIN { FIN = sprintf("%c.", 92); COM = sprintf("%c", 34) }
            dentro { if ($0 == FIN) { print "FILA|" tabla "|" n; dentro = 0 } else { n++ }; next }
            /^COPY .* FROM stdin;$/      { tabla = $2; n = 0; dentro = 1; next }
            /^CREATE TABLE /             { print "OBJ|tabla  " $3; next }
            /^CREATE VIEW /              { print "OBJ|vista  " $3; next }
            /^CREATE MATERIALIZED VIEW / { print "OBJ|vista  " $4; next }
            /^CREATE SEQUENCE /          { print "OBJ|secuencia  " $3; next }
            /^[ \t]*SEQUENCE NAME /      { print "OBJ|secuencia  " $3; next }
            /^SELECT pg_catalog.setval/  { nsetval++; next }
            /^CREATE (FUNCTION|PROCEDURE) / {
              s = $0
              sub(/^CREATE (FUNCTION|PROCEDURE) /, "", s)
              sub(/[(].*$/, "", s)
              print "OBJ|funcion  " s
              nrut++
              next
            }
            /^CREATE POLICY / {
              s = $0
              sub(/^CREATE POLICY /, "", s)
              if (substr(s, 1, 1) == COM) {
                j = index(substr(s, 2), COM) + 1
                nombre = substr(s, 1, j)
                resto  = substr(s, j + 1)
              } else {
                j = index(s, " ")
                nombre = substr(s, 1, j - 1)
                resto  = substr(s, j)
              }
              sub(/^ ON /, "", resto)
              sub(/ .*$/, "", resto)
              sub(/;$/, "", resto)
              print "OBJ|politica  " resto ":" nombre
              next
            }
            END { print "NRUT|" nrut + 0; print "NSETVAL|" nsetval + 0 }
          ' backup.sql > dump_crudo.txt

          grep '^OBJ|'  dump_crudo.txt | cut -d'|' -f2- | sort -u > dump_objetos.txt
          grep '^FILA|' dump_crudo.txt | cut -d'|' -f2- | sort    > dump_filas.txt
          NRUT_DUMP=$(grep '^NRUT|'    dump_crudo.txt | cut -d'|' -f2)
          NSETVAL=$(grep '^NSETVAL|'   dump_crudo.txt | cut -d'|' -f2)

          # 🔒 Este lector parte por espacios los nombres de tabla, vista, funcion y
          #   secuencia. Hoy ninguno de los 83 objetos de produccion necesita comillas
          #   (medido el 9-ago-2026), pero si algun dia nace uno con espacios o
          #   mayusculas, pg_dump lo entrecomillaria y el corte saldria mal. Antes que
          #   inventar una diferencia, se para y se dice.
          #   Las POLITICAS quedan fuera de esta guarda a proposito: ahi las comillas
          #   son normales y el lector ya sabe tratarlas.
          if grep -v '^politica  ' dump_objetos.txt | grep -q '"'; then
            echo "::error::Hay nombres entrecomillados que este lector no sabe partir."
            echo "::error::Para y arreglalo antes de fiarte de este veredicto:"
            grep -v '^politica  ' dump_objetos.txt | grep '"' | sed 's/^/  /'
            exit 1
          fi

          # 🔒 Si esto sale vacio, el fichero no es lo que dice ser (o pg_dump ha
          #    cambiado de formato). Callarse aqui seria dar por buena una copia que
          #    no hemos sabido leer.
          if [ ! -s dump_objetos.txt ]; then
            echo "::error::No he encontrado NI UN 'CREATE TABLE/VIEW/FUNCTION' en el dump."
            echo "::error::O el backup no es lo que dice ser, o el formato de pg_dump ha cambiado."
            exit 1
          fi

          # ── LO QUE HA QUEDADO EN STAGING ──────────────────────────────────────
          # 🔒 format('%I') reproduce la MISMA regla de comillas que usa pg_dump
          #    (entrecomilla solo cuando hace falta). Con `nspname || '.' || relname`
          #    a pelo, un nombre que necesitara comillas saldria distinto en cada lado
          #    y el veredicto inventaria una diferencia. Es justo lo que pasaria con
          #    las 15 politicas de nombre entrecomillado.
          # 🔒 Se excluyen los objetos de una EXTENSION, exactamente igual que hace el
          #    vaciado del paso 4: ni el vaciado los borra ni el dump los trae, asi que
          #    contarlos aqui seria un "sobran" que no es culpa de nadie.
          psql "$STAGING_DB_URL" -At -c "
            select 'tabla  ' || format('%I.%I', n.nspname, c.relname)
              from pg_class c join pg_namespace n on n.oid = c.relnamespace
             where n.nspname = 'public' and c.relkind in ('r','p')
               and not exists (select 1 from pg_depend d where d.objid = c.oid and d.deptype = 'e')
            union all
            select 'vista  ' || format('%I.%I', n.nspname, c.relname)
              from pg_class c join pg_namespace n on n.oid = c.relnamespace
             where n.nspname = 'public' and c.relkind in ('v','m')
               and not exists (select 1 from pg_depend d where d.objid = c.oid and d.deptype = 'e')
            union all
            select 'secuencia  ' || format('%I.%I', n.nspname, c.relname)
              from pg_class c join pg_namespace n on n.oid = c.relnamespace
             where n.nspname = 'public' and c.relkind = 'S'
               and not exists (select 1 from pg_depend d where d.objid = c.oid and d.deptype = 'e')
            union all
            select 'funcion  ' || format('%I.%I', n.nspname, p.proname)
              from pg_proc p join pg_namespace n on n.oid = p.pronamespace
             where n.nspname = 'public'
               and not exists (select 1 from pg_depend d where d.objid = p.oid and d.deptype = 'e')
            union all
            select 'politica  ' || format('%I.%I', schemaname, tablename) || ':' || format('%I', policyname)
              from pg_policies where schemaname = 'public'" \
            | sort -u > stg_objetos.txt

          NRUT_STG=$(psql "$STAGING_DB_URL" -At -c "
            select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
             where n.nspname = 'public'
               and not exists (select 1 from pg_depend d where d.objid = p.oid and d.deptype = 'e')")

          # 🔴 ESTO SE DICE SIEMPRE, TAMBIEN EN VERDE, Y NO ES UN ADORNO.
          #   Las politicas de fuera de `public` NO vienen del backup: el backup es
          #   `pg_dump --schema=public` y no las contiene. Estan porque el paso 4 las
          #   CONSERVA de la propia staging. Si el veredicto saliera en verde a secas,
          #   estaria mintiendo sobre lo unico que aqui importa de verdad: que la copia
          #   de seguridad NO cubre `storage`. En un incendio de verdad no habria
          #   staging de la que conservarlas y los buzones se quedarian sin ninguna.
          #   🔒 ESTA LINEA SE BORRA EL DIA QUE `backup-bd.yml` LAS TRAIGA. No antes.
          NPOL_FUERA=$(psql "$STAGING_DB_URL" -At -c "
            select count(*) from pg_policies where schemaname <> 'public'")

          cuantos() { awk -v t="$2" '$1==t' "$1" | wc -l; }
          DT=$(cuantos dump_objetos.txt tabla);     DV=$(cuantos dump_objetos.txt vista)
          DF=$(cuantos dump_objetos.txt funcion);   DS=$(cuantos dump_objetos.txt secuencia)
          DP=$(cuantos dump_objetos.txt politica);  DTOT=$((DT+DV+DF+DS+DP))
          ST=$(cuantos stg_objetos.txt tabla);      SV=$(cuantos stg_objetos.txt vista)
          SF=$(cuantos stg_objetos.txt funcion);    SS=$(cuantos stg_objetos.txt secuencia)
          SP=$(cuantos stg_objetos.txt politica);   STOT=$((ST+SV+SF+SS+SP))

          echo ""
          echo "===================== OBJETOS EN public ====================="
          printf "  %-12s %14s %14s\n" ""           "trae el backup" "hay en staging"
          printf "  %-12s %14s %14s\n" "tablas"     "$DT" "$ST"
          printf "  %-12s %14s %14s\n" "vistas"     "$DV" "$SV"
          printf "  %-12s %14s %14s\n" "funciones"  "$DF" "$SF"
          printf "  %-12s %14s %14s\n" "secuencias" "$DS" "$SS"
          printf "  %-12s %14s %14s\n" "politicas"  "$DP" "$SP"
          printf "  %-12s %14s %14s\n" "TOTAL"      "$DTOT" "$STOT"
          echo "============================================================"
          echo ""
          echo "El dump trae $NSETVAL sentencia(s) setval. NINGUNA se comprueba todavia:"
          echo "una secuencia puede volver EXISTIENDO y con el contador mal, y eso aqui"
          echo "sale verde. Es un agujero conocido y abierto (ver el comentario del paso)."
          echo ""
          echo "⚠️  $NPOL_FUERA politica(s) RLS de fuera de public (storage.objects) estan en"
          echo "    staging CONSERVADAS de la propia staging, NO restauradas del backup:"
          echo "    el backup es --schema=public y NO LAS CUBRE. En un incendio de verdad"
          echo "    no habria de donde conservarlas y los buzones se quedarian sin ninguna."
          echo "    Pendiente en backup-bd.yml. Esto se dice tambien cuando todo sale bien."

          # ── LA HUELLA DE LOS ACL: la medida exacta del frente abierto ─────────
          # 🔴 EL RESTORE REABRE PERMISOS, Y HAY QUE VERLO EN CADA EJECUCION.
          #   El dump va con `--no-privileges`: NO trae ni un GRANT ni un REVOKE. Asi
          #   que toda relacion restaurada nace con el `pg_default_acl` de Supabase, o
          #   sea con `anon` dentro. Medido el 9-ago-2026 tras el primer restore bueno:
          #     produccion : 83 relaciones, 73 con permiso para anon
          #     staging    : 83 relaciones, 81 con permiso para anon
          #   Ocho que en produccion estan CERRADAS vuelven ABIERTAS: demanda_asin,
          #   escaner_detalle, factura_lineas_no_inventario, parametro_coste,
          #   sondeo_keepa, v_factura_cuadre, v_producto_amazon y v_velocidad_ventas.
          #
          # 🔑 Y EL DATO QUE CONVIERTE ESTO EN UNA REGLA: de las DIEZ cerradas en
          #   produccion, las dos unicas que se recuperan son `v_demanda_asin_ultima` y
          #   `v_trackeador_cola` -- justo las dos que tienen su REVOKE y su GRANT
          #   escritos dentro de una migracion de `migraciones/`.
          #     LO QUE ESTA EN EL REPO SE PUEDE RECONSTRUIR. LO CERRADO A MANO, NO.
          #
          # ⚠️ Y OJO AL MATIZ, MEDIDO EN EL RUN 31318814366: esas dos NO "sobreviven" al
          #   restore. JUSTO DESPUES DE RESTAURAR, LAS 83 RELACIONES ESTAN ABIERTAS, las
          #   dos incluidas. Se vuelven a cerrar cuando se REAPLICA su migracion, y por
          #   eso el numero baja de 83 a 81 en cuanto la migracion del contador entra.
          #   O sea: el repo no CONSERVA el permiso a traves de una restauracion, permite
          #   REHACERLO. Y solo si alguien vuelve a pasar todas las migraciones. El dia
          #   del incendio, lo unico que estaria cerrado es lo que alguien se acuerde de
          #   volver a aplicar. Es un argumento mas para que el dump traiga los
          #   privilegios en vez de que haya que reconstruirlos.
          #   Por eso el PR pendiente de `backup-bd.yml` deja de ser "copiar las
          #   politicas de storage" y pasa a ser "copiar los PRIVILEGIOS", que ya
          #   sabemos exactamente cuales se pierden.
          #
          # ⚠️ NO HACE FALLAR EL JOB, y es deliberado mientras el frente este abierto:
          #   hoy esta diferencia es CIERTA en toda restauracion, asi que un rojo aqui
          #   saltaria siempre y en dos semanas nadie lo miraria -- el fallo de siempre.
          #   Se IMPRIME para que la diferencia tenga numero. El dia que el backup traiga
          #   los privilegios, esto pasa a ser una comprobacion mas y entonces si falla.
          # 🔒 LA FORMULA NO SE ESCRIBE AQUI: vive en `sql/huella_acl.sql` y la consumen
          #   los dos lados -- este workflow y quien la compruebe a mano. Una huella
          #   calculada con dos codigos no es una huella: basta otro separador, otro
          #   orden o otro texto para el `(sin acl)` para que dos md5 distintos no
          #   prueben nada aunque el estado sea el mismo. Y que hoy coincidan es una
          #   coincidencia, no una garantia. El porque completo, en la cabecera del
          #   fichero.
          # 🔒 Los tres numeros salen de LA MISMA consulta, asi que el denominador y el
          #   numerador de "cuantas con anon" son por construccion la misma poblacion.
          IFS='|' read -r HUELLA_ACL REL_TOTAL CON_ANON < <(psql "$STAGING_DB_URL" -At -F'|' -f sql/huella_acl.sql)
          if [ -z "$HUELLA_ACL" ]; then
            echo "::error::No he podido calcular la huella de los ACL con sql/huella_acl.sql."
            echo "::error::Sin ella, este paso no puede decir cuanto reabre el restore. Para y mira."
            exit 1
          fi
          echo ""
          echo "======= PERMISOS: lo que el backup NO restaura ======="
          echo "  huella md5 de los ACL de public en staging : $HUELLA_ACL"
          # 🔴 EL DENOMINADOR SON LAS RELACIONES, NO LOS OBJETOS. Aqui puso `$STOT`
          #   (los 181 objetos de las CINCO clases) frente a un recuento que solo mira
          #   relaciones, y salio "83 de 181": se lee como menos de la mitad cuando la
          #   verdad es 83 de 83, o sea TODAS. Un denominador equivocado no es un
          #   detalle de formato: minimiza justo el hallazgo que esta linea existe para
          #   medir. Medido en el run 31318814366, que es donde se vio.
          #   Ahora el denominador lo da la propia consulta compartida, asi que no puede
          #   volver a desparejarse del numerador.
          echo "  relaciones (tablas+vistas)                 : $REL_TOTAL"
          echo "  … de ellas, con permiso para anon          : $CON_ANON"
          # 🔒 Aviso si la poblacion de la huella no cuadra con la del inventario. Hoy
          #   coinciden (0 objetos de extension en public, medido); si algun dia una
          #   extension planta una tabla ahi, las dos cifras se separan y conviene
          #   saberlo en vez de que una de las dos mienta en silencio.
          if [ "$REL_TOTAL" != "$((ST+SV))" ]; then
            echo "  ⚠️  ojo: el inventario ve $((ST+SV)) relaciones y la huella $REL_TOTAL."
            echo "      La huella NO excluye objetos de extension y el inventario si."
          fi
          echo "====================================================="
          echo "El backup va con --no-privileges: NO trae permisos. Cada relacion nace"
          echo "con el default de Supabase, o sea con anon dentro. Esta huella NO tiene"
          echo "por que coincidir con la de produccion, y hoy NO coincide: esa diferencia"
          echo "es la medida del frente, no un fallo del restore."
          echo ""
          echo "🔴 AVISO PARA QUIEN LEA STAGING DESPUES: ver una tabla con anon=arwdDxtm"
          echo "   aqui NO significa que una migracion la haya abierto. LO HIZO EL RESTORE."
          echo "   Lo unico que conserva su ACL al restaurar es lo que lleva su REVOKE"
          echo "   escrito en migraciones/. Antes de acusar a nadie, mira eso."

          comm -23 dump_objetos.txt stg_objetos.txt > faltan.txt
          comm -13 dump_objetos.txt stg_objetos.txt > sobran.txt

          if [ -s faltan.txt ]; then
            FALLO=1
            echo "::error::EL BACKUP NO LO TRAJO: $(wc -l < faltan.txt) objeto(s) que el fichero"
            echo "::error::prometia y que no estan en staging:"
            sed 's/^/  /' faltan.txt
            echo "  (ojo: el paso 4 corre con ON_ERROR_STOP=1, asi que si el dump lo hubiera"
            echo "   traido y hubiera fallado, el restore entero habria reventado. Que llegue"
            echo "   hasta aqui significa que la COPIA venia incompleta.)"
          fi
          if [ -s sobran.txt ]; then
            FALLO=1
            echo "::error::EL VACIADO SE DEJO ALGO: $(wc -l < sobran.txt) objeto(s) en staging que"
            echo "::error::NO venian del backup:"
            sed 's/^/  /' sobran.txt
            echo "  (esto SI es un fallo del paso 4 de este workflow, y se arregla aqui.)"
          fi

          # 🔒 La comparacion de arriba es POR NOMBRE, y dos funciones sobrecargadas
          #   comparten nombre: si el dump trae `f(int)` y `f(text)` y la restauracion
          #   solo deja una, los NOMBRES cuadran y el fallo pasaria inadvertido. El
          #   recuento en bruto no se deja enganar. (Medido el 9-ago-2026: hoy no hay
          #   ninguna sobrecarga en produccion -- 16 rutinas, 16 nombres distintos --
          #   pero esto es para el dia que la haya.)
          if [ "$NRUT_DUMP" != "$NRUT_STG" ]; then
            FALLO=1
            echo "::error::El backup trae $NRUT_DUMP rutina(s) y en staging hay $NRUT_STG."
            echo "::error::Si los nombres cuadran pero el recuento no, hay una sobrecarga perdida."
          fi

          if [ "$FALLO" = "0" ]; then
            echo "Objetos: los $DTOT que trae el backup estan en staging, y ni uno de mas."
          fi

          # ── B) FILAS: cada bloque COPY del dump, contra su tabla ──────────────
          # 🔑 IGUALDAD EXACTA, no un umbral. El dump dice cuantas filas trae de cada
          #   tabla, y tras restaurar sobre un esquema VACIO staging no puede tener ni
          #   una mas ni una menos. Nada escribe en staging durante el job, y pg_dump
          #   crea los disparadores DESPUES de cargar los datos, asi que no hay nada
          #   que pueda anadir filas por su cuenta.
          # Y se comprueban TODAS las tablas del dump, no cinco elegidas a mano.
          # (La lista `dump_filas.txt` ya la saco el lector unico del apartado A.)
          if [ ! -s dump_filas.txt ]; then
            echo "::error::El dump no trae ni un bloque COPY. Una copia sin datos no es una copia."
            exit 1
          fi

          # Un solo viaje a la base: el runner esta en EEUU y Supabase en Irlanda
          # (~90 ms por ida y vuelta). 59 count(*) sueltos serian 59 viajes.
          awk -F'|' -v q="'" '{ if (NR > 1) printf " union all ";
                                printf "select %s%s%s, count(*) from %s", q, $1, q, $1 }' \
              dump_filas.txt > cuenta.sql
          psql "$STAGING_DB_URL" -At -F'|' -f cuenta.sql | sort > stg_filas.txt
          join -t'|' dump_filas.txt stg_filas.txt > filas.txt

          # 🔴 SIN ESTA GUARDA EL VEREDICTO TIENE UN AGUJERO: si una tabla del dump no
          #   existe en staging, el `join` simplemente NO produce esa fila, el bucle no
          #   la recorre y nadie marca fallo. Un recuento que se salta lo que falta es
          #   justo la clase de comprobacion que nos ha traido hasta aqui.
          ND=$(wc -l < dump_filas.txt); NJ=$(wc -l < filas.txt)
          if [ "$ND" -ne "$NJ" ]; then
            FALLO=1
            echo "::error::El dump trae $ND tablas con datos pero solo he podido comparar $NJ."
            echo "::error::Alguna no existe en staging. Es el HALLAZGO, no un fallo del script."
            comm -23 <(cut -d'|' -f1 dump_filas.txt) <(cut -d'|' -f1 stg_filas.txt) | sed 's/^/  falta: /'
          fi

          echo ""
          echo "======== FILAS: lo que trae el backup vs lo que hay en staging ========"
          printf "%-44s %12s %12s  %s\n" "tabla" "en el backup" "en staging" "veredicto"
          TOTD=0; TOTS=0; DESCUADRES=0
          while IFS='|' read -r T D S; do
            if [ "$D" = "$S" ]; then
              VER="OK"
            else
              VER="*** NO CUADRA ***"; FALLO=1; DESCUADRES=$((DESCUADRES+1))
              echo "$T|$D|$S" >> descuadres.txt
            fi
            TOTD=$((TOTD+D)); TOTS=$((TOTS+S))
            printf "%-44s %12s %12s  %s\n" "$T" "$D" "$S" "$VER"
          done < filas.txt
          printf "%-44s %12s %12s\n" "TOTAL" "$TOTD" "$TOTS"
          echo "======================================================================="
          echo "$NJ tabla(s) comparada(s), $DESCUADRES descuadre(s)."

          # ── C) El veredicto, tambien al resumen del job ───────────────────────
          {
            echo "### Simulacro de restauracion: veredicto"
            echo ""
            echo "backup restaurado: \`${BACKUP_FICHERO:-?}\`"
            echo ""
            echo "| | trae el backup | hay en staging |"
            echo "|---|---|---|"
            echo "| tablas | $DT | $ST |"
            echo "| vistas | $DV | $SV |"
            echo "| funciones | $DF | $SF |"
            echo "| secuencias | $DS | $SS |"
            echo "| politicas RLS | $DP | $SP |"
            echo "| **objetos** | **$DTOT** | **$STOT** |"
            echo "| filas (todas las tablas) | $TOTD | $TOTS |"
            echo ""
            echo "\`setval\` en el dump: $NSETVAL — **sin comprobar** (agujero conocido)."
            echo ""
            echo "> ⚠️ **$NPOL_FUERA políticas RLS de \`storage\` CONSERVADAS de la propia staging, NO restauradas del backup.**"
            echo "> El backup es \`--schema=public\` y no las cubre. El día del incendio no habría staging"
            echo "> de la que conservarlas y los buzones se quedarían sin ninguna. Pendiente en \`backup-bd.yml\`."
            echo ""
            echo "> 🔴 **Permisos: el backup no los restaura** (\`--no-privileges\`). Huella md5 de los ACL de"
            echo "> \`public\` en staging: \`$HUELLA_ACL\` — **$CON_ANON de $REL_TOTAL relaciones con permiso para \`anon\`**."
            echo "> No tiene por qué coincidir con producción, y hoy no coincide: esa diferencia **es la medida**"
            echo "> del frente, no un fallo del restore. Lo único que conserva su ACL es lo que lleva su"
            echo "> \`REVOKE\` escrito en \`migraciones/\`. Ver una tabla abierta aquí **no** acusa a ninguna migración."
            if [ -s faltan.txt ]; then
              echo ""
              echo "**El backup NO lo trajo:**"
              echo ""
              sed 's/^\([a-z]*\)  /- \1 `/; s/$/`/' faltan.txt
            fi
            if [ -s sobran.txt ]; then
              echo ""
              echo "**El vaciado del paso 4 se dejo esto sin borrar:**"
              echo ""
              sed 's/^\([a-z]*\)  /- \1 `/; s/$/`/' sobran.txt
            fi
            if [ -s descuadres.txt ]; then
              echo ""
              echo "**Tablas cuyo numero de filas NO cuadra:**"
              echo ""
              echo "| tabla | en el backup | en staging |"
              echo "|---|---|---|"
              sed 's/^/| /; s/|/ | /g; s/$/ |/' descuadres.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FALLO" != "0" ]; then
            echo ""
            echo "::error::LA COPIA NO ESTA DEMOSTRADA: staging no tiene todo lo que el fichero traia."
            echo "Ojo al nombre: esto NO dice 'staging se ha quedado atras respecto a produccion'."
            echo "Eso seria DERIVA y es otra pregunta. Esto dice que la copia no reconstruye ni"
            echo "siquiera su propio contenido. Es el incendio."
            {
              echo ""
              echo "**resultado: LA COPIA NO ESTA DEMOSTRADA -- no reconstruye ni su propio contenido**"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo ""
          echo "VERIFICADO: el backup traia $DTOT objetos y $TOTD filas, y eso es exactamente"
          echo "lo que hay en staging. La copia reconstruye lo que contiene."
          echo ""
          echo "Lo que esto NO dice: si produccion ha cambiado desde que se hizo la copia."
          echo "Eso es DERIVA, es otra pregunta, y se elimina con la regla de la casa:"
          echo "ANTES DE ENSAYAR UNA MIGRACION EN STAGING, SE RESTAURA STAGING."
          {
            echo ""
            echo "**resultado: VERIFICADO -- el backup reconstruye lo que contiene ($DTOT objetos, $TOTD filas),"
            echo "con $NPOL_FUERA politicas de storage CONSERVADAS de staging, NO restauradas del backup**"
          } >> "$GITHUB_STEP_SUMMARY"

      # 🔒 El rastro se deja AL FINAL y con `if: always()`: si la restauración falla a
      #    medias, lo que hay en staging tampoco es lo que había antes, así que la otra
      #    sesión necesita enterarse igual.
      #    La tabla se recrea aquí porque el dump acaba de pasar por encima. No viene en el
      #    backup —es de staging, no de producción—, así que normalmente sobrevive; el
      #    `if not exists` cubre el día que el restore limpie el esquema entero.
      - name: 9) Dejar rastro de quien ha restaurado
        if: always()
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          QUIEN:   ${{ github.actor }}
          MOTIVO:  ${{ github.event.inputs.motivo }}
          FICHERO: ${{ github.event.inputs.fichero }}
          RESULTADO: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          psql "$STAGING_DB_URL" -q -c "
            create table if not exists public.staging_restauraciones (
              id            bigserial primary key,
              restaurado_en timestamptz not null default now(),
              quien         text,
              motivo        text,
              fichero       text,
              run_url       text
            );
            comment on table public.staging_restauraciones is
              'Quien ha restaurado staging y cuando. Vive SOLO en staging y NO viene en el
               backup de produccion, asi que sobrevive a la propia restauracion. Existe
               porque varias sesiones trabajan a la vez y una restauracion le tira el
               ensayo a quien este midiendo: al menos que se vea quien fue.';
            revoke all on public.staging_restauraciones from public, anon, authenticated;
            grant select on public.staging_restauraciones to authenticated;"
          psql "$STAGING_DB_URL" -q -c "
            insert into public.staging_restauraciones (quien, motivo, fichero, run_url)
            values (nullif('$QUIEN',''),
                    nullif(trim(concat('$MOTIVO', ' [', '$RESULTADO', ']')),''),
                    nullif('$FICHERO',''), '$RUN_URL');"
          echo "--- Rastro dejado ---"
          psql "$STAGING_DB_URL" -c "
            select restaurado_en, quien, coalesce(motivo,'-') as motivo
              from public.staging_restauraciones order by restaurado_en desc limit 3;"

      # ⚠️ VA EL ULTIMO, DETRAS DEL RASTRO, y no por orden estetico: este paso FALLA
      #    el run cuando staging va por detras, y si fuera antes se llevaria por delante
      #    el paso 9. La restauracion SI ha ocurrido aunque este veredicto sea rojo, y
      #    staging es compartido: no dejar constancia de quien restauro seria peor que
      #    el problema que este paso avisa.
      # ════════════════════════════════════════════════════════════════════════
      # 🔴 10) ¿LE FALTA A STAGING ALGO QUE PRODUCCION SI TIENE?
      #
      # El backup es de ANOCHE. Restaurar DESHACE lo que se haya aplicado a produccion
      # HOY, y despues de esto viene un ensayo encima. Fernando, 21-ago-2026:
      #
      #   🔑 «puede ser una migracion que se aplique LIMPIAMENTE en un staging al que le
      #      falta la columna con la que iba a chocar en produccion»
      #
      # Ese ensayo saldria VERDE sin probar nada. No es una molestia: es la escalera
      # mintiendo, y la escalera es la unica red que hay para no romper la operativa de
      # Elena. 🔬 Paso de verdad esa manana con `paneu_aptos.pendiente_evaluacion`; se
      # cazo de rebote porque un procesador murio con `column does not exist`.
      #
      # 🔒 SE LEE PRODUCCION, Y ES A PROPOSITO. Sin mirarla no se puede separar
      #    «falta en staging porque produccion ya la tiene» (peligro) de «falta en los dos
      #    porque es la que vas a ensayar ahora» (normal). Sin esa distincion el aviso
      #    saltaria SIEMPRE y se dejaria de leer en dos semanas — la cara B de §3.
      # 🔒 Y SE LEE EN SOLO LECTURA FORZADA: `default_transaction_read_only=on` no es un
      #    acuerdo, es el servidor negandose. Este workflow tiene un cerrojo
      #    anti-produccion en el paso 1 y aqui entra la unica credencial de produccion que
      #    toca en toda su vida; que no pueda escribir lo garantiza Postgres, no el
      #    cuidado de quien lo escribio.
      # ⚠️ FALLA EL RUN a proposito. Un resumen verde con un aviso dentro se pasa por
      #    alto, y lo que se pide es que no se pueda empezar a ciegas. Solo salta cuando
      #    falta algo de verdad, asi que no es una alarma permanente.
      - name: 10) VEREDICTO - staging no puede ir por detras de produccion
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          PROD_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          if [ -z "${PROD_DB_URL:-}" ]; then
            echo "::error::Falta SUPABASE_DB_URL. Sin produccion no se puede saber si staging va por detras, y dar por bueno lo que no se ha mirado es justo lo que este paso evita."
            exit 1
          fi
          python scripts/censo_migraciones.py > /tmp/censo.sql
          # 🔒 Solo lectura FORZADA por el servidor para la conexion de produccion.
          PGOPTIONS='-c default_transaction_read_only=on'             psql "$PROD_DB_URL" -t -A -F'|' -v ON_ERROR_STOP=1 -P pager=off -f /tmp/censo.sql > /tmp/censo_prod.txt
          psql "$STAGING_DB_URL" -t -A -F'|' -v ON_ERROR_STOP=1 -P pager=off -f /tmp/censo.sql > /tmp/censo_stg.txt
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 10 · ¿staging va por detras de produccion?" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python scripts/comparar_censos.py /tmp/censo_prod.txt /tmp/censo_stg.txt | tee -a "$GITHUB_STEP_SUMMARY"
          ESTADO=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $ESTADO
