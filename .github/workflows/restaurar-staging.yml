name: Moloka - Simulacro de la copia (base desechable)

# El SIMULACRO DE INCENDIO: coge la copia de R2 y la restaura en una base que NACE
# VACIA DENTRO DE ESTE RUN Y MUERE CON EL, para demostrar que la copia sirve de verdad.
#
# 🔴 DESDE EL 30-sep-2026 (encargo A) YA NO RESTAURA EN STAGING. Fernando decidio
#   jubilar la base de pruebas (proyecto lusujlzyndsydibkeija), y este simulacro era
#   su ultimo uso con sentido. El fichero conserva su nombre (`restaurar-staging.yml`)
#   a proposito: `workflow_dispatch` solo deja lanzar desde una rama un .yml que ya
#   existe en `main`, y asi el simulacro se probo de verdad antes de fusionarse (el
#   run va en el PR). Renombrarlo es un cambio aparte, cuando ya este en `main`.
#
# 🔑 LA BASE DESECHABLE ES UN SUPABASE DE VERDAD, NO UNA MAQUETA. Se levanta con la
#   CLI de Supabase (`supabase start`) dentro del runner: el mismo Postgres de
#   Supabase, con sus roles (anon, authenticated, service_role, supabase_admin…),
#   su esquema `auth` (de donde sale `auth.uid()`, que usan 63 politicas de public)
#   y su esquema `storage` con las tablas que crea el servicio de Storage — que es
#   donde el fichero de permisos pone las politicas de los buzones. O sea: lo mismo
#   que tendriamos el dia del incendio, un proyecto de Supabase NUEVO y VACIO. Un
#   Postgres pelado (el `postgres:16` del CI de la v2) no tiene nada de eso y habria
#   que fingirlo a mano, que es justo lo que no se quiere juzgar.
#
# 🔒 NO VUELVE A HABER BASE COMPARTIDA. Por eso se van tres pasos que solo existian
#   porque staging era de todos: el «quien restauro antes» (2b), el rastro en
#   `staging_restauraciones` (9) y el «staging no puede ir por detras de
#   produccion» (10, que protegia los ensayos que se hacian ENCIMA de staging). Y
#   el vaciado con captura de las politicas de storage del paso 4: una base que nace
#   vacia no tiene nada que vaciar ni que conservar. Las politicas de storage que
#   quedan al final vienen TODAS del fichero de permisos — el caso del incendio.
#
# 🔒 LA UNICA CREDENCIAL DE PRODUCCION que toca este workflow es la del paso 5b, y
#   entra en SOLO LECTURA FORZADA (`default_transaction_read_only=on`). Nada de lo
#   que hace este run puede escribir en produccion: la base donde se restaura es
#   `127.0.0.1` del propio runner, y el paso 2b se niega a seguir si no lo es.
#
# ─────────────────────────────────────────────────────────────────────────────
# HISTORIA (vale hasta el 30-sep-2026: el destino era staging). Se conserva porque
# explica por que el veredicto es como es; lo que dice de staging es registro.
# ─────────────────────────────────────────────────────────────────────────────
#
# 🔴 PRIMER AGUJERO (hasta el 30-jul-2026): EL SIMULACRO NO PODIA FALLAR, ASI QUE
#   NO PROBABA NADA.
#   · psql corria con ON_ERROR_STOP=0 → seguia adelante pasara lo que pasara;
#   · la unica comprobacion posterior imprimia un numero y NO lo comparaba con nada.
#   Una restauracion que solo recuperase media base terminaba en VERDE.
#
# 🔴 SEGUNDO AGUJERO, EL GORDO (encontrado el 9-ago-2026, run 31296420722, en cuanto
#   el simulacro endurecido se pudo caer por primera vez). Se paro en la linea 27 de
#   111.734, antes de restaurar un solo dato:
#       psql:backup.sql:27: ERROR:  relation "public.monitor_resultados" does not exist
#   El dump se hacia con `--clean --if-exists`, o sea que empezaba por un bloque de
#   borrados, y ahi pg_dump escribe sentencias del tipo:
#       ALTER TABLE ONLY public.x DROP CONSTRAINT IF EXISTS y;
#   donde el "IF EXISTS" protege a la RESTRICCION, NO a la TABLA. Si la tabla no
#   esta, revienta. Traducido: aquel backup SOLO se podia restaurar encima de una
#   base que YA tuviera el esquema entero. En el incendio de verdad -- produccion
#   perdida, proyecto nuevo y VACIO -- habria fallado en esa misma linea 27.
#   El backup no estaba roto (los datos estaban); lo que estaba roto es que no habia
#   forma de distinguir "errores inofensivos de cabecera" de "restauracion a medias".
#
# 🔴 TERCER AGUJERO, el que hacia inutiles TODOS los ensayos: NADIE COMPROBABA QUE
#   STAGING SE PARECIERA A PRODUCCION. El 9-ago-2026 staging tenia 46 tablas + 8
#   vistas contra las 59 + 24 de produccion: faltaban 29 objetos, entre ellos
#   v_salud_asin y v_trackeador_cola. Con esa divergencia, cualquier ensayo de una
#   migracion en staging demostraba sobre produccion exactamente NADA. Un restore
#   que no termina diciendo "esto tiene TODO lo que tenia que tener" no es un
#   restore verificado: es un restore esperanzado.
#
# COMO QUEDA
#   1) El dump ya NO lleva `--clean` (backup-bd.yml): es solo CREATE + COPY. Un dump
#      que no borra nada tampoco puede destruir nada por su cuenta.
#   2) VACIAR lo hace este workflow, y vacia EL CAJON, NO TIRA EL MUEBLE: se borran
#      los objetos de `public`, pero NO se hace `DROP SCHEMA public`.
#      🔒 Por que importa: tirar el esquema se llevaria por delante sus permisos y,
#      sobre todo, sus DEFAULT PRIVILEGES -- los de §4 del CLAUDE.md, los que hacen
#      que en Supabase todo objeto nuevo nazca con `anon` dentro. Staging dejaria de
#      comportarse como produccion justo en la dimension donde mas caro sale que se
#      parezcan, y volveriamos a tener dos bases distintas por otro camino.
#   3) El vaciado y la carga van en LA MISMA transaccion (`--single-transaction`):
#      si algo falla, staging se queda EXACTAMENTE como estaba. Nunca vacia, nunca
#      a medias.
#   4) Y al final hay un VEREDICTO que compara staging contra EL PROPIO DUMP:
#      lo que el fichero dice traer -- TABLAS, VISTAS, FUNCIONES, SECUENCIAS y
#      POLITICAS RLS, que son las cinco clases que el vaciado borra -- contra lo que
#      quedo en staging, por su nombre; y las filas de CADA bloque `COPY` contra las
#      filas de esa tabla, por IGUALDAD EXACTA. Si no cuadra, ROJO con la lista.
#
#      🔑 PARA QUE SE LEE, que no es lo que parece: como el paso 4 corre con
#      ON_ERROR_STOP=1, cualquier sentencia que el dump TRAIGA y falle ya revienta el
#      restore entero. Asi que el inventario no sirve para pillar lo que el restore no
#      aplico -- eso ya esta cubierto. Sirve para distinguir DOS COSAS DISTINTAS:
#        · FALTA algo que el dump prometia → EL BACKUP NO LO TRAJO. Fallo de la COPIA.
#        · SOBRA algo que el dump no traia → el VACIADO del paso 4 no lo borro.
#      Los dos son rojos, pero no son el mismo problema y no se arreglan en el mismo
#      sitio. El mensaje dice cual es cual.
#
#      🔴 POR QUE CONTRA EL DUMP Y NO CONTRA PRODUCCION -- esto es el corazon del
#      asunto y se equivoco una version anterior de este mismo paso:
#      · El backup es de anoche y produccion no para (Elena carga informes a diario).
#        Comparar contra produccion VIVA daria ROJO en una restauracion PERFECTA en
#        cuanto produccion tuviera una fila mas. Y una guarda que da falsos rojos deja
#        de mirarse en dos semanas: asi es como se muere una guarda.
#      · Y sobre todo: EL DIA DEL INCENDIO NO HAY PRODUCCION CONTRA LA QUE COMPARAR.
#        Un veredicto que necesita produccion para funcionar es un veredicto que no
#        funciona el dia que hace falta. Lo que hay que demostrar es que el BACKUP
#        puede reconstruir lo que contiene, y eso se mide DENTRO del fichero.
#      · Efecto lateral que importa: este workflow NO necesita la credencial de
#        produccion. La base cuyo trabajo es vaciar y recargar no tiene por que poder
#        abrir la de Elena.
#      · Y no hay ni un numero fijo escrito a mano: los que caducan solos son los que
#        acaban tapando un agujero de 29 objetos con un verde.
#
#      ⚠️ Lo que este veredicto NO dice: si produccion ha cambiado desde el backup.
#      No es su trabajo. Como el backup ES produccion, una restauracion verificada
#      deja staging igual a produccion EN EL INSTANTE DE LA COPIA, que es justo lo que
#      hace que un ensayo signifique algo. Vigilar la deriva del dia a dia entre las
#      dos bases es otra guarda distinta, y va en otro sitio.
#
# 🔴 CUARTO AGUJERO, EL QUE ESTE MISMO WORKFLOW LLEVABA MESES DICIENDO EN VOZ ALTA
#   (encargo P, 17-sep-2026). Su veredicto terminaba con la frase «con N politicas de
#   storage CONSERVADAS de staging, NO restauradas del backup», y nadie miraba lo
#   otro: que el backup TAMPOCO devuelve los permisos, porque va con
#   `pg_dump --no-privileges`. Medido sobre la staging recien restaurada del run
#   35217707471: `authenticated` podia leer 1 de 161 relaciones y escribir en 0, y
#   `anon` ninguna, contra las 137 que lee y las 70 que escribe en produccion.
#   El simulacro salia VERDE dejando una base que no puede abrir NADIE — ni la v2
#   (entra por `authenticated`) ni la v1 ni el escaner (entran por `anon`).
#   🔒 Desde hoy hay un input `permisos` (no | si, por defecto NO: lo de siempre no
#   cambia). Con `si`, el paso 4b aplica el `permisos_<FECHA>.sql` de ESA MISMA copia
#   —el que sube `copia-r2.yml` de la v2 al lado del volcado— en su propia
#   transaccion y todo-o-nada, y el paso 5b lo juzga: la huella del ACL de `public`
#   de staging tiene que ser, linea a linea, la de produccion (leida en solo lectura
#   forzada), y las politicas de storage tienen que venir DEL FICHERO, no de lo que
#   staging conservase.
#   ⚠️ Solo con `prefijo=v2/bd`: la copia de la v1 (`bd/`) no guarda permisos.

on:
  workflow_dispatch:
    inputs:
      fichero:
        description: "Nombre del volcado (vacio = el de la ultima copia COMPLETA)"
        required: false
        default: ""
      motivo:
        description: "Para que lo lanzas (queda en el resumen del run)"
        required: false
        default: ""
      # 🔴 LOS DOS DEFAULTS CAMBIAN EL 30-sep-2026 (encargo A): la copia de la v1
      #    (`bd/`) esta apagada desde el 17-sep-2026 (`scripts/backup/README.md` de
      #    la v2), asi que «el ultimo de bd/» es una copia de hace dos semanas. La
      #    copia viva es la de la v2, y la unica que trae permisos.
      prefijo:
        description: "Cajon de R2 a restaurar: 'v2/bd' (por defecto) o 'bd' (la copia vieja de la v1)"
        required: false
        default: "v2/bd"
      permisos:
        description: "Aplicar y juzgar tambien los permisos de esa copia ('si' por defecto; solo con prefijo v2/bd)"
        required: false
        default: "si"

concurrency:
  group: simulacro-copia
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  restaurar:
    runs-on: ubuntu-24.04
    # Medido en la prueba del encargo A: ver el run del PR. Con 45 min sobra; sin
    # tope, GitHub espera 6 horas a un paso colgado.
    timeout-minutes: 45
    env:
      # La CLI se fija por version: la base desechable tiene que ser la misma de un
      # run a otro, o dos simulacros no se pueden comparar.
      SUPABASE_CLI_VERSION: 2.118.0
      DESECHABLE_DIR: ${{ github.workspace }}/../desechable
    steps:
      # Hace falta por `sql/huella_acl.sql` y `sql/huella_acl_public.sql`, que son las
      # formulas de los veredictos y las comparten con quien las compruebe a mano.
      - uses: actions/checkout@v7

      - name: 1) Anotar el motivo
        env:
          MOTIVO: ${{ github.event.inputs.motivo }}
        run: |
          echo "### Simulacro de la copia en una base desechable" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "motivo: ${MOTIVO:-(sin motivo)}" >> "$GITHUB_STEP_SUMMARY"

      # 🔴 LISTA CERRADA, Y ANTES DE TOCAR NADA (encargo R, 17-sep-2026). El
      #    `prefijo` decide de que cajon de R2 se restaura, asi que un valor que
      #    no sea exactamente uno de los dos que existen hoy no se intenta
      #    interpretar: se para aqui, antes de bajar nada de R2.
      #    `v2/bd` es la copia semanal de moloka-app-v2 (`copia-r2.yml`) y el
      #    default desde el 30-sep-2026; `bd` es la copia vieja de la v1.
      - name: 1b) Cerrojos de los inputs -- prefijo y permisos
        env:
          PREFIJO: ${{ github.event.inputs.prefijo }}
          PERMISOS_INPUT: ${{ github.event.inputs.permisos }}
        run: |
          case "$PREFIJO" in
            bd|v2/bd) echo "Prefijo OK: '$PREFIJO'." ;;
            *)
              echo "::error::Prefijo '$PREFIJO' no reconocido. Solo se admite 'v2/bd' (v2) o 'bd' (v1). Nada se ha tocado."
              exit 1
              ;;
          esac
          echo "PREFIJO=$PREFIJO" >> "$GITHUB_ENV"
          # 🔴 Y EL OTRO INPUT, AQUI MISMO Y POR LO MISMO (encargo P, 17-sep-2026): lista
          #    cerrada, y antes de bajar nada de R2. `permisos=si` solo tiene sentido con
          #    `v2/bd`, porque el fichero `permisos_<FECHA>.sql` lo escribe `copia-r2.yml`
          #    de la v2 y vive en `v2/permisos/`. La copia de la v1 (`bd/`) NO guarda
          #    permisos.
          case "$PERMISOS_INPUT" in
            no|si) echo "Permisos: '$PERMISOS_INPUT'." ;;
            *)
              echo "::error::permisos='$PERMISOS_INPUT' no se reconoce. Solo 'si' o 'no'. Nada se ha tocado."
              exit 1
              ;;
          esac
          if [ "$PERMISOS_INPUT" = "si" ] && [ "$PREFIJO" != "v2/bd" ]; then
            echo "::error::permisos=si solo funciona con prefijo='v2/bd'. Los permisos los guarda la copia de la v2 (encargo P); la copia de la v1 ('bd/') no los tiene. Nada se ha tocado."
            exit 1
          fi

      - name: 2) Instalar cliente Postgres 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null

      - name: 2a) Instalar la CLI de Supabase (version fija)
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # ── 2b) LA BASE DESECHABLE: nace aqui, vacia, y muere con el runner ─────
      # 🔒 En una carpeta PROPIA, fuera del checkout: `supabase start` aplica lo que
      #    encuentre en `supabase/migrations` y `supabase/seed.sql` de su carpeta, y
      #    aqui no tiene que encontrar nada. Una base que nace con algo dentro ya no
      #    es la del incendio.
      # 🔒 Se apagan los servicios que no pintan nada (el panel, realtime, funciones,
      #    logs, correo…). Se quedan la base, Auth y Storage —los que crean los
      #    esquemas `auth` y `storage` de un proyecto nuevo— y el gateway.
      - name: 2b) Levantar la base desechable (Supabase local, vacio)
        run: |
          set -euo pipefail
          mkdir -p "$DESECHABLE_DIR" && cd "$DESECHABLE_DIR"
          supabase init
          # La misma version mayor que produccion (17.6, medido el 30-sep-2026).
          sed -i 's/^major_version = .*/major_version = 17/' supabase/config.toml
          grep -n '^major_version' supabase/config.toml
          supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit
          SIM_DB_URL=$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')
          # 🔴 EL CERROJO DE ESTE WORKFLOW, AL REVES QUE ANTES: ya no basta con «no es
          #    produccion». La base tiene que ser la del propio runner, y ninguna otra.
          case "$SIM_DB_URL" in
            *ogfbjjdxcltzpygzuyla*) echo "::error::La base del simulacro es PRODUCCION. Me niego."; exit 1;;
            postgresql://*@127.0.0.1:*|postgresql://*@localhost:*) echo "Cerrojo OK: la base es la del propio runner.";;
            *) echo "::error::No reconozco la base del simulacro ('$SIM_DB_URL' no es local). Me niego."; exit 1;;
          esac
          echo "SIM_DB_URL=$SIM_DB_URL" >> "$GITHUB_ENV"
          echo "--- imagenes levantadas ---"
          docker ps --format '{{.Image}}' | sort
          # 🔒 Y que nace VACIA, con lo que tiene un proyecto nuevo y nada mas. Si
          #    `public` trajera algo, el veredicto del paso 5 lo contaria como «sobra»
          #    y no sabriamos si es de la copia o de la base.
          psql "$SIM_DB_URL" -X -v ON_ERROR_STOP=1 -At -F' | ' <<'SQL'
          select 'version', version();
          select 'rol de conexion', current_user || ' (superusuario: ' || (select rolsuper from pg_roles where rolname = current_user) || ')';
          select 'objetos en public', count(*) from pg_class where relnamespace = 'public'::regnamespace;
          select 'funciones en public', count(*) from pg_proc where pronamespace = 'public'::regnamespace;
          select 'auth.uid()', to_regprocedure('auth.uid()') is not null;
          select 'storage.objects', to_regclass('storage.objects') is not null;
          select 'storage.buckets', to_regclass('storage.buckets') is not null;
          select 'extensiones', string_agg(extname || ' ' || extversion, ', ' order by extname) from pg_extension;
          select 'roles', string_agg(rolname, ', ' order by rolname) from pg_roles where rolname not like 'pg\_%';
          do $$
          begin
            if exists (select 1 from pg_class where relnamespace = 'public'::regnamespace)
               or exists (select 1 from pg_proc where pronamespace = 'public'::regnamespace) then
              raise exception 'La base desechable NO nace vacia: public ya trae objetos. No se restaura encima.';
            end if;
            if to_regprocedure('auth.uid()') is null then
              raise exception 'La base desechable no tiene auth.uid(): las politicas de public no se podrian crear.';
            end if;
            if to_regclass('storage.objects') is null or to_regclass('storage.buckets') is null then
              raise exception 'La base desechable no tiene storage.objects/buckets: las politicas de los buzones no se podrian crear.';
            end if;
          end $$;
          SQL

      - name: 3) Bajar el backup de R2
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID:         ${{ secrets.R2_ACCOUNT_ID }}
          FICHERO: ${{ github.event.inputs.fichero }}
        run: |
          set -euo pipefail
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # 🔴 «EL ULTIMO» ES LA ULTIMA COPIA COMPLETA, no el ultimo volcado (encargo
          #    A, 30-sep-2026). Desde el encargo CR (28-sep) una copia de la v2 es de
          #    fiar solo si tiene su marca en `v2/completas/`: un volcado sin marca es
          #    de un run que se corto despues de subirlo. El simulacro juzga la copia
          #    en la que confiariamos el dia del incendio, no la ultima que se empezo.
          if [ -z "$FICHERO" ]; then
            if [ "$PREFIJO" = "v2/bd" ]; then
              FECHA=$(aws s3 ls "s3://moloka-backups/v2/completas/" --endpoint-url "$EP" --region auto \
                      | awk '{print $4}' | sed -n 's/^completa_\(.*\)\.txt$/\1/p' | sort | tail -1)
              if [ -z "$FECHA" ]; then
                echo "::error::No hay ninguna copia COMPLETA en v2/completas/. Sin copia completa no hay nada de fiar que restaurar."
                exit 1
              fi
              FICHERO="moloka_${FECHA}.sql.gz"
            else
              FICHERO=$(aws s3 ls "s3://moloka-backups/${PREFIJO}/" --endpoint-url "$EP" --region auto \
                        | awk '{print $4}' | sort | tail -1)
            fi
          fi
          echo "Restaurando: $FICHERO (prefijo: $PREFIJO)"
          echo "BACKUP_FICHERO=$FICHERO" >> "$GITHUB_ENV"
          echo "BACKUP_RUTA=${PREFIJO}/$FICHERO" >> "$GITHUB_ENV"
          aws s3 cp "s3://moloka-backups/${PREFIJO}/$FICHERO" backup.sql.gz \
            --endpoint-url "$EP" --region auto --no-progress
          echo "Tamano del volcado comprimido: $(wc -c < backup.sql.gz) bytes"

      # ── 4) Restaurar, TODO EN UNA TRANSACCION ─────────────────────────────
      # 🔒 La base nace vacia (lo exige el paso 2b), asi que aqui ya no hay vaciado
      #    ni politicas de storage que conservar: se carga el volcado tal cual, y si
      #    una sola sentencia falla, no queda nada a medias.
      - name: 4) Restaurar en la base desechable (una transaccion)
        run: |
          set -uo pipefail
          gunzip -f backup.sql.gz
          echo "Lineas del dump: $(wc -l < backup.sql)"

          # 🔴 GUARDA DE FORMATO -- falla CERRADO y con el motivo dicho.
          #   Los backups anteriores al 9-ago-2026 se hicieron con `--clean --if-exists`
          #   y empiezan por un bloque de borrados que NO se puede aplicar sobre un
          #   `public` vacio (es exactamente el fallo del run 31296420722).
          if grep -qEm1 '^(ALTER TABLE ONLY .* DROP CONSTRAINT IF EXISTS|DROP (TABLE|VIEW|SEQUENCE|INDEX|FUNCTION|ROUTINE) IF EXISTS)' backup.sql; then
            echo "::error::'$BACKUP_FICHERO' es del formato ANTIGUO (pg_dump con --clean)."
            echo "::error::Trae un bloque de borrados que no se puede aplicar sobre un esquema vacio."
            exit 1
          fi
          echo "Formato OK: el dump no trae bloque de borrados."

          # 🔴 SE FILTRA UNA SOLA SENTENCIA, POR SU NOMBRE, Y ES BENIGNA.
          #   `pg_dump --schema=public` incluye `CREATE SCHEMA public;`, y en un proyecto
          #   de Supabase el esquema `public` ya existe (con sus permisos y sus DEFAULT
          #   PRIVILEGES, que son los que hay que conservar). Se quita ESA linea y se
          #   dice cuantas se han quitado. Lo que NO se hace es filtrar por categorias.
          N_SCHEMA=$(grep -c '^CREATE SCHEMA public;$' backup.sql || true)
          echo "Sentencias 'CREATE SCHEMA public;' filtradas del dump: $N_SCHEMA"
          grep -v '^CREATE SCHEMA public;$' backup.sql > restaurar.sql
          echo "Para leer un error: 'restaurar.sql:X' es la linea X del dump original,"
          echo "o $N_SCHEMA mas abajo si cae despues del 'CREATE SCHEMA public;' filtrado."

          if ! psql "$SIM_DB_URL" -X -v ON_ERROR_STOP=1 --single-transaction \
                 -q -f restaurar.sql 2> restaurar_error.log; then
            echo "::error::La restauracion ha FALLADO: la copia no se deja cargar en un Supabase nuevo."
            echo "--- Donde se paro (psql se detiene en el PRIMER error) ---"
            head -40 restaurar_error.log
            echo "----------------------------------------------------------"
            echo "Esto NO es un fallo del workflow: es el HALLAZGO. Mira que sentencia"
            echo "es y decide si es benigna. Si lo es, se filtra ESE caso por su nombre."
            echo "Lo que NO se hace nunca es volver a poner ON_ERROR_STOP=0."
            exit 1
          fi
          echo "Restauracion aplicada sin errores."
          if [ -s restaurar_error.log ]; then
            echo "--- Avisos de psql (no han parado la restauracion) ---"
            head -60 restaurar_error.log
          fi

      # ── 4b) LOS PERMISOS DE ESA MISMA COPIA (encargo P, 17-sep-2026) ──────
      # 🔑 LO QUE SE APLICA ES EL FICHERO DE ESA COPIA, NO «el último». El nombre sale
      #   del propio volcado (`moloka_<FECHA>.sql.gz` → `permisos_<FECHA>.sql`): son
      #   pareja.
      # 🔒 VA DESPUÉS DEL PASO 4: el fichero nombra objetos de `public` que tienen que
      #   existir ya, y las políticas de `storage` llaman a funciones de `public`.
      # 🔒 TRANSACCIÓN PROPIA, TODO O NADA.
      # 🆕 30-sep-2026 (encargo A): ANTES DE APLICARLO SE CREAN LOS ROLES PROPIOS que el
      #   fichero lista en su censo (moloka_cargadores, moloka_copias…), sin contraseña.
      #   Es lo que habría que hacer el día del incendio —el censo existe para eso—, y
      #   así el veredicto 5b compara TODOS los privilegios, también los de esos roles,
      #   en vez de sacarlos de la comparación como hacía con staging.
      - name: 4b) Aplicar los permisos de ESA copia (solo con permisos=si)
        if: ${{ github.event.inputs.permisos == 'si' }}
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID:         ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          FECHA_COPIA=$(printf '%s' "$BACKUP_FICHERO" | sed 's/^moloka_//; s/\.sql\.gz$//')
          case "$FECHA_COPIA" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]_[0-9][0-9][0-9][0-9]) ;;
            *)
              echo "::error::De '$BACKUP_FICHERO' no sale una FECHA de copia (AAAA-MM-DD_HHMM), asi que no se puede saber que fichero de permisos le toca. Los datos SI estan restaurados."
              exit 1;;
          esac
          PERM="permisos_${FECHA_COPIA}.sql"
          echo "Permisos de esta copia: v2/permisos/$PERM"

          if ! aws s3 cp "s3://moloka-backups/v2/permisos/$PERM" "$PERM" \
                 --endpoint-url "$EP" --region auto --no-progress; then
            echo "::error::No esta 'v2/permisos/$PERM' en R2. Los datos SI estan restaurados; lo que falta son los GRANT y las politicas de storage."
            exit 1
          fi

          BYTES=$(wc -c < "$PERM")
          echo "Fichero de permisos: $(wc -l < "$PERM") lineas, $BYTES bytes"
          if [ "$BYTES" -lt 20000 ]; then
            echo "::error::El fichero de permisos son $BYTES bytes (en produccion son ~80 KB). No se aplica."; exit 1
          fi
          grep -q 'GRANT ' "$PERM" || { echo "::error::El fichero de permisos no trae ni un GRANT. No se aplica."; exit 1; }
          tail -n 5 "$PERM" | grep -q 'FIN DEL FICHERO DE PERMISOS' \
            || { echo "::error::El fichero de permisos no termina con su cierre: llego cortado. No se aplica."; exit 1; }
          echo "--- de donde viene ---"; grep -E '^-- (origen|generado|huella_acl_origen):' "$PERM" || true

          # ── Los roles propios del censo, antes que nada ──
          # 🔒 Solo los PROPIOS (la columna `propio` la pone el exportador: ni `pg_*`, ni
          #    `supabase_*`, ni los que trae cualquier proyecto). Los de Supabase no se
          #    inventan: si alguno falta, el fichero lo dice y el 5b lo saca de la
          #    comparacion, como antes.
          {
            echo "CREATE TEMP TABLE moloka_permisos_roles (rol text, atributos text, miembro_de text, propio boolean);"
            grep '^INSERT INTO moloka_permisos_roles VALUES ' "$PERM"
            cat <<'SQL'
          DO $$
          DECLARE r record; m text; n int := 0;
          BEGIN
            FOR r IN SELECT * FROM moloka_permisos_roles p
                      WHERE p.propio
                        AND NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles g WHERE g.rolname = p.rol)
                      ORDER BY p.rol
            LOOP
              EXECUTE format('CREATE ROLE %I %s', r.rol, coalesce(r.atributos, ''));
              FOREACH m IN ARRAY coalesce(string_to_array(nullif(r.miembro_de, ''), ', '), '{}') LOOP
                EXECUTE format('GRANT %I TO %I', m, r.rol);
              END LOOP;
              n := n + 1;
              RAISE INFO 'Rol propio creado (sin contrasena): % [%] miembro de: %', r.rol, r.atributos, coalesce(nullif(r.miembro_de, ''), '-');
            END LOOP;
            RAISE INFO 'Roles propios creados: %', n;
          END $$;
          SQL
          } > roles_propios.sql
          echo "--- roles del censo del fichero ---"
          grep '^INSERT INTO moloka_permisos_roles VALUES ' "$PERM" | sed 's/^INSERT INTO moloka_permisos_roles VALUES /  /'
          if ! psql "$SIM_DB_URL" -X -v ON_ERROR_STOP=1 --single-transaction -q -f roles_propios.sql; then
            echo "::error::No se han podido crear los roles propios del censo. Los datos SI estan restaurados."
            exit 1
          fi

          # 🔒 TODO O NADA, y parando en el primer error.
          if ! psql "$SIM_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -X -q -At \
                 -f "$PERM" > permisos_resumen.txt 2> permisos_avisos.txt; then
            echo "::error::Los permisos NO se han aplicado. La base tiene los datos restaurados y los permisos de un proyecto nuevo."
            echo "--- donde se paro ---"; head -40 permisos_avisos.txt
            exit 1
          fi
          echo "--- resumen del fichero de permisos ---"; cat permisos_resumen.txt
          echo "--- avisos (lo que se ha saltado, y por que) ---"; head -60 permisos_avisos.txt

          AUSENTES=$(sed -n 's/^roles_ausentes|//p' permisos_resumen.txt)
          echo "PERMISOS_ROLES_AUSENTES=${AUSENTES}" >> "$GITHUB_ENV"
          echo "PERMISOS_FICHERO=${PERM}" >> "$GITHUB_ENV"
          {
            echo ""
            echo "### 4b · permisos aplicados desde \`v2/permisos/$PERM\`"
            echo '```'
            cat permisos_resumen.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 5) EL VEREDICTO ───────────────────────────────────────────────────
      # Aqui es donde el simulacro deja de ser esperanzado.
      #
      # Version 1 de este paso miraba 6 recuentos contra unos minimos puestos a ojo:
      # con aquellos numeros, un staging al que le faltaban 29 objetos ENTEROS salia
      # VERDE. Version 2 comparaba contra produccion viva, y estaba mal por dos
      # motivos que se explican en la cabecera: daba falsos rojos (el backup es de
      # anoche y produccion no para) y, sobre todo, EL DIA DEL INCENDIO NO HAY
      # PRODUCCION CONTRA LA QUE COMPARAR.
      #
      # 🔑 La pregunta correcta no es "¿se parece la base a produccion?", es
      #   "¿tiene la base TODO lo que el backup decia traer?". Y esa se contesta
      #   DENTRO del propio fichero: el dump lleva su numero de control escrito.
      #   Por eso este paso NO necesita la credencial de produccion (la usa el 5b).
      #
      # 🔑 PARA QUE SE LEE ESTE PASO -- importa, porque no es lo que parece.
      #   El paso 4 corre con ON_ERROR_STOP=1 y --single-transaction: CUALQUIER
      #   sentencia que el dump traiga y falle revienta el restore entero y este paso
      #   ni siquiera llega a correr. O sea que el inventario NO sirve para pillar
      #   "el restore no aplico algo": eso ya esta cubierto, y con creces.
      #   Sirve para pillar otras dos cosas, y conviene saber cual es cual:
      #     · FALTA algo que el dump prometia  → EL BACKUP NO LO TRAJO. Es un fallo
      #       de la COPIA, no de la restauracion. Es el caso que da miedo.
      #     · SOBRA algo que el dump no traia  → EL VACIADO del paso 4 no lo borro.
      #       Ese si es un fallo de este workflow, y hay que arreglarlo aqui.
      #   El recuento de filas, con ON_ERROR_STOP=1, es tirantes ademas de cinturon:
      #   su valor real es que PONE EL NUMERO DELANTE. Un numero que se mira es lo
      #   unico que ha detectado algo en toda esta historia.
      - name: 5) VEREDICTO - la base desechable tiene TODO lo que el backup traia
        run: |
          # 🔴 LC_ALL=C NO ES DECORACION. `sort` ordena segun el idioma y `comm`/`join`
          #   comparan byte a byte: con un idioma que no sea C, en_US ignora el guion
          #   bajo al ordenar y los dos dejan de estar de acuerdo. Con nombres como
          #   `salud_fba` / `salud_fba_hist` eso significa diferencias INVENTADAS en el
          #   inventario -- justo el error que este paso existe para no cometer.
          # 🔒 pipefail: sin el, un `psql | sort > fichero` que falla en el psql sale 0
          #   (manda el `sort`), el fichero queda vacio y el veredicto se lo cree.
          export LC_ALL=C
          set -o pipefail

          case "$SIM_DB_URL" in
            postgresql://*@127.0.0.1:*|postgresql://*@localhost:*) ;;
            *) echo "::error::La base del veredicto no es la del runner. Me niego."; exit 1;;
          esac

          FALLO=0

          # ── A) LO QUE EL DUMP DICE TRAER: un solo lector, una sola pasada ─────
          # Se cuentan TABLAS, VISTAS, FUNCIONES, SECUENCIAS y POLITICAS RLS. Las
          # cinco clases las borra el vaciado del paso 4, asi que las cinco tienen
          # que volver.
          #
          # 🔴 LAS FUNCIONES Y LAS POLITICAS NO SON UN ADORNO:
          #   · Un restore que recuperase las 59 tablas y las 24 vistas pero se dejase
          #     `frescura_informes()` saldria VERDE mirando solo tablas y vistas -- y de
          #     esa funcion cuelga la pantalla de Buzones de Elena entera.
          #   · Una POLITICA perdida deja una tabla con permisos distintos a los de
          #     produccion. El dia del incendio eso es, literalmente, la casa abierta.
          #   Medido el 9-ago-2026: produccion 16 funciones y 59 politicas sobre 37
          #   tablas; staging 14 y 56.
          #
          # ⚠️ LAS SECUENCIAS ENTRAN, PERO ESTA NO ES LA COMPROBACION QUE IMPORTA, y
          #   que quede escrito para que nadie se confie: aqui solo se mira que EXISTAN.
          #   Una secuencia puede volver existiendo y con el contador a 1 sobre una
          #   tabla llena, y entonces la PRIMERA insercion del dia del incendio choca
          #   con clave duplicada. Por nombre, eso sale VERDE. El contraste que de
          #   verdad vale es de VALORES: los `setval` del dump contra
          #   `pg_sequences.last_value`. Es otro diseno y va en su propio PR.
          #   Medido el 9-ago-2026: las 23 secuencias de produccion tienen el contador
          #   avanzado (0 sin estrenar), asi que esto le aplica a las 23.
          #   Mas abajo se imprime cuantos `setval` trae el dump, para que el agujero
          #   se vea en cada ejecucion en vez de vivir solo en este comentario.
          #   ✅ Y el `setval` YA ESTA MEDIDO, que era la duda: el dump del 9-ago-2026
          #   trae 23 sentencias `setval`, una por secuencia. Lo que falta es
          #   COMPARARLAS, no averiguar si estan.
          #
          # 🔴 LAS SECUENCIAS SE CUENTAN POR DOS SITIOS, Y OMITIR EL SEGUNDO DABA UN
          #   ROJO FALSO (medido en el run 31300759981: el veredicto decia 10 en el
          #   dump contra 23 en staging, y encima acusaba al vaciado de no haber
          #   borrado 13 que si habia borrado).
          #   El motivo: `pg_dump` solo escribe `CREATE SEQUENCE` para las secuencias
          #   SUELTAS o de columna `serial`. Las de una columna `IDENTITY` no llevan
          #   sentencia propia: se declaran DENTRO del `ALTER TABLE … ADD GENERATED …
          #   AS IDENTITY ( SEQUENCE NAME public.x_id_seq … )`, o sea que nacen y
          #   mueren con su tabla. Medido en produccion el 9-ago-2026: 10 sueltas y
          #   13 de identidad, que son las 23. Por eso se lee tambien la linea
          #   `SEQUENCE NAME`.
          #
          # 🔴 POR QUE UN SOLO LECTOR Y NO VARIOS `grep` SUELTOS: dentro de un bloque
          #   COPY las lineas son DATOS. Una columna de texto que empezara por
          #   "CREATE TABLE ..." o por "COPY ... FROM stdin;" enganaria a un grep, y el
          #   veredicto se inventaria un objeto que no existe. Un rojo falso es
          #   exactamente como se mata una guarda. Aqui, mientras estamos DENTRO de un
          #   bloque de datos, lo unico que se obedece es el terminador.
          #   🔒 PROBADO el 9-ago-2026 contra un dump de mentira hecho a proposito con
          #   esas lineas trampa DENTRO de los datos: el lector no se las tragó.
          # 🔒 EL TERMINADOR SE CONSTRUYE CON sprintf("%c.", 92) -- el caracter 92 es la
          #   contrabarra -- para no escribir NI UNA contrabarra en el codigo. Escrito
          #   como cadena con escapes dependia de cuantas capas de comillas atravesara
          #   el programa: medido, en una de ellas awk lo leia como un simple punto, no
          #   casaba nunca con el terminador y EL RECUENTO DE FILAS NO SE HACIA. Salia
          #   verde sin contar nada. Por lo mismo, la comilla doble se construye con
          #   sprintf("%c", 34).
          # 🔴 EL NOMBRE DE UNA POLITICA PUEDE LLEVAR ESPACIOS. Medido el 9-ago-2026:
          #   15 de las 59 politicas de produccion tienen nombres que pg_dump
          #   ENTRECOMILLA (los que crea el panel de Supabase, del tipo
          #   "Enable read access for all users"). Partir por espacios se rompe justo
          #   ahi, asi que el nombre se corta por su comilla de cierre y la tabla es el
          #   token siguiente al ` ON `.
          # ⚠️ Limite conocido: una politica cuyo nombre contuviera una comilla doble
          #   escapada se leeria mal y saldria como diferencia. Hoy no hay ninguna.
          awk '
            BEGIN { FIN = sprintf("%c.", 92); COM = sprintf("%c", 34) }
            dentro { if ($0 == FIN) { print "FILA|" tabla "|" n; dentro = 0 } else { n++ }; next }
            /^COPY .* FROM stdin;$/      { tabla = $2; n = 0; dentro = 1; next }
            /^CREATE TABLE /             { print "OBJ|tabla  " $3; next }
            /^CREATE VIEW /              { print "OBJ|vista  " $3; next }
            /^CREATE MATERIALIZED VIEW / { print "OBJ|vista  " $4; next }
            /^CREATE SEQUENCE /          { print "OBJ|secuencia  " $3; next }
            /^[ \t]*SEQUENCE NAME /      { print "OBJ|secuencia  " $3; next }
            /^SELECT pg_catalog.setval/  { nsetval++; next }
            /^CREATE (FUNCTION|PROCEDURE) / {
              s = $0
              sub(/^CREATE (FUNCTION|PROCEDURE) /, "", s)
              sub(/[(].*$/, "", s)
              print "OBJ|funcion  " s
              nrut++
              next
            }
            /^CREATE POLICY / {
              s = $0
              sub(/^CREATE POLICY /, "", s)
              if (substr(s, 1, 1) == COM) {
                j = index(substr(s, 2), COM) + 1
                nombre = substr(s, 1, j)
                resto  = substr(s, j + 1)
              } else {
                j = index(s, " ")
                nombre = substr(s, 1, j - 1)
                resto  = substr(s, j)
              }
              sub(/^ ON /, "", resto)
              sub(/ .*$/, "", resto)
              sub(/;$/, "", resto)
              print "OBJ|politica  " resto ":" nombre
              next
            }
            END { print "NRUT|" nrut + 0; print "NSETVAL|" nsetval + 0 }
          ' backup.sql > dump_crudo.txt

          grep '^OBJ|'  dump_crudo.txt | cut -d'|' -f2- | sort -u > dump_objetos.txt
          grep '^FILA|' dump_crudo.txt | cut -d'|' -f2- | sort    > dump_filas.txt
          NRUT_DUMP=$(grep '^NRUT|'    dump_crudo.txt | cut -d'|' -f2)
          NSETVAL=$(grep '^NSETVAL|'   dump_crudo.txt | cut -d'|' -f2)

          # 🔒 Este lector parte por espacios los nombres de tabla, vista, funcion y
          #   secuencia. Hoy ninguno de los 83 objetos de produccion necesita comillas
          #   (medido el 9-ago-2026), pero si algun dia nace uno con espacios o
          #   mayusculas, pg_dump lo entrecomillaria y el corte saldria mal. Antes que
          #   inventar una diferencia, se para y se dice.
          #   Las POLITICAS quedan fuera de esta guarda a proposito: ahi las comillas
          #   son normales y el lector ya sabe tratarlas.
          if grep -v '^politica  ' dump_objetos.txt | grep -q '"'; then
            echo "::error::Hay nombres entrecomillados que este lector no sabe partir."
            echo "::error::Para y arreglalo antes de fiarte de este veredicto:"
            grep -v '^politica  ' dump_objetos.txt | grep '"' | sed 's/^/  /'
            exit 1
          fi

          # 🔒 Si esto sale vacio, el fichero no es lo que dice ser (o pg_dump ha
          #    cambiado de formato). Callarse aqui seria dar por buena una copia que
          #    no hemos sabido leer.
          if [ ! -s dump_objetos.txt ]; then
            echo "::error::No he encontrado NI UN 'CREATE TABLE/VIEW/FUNCTION' en el dump."
            echo "::error::O el backup no es lo que dice ser, o el formato de pg_dump ha cambiado."
            exit 1
          fi

          # ── LO QUE HA QUEDADO EN LA BASE DESECHABLE ──────────────────────────────────────
          # 🔒 format('%I') reproduce la MISMA regla de comillas que usa pg_dump
          #    (entrecomilla solo cuando hace falta). Con `nspname || '.' || relname`
          #    a pelo, un nombre que necesitara comillas saldria distinto en cada lado
          #    y el veredicto inventaria una diferencia. Es justo lo que pasaria con
          #    las 15 politicas de nombre entrecomillado.
          # 🔒 Se excluyen los objetos de una EXTENSION, exactamente igual que hace el
          #    vaciado del paso 4: ni el vaciado los borra ni el dump los trae, asi que
          #    contarlos aqui seria un "sobran" que no es culpa de nadie.
          psql "$SIM_DB_URL" -At -c "
            select 'tabla  ' || format('%I.%I', n.nspname, c.relname)
              from pg_class c join pg_namespace n on n.oid = c.relnamespace
             where n.nspname = 'public' and c.relkind in ('r','p')
               and not exists (select 1 from pg_depend d where d.objid = c.oid and d.deptype = 'e')
            union all
            select 'vista  ' || format('%I.%I', n.nspname, c.relname)
              from pg_class c join pg_namespace n on n.oid = c.relnamespace
             where n.nspname = 'public' and c.relkind in ('v','m')
               and not exists (select 1 from pg_depend d where d.objid = c.oid and d.deptype = 'e')
            union all
            select 'secuencia  ' || format('%I.%I', n.nspname, c.relname)
              from pg_class c join pg_namespace n on n.oid = c.relnamespace
             where n.nspname = 'public' and c.relkind = 'S'
               and not exists (select 1 from pg_depend d where d.objid = c.oid and d.deptype = 'e')
            union all
            select 'funcion  ' || format('%I.%I', n.nspname, p.proname)
              from pg_proc p join pg_namespace n on n.oid = p.pronamespace
             where n.nspname = 'public'
               and not exists (select 1 from pg_depend d where d.objid = p.oid and d.deptype = 'e')
            union all
            select 'politica  ' || format('%I.%I', schemaname, tablename) || ':' || format('%I', policyname)
              from pg_policies where schemaname = 'public'" \
            | sort -u > stg_objetos.txt

          NRUT_STG=$(psql "$SIM_DB_URL" -At -c "
            select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
             where n.nspname = 'public'
               and not exists (select 1 from pg_depend d where d.objid = p.oid and d.deptype = 'e')")

          # 🔴 ESTO SE DICE SIEMPRE, TAMBIEN EN VERDE, Y NO ES UN ADORNO.
          #   Las politicas de fuera de `public` NO vienen del volcado (`pg_dump
          #   --schema=public`). En una base que nace vacia solo pueden venir de un
          #   sitio: el fichero de permisos del paso 4b. Con permisos=no son cero, y
          #   eso es exactamente lo que tendrian los buzones el dia del incendio si
          #   solo se restaurara el volcado.
          NPOL_FUERA=$(psql "$SIM_DB_URL" -At -c "
            select count(*) from pg_policies where schemaname <> 'public'")

          cuantos() { awk -v t="$2" '$1==t' "$1" | wc -l; }
          DT=$(cuantos dump_objetos.txt tabla);     DV=$(cuantos dump_objetos.txt vista)
          DF=$(cuantos dump_objetos.txt funcion);   DS=$(cuantos dump_objetos.txt secuencia)
          DP=$(cuantos dump_objetos.txt politica);  DTOT=$((DT+DV+DF+DS+DP))
          ST=$(cuantos stg_objetos.txt tabla);      SV=$(cuantos stg_objetos.txt vista)
          SF=$(cuantos stg_objetos.txt funcion);    SS=$(cuantos stg_objetos.txt secuencia)
          SP=$(cuantos stg_objetos.txt politica);   STOT=$((ST+SV+SF+SS+SP))

          echo ""
          echo "===================== OBJETOS EN public ====================="
          printf "  %-12s %14s %14s\n" ""           "trae el backup" "hay en la base"
          printf "  %-12s %14s %14s\n" "tablas"     "$DT" "$ST"
          printf "  %-12s %14s %14s\n" "vistas"     "$DV" "$SV"
          printf "  %-12s %14s %14s\n" "funciones"  "$DF" "$SF"
          printf "  %-12s %14s %14s\n" "secuencias" "$DS" "$SS"
          printf "  %-12s %14s %14s\n" "politicas"  "$DP" "$SP"
          printf "  %-12s %14s %14s\n" "TOTAL"      "$DTOT" "$STOT"
          echo "============================================================"
          echo ""
          echo "El dump trae $NSETVAL sentencia(s) setval. NINGUNA se comprueba todavia:"
          echo "una secuencia puede volver EXISTIENDO y con el contador mal, y eso aqui"
          echo "sale verde. Es un agujero conocido y abierto (ver el comentario del paso)."
          echo ""
          echo "$NPOL_FUERA politica(s) RLS de fuera de public (storage) en la base. El volcado"
          echo "no las trae (--schema=public): si hay alguna, viene del fichero de permisos (4b)."

          # ── LA HUELLA DE LOS ACL: la medida exacta del frente abierto ─────────
          # 🔴 EL RESTORE REABRE PERMISOS, Y HAY QUE VERLO EN CADA EJECUCION.
          #   El dump va con `--no-privileges`: NO trae ni un GRANT ni un REVOKE. Asi
          #   que toda relacion restaurada nace con el `pg_default_acl` de Supabase, o
          #   sea con `anon` dentro. Medido el 9-ago-2026 tras el primer restore bueno:
          #     produccion : 83 relaciones, 73 con permiso para anon
          #     staging    : 83 relaciones, 81 con permiso para anon
          #   Ocho que en produccion estan CERRADAS vuelven ABIERTAS: demanda_asin,
          #   escaner_detalle, factura_lineas_no_inventario, parametro_coste,
          #   sondeo_keepa, v_factura_cuadre, v_producto_amazon y v_velocidad_ventas.
          #
          # 🔑 Y EL DATO QUE CONVIERTE ESTO EN UNA REGLA: de las DIEZ cerradas en
          #   produccion, las dos unicas que se recuperan son `v_demanda_asin_ultima` y
          #   `v_trackeador_cola` -- justo las dos que tienen su REVOKE y su GRANT
          #   escritos dentro de una migracion de `migraciones/`.
          #     LO QUE ESTA EN EL REPO SE PUEDE RECONSTRUIR. LO CERRADO A MANO, NO.
          #
          # ⚠️ Y OJO AL MATIZ, MEDIDO EN EL RUN 31318814366: esas dos NO "sobreviven" al
          #   restore. JUSTO DESPUES DE RESTAURAR, LAS 83 RELACIONES ESTAN ABIERTAS, las
          #   dos incluidas. Se vuelven a cerrar cuando se REAPLICA su migracion, y por
          #   eso el numero baja de 83 a 81 en cuanto la migracion del contador entra.
          #   O sea: el repo no CONSERVA el permiso a traves de una restauracion, permite
          #   REHACERLO. Y solo si alguien vuelve a pasar todas las migraciones. El dia
          #   del incendio, lo unico que estaria cerrado es lo que alguien se acuerde de
          #   volver a aplicar. Es un argumento mas para que el dump traiga los
          #   privilegios en vez de que haya que reconstruirlos.
          #   Por eso el PR pendiente de `backup-bd.yml` deja de ser "copiar las
          #   politicas de storage" y pasa a ser "copiar los PRIVILEGIOS", que ya
          #   sabemos exactamente cuales se pierden.
          #
          # ⚠️ NO HACE FALLAR EL JOB, y es deliberado mientras el frente este abierto:
          #   hoy esta diferencia es CIERTA en toda restauracion, asi que un rojo aqui
          #   saltaria siempre y en dos semanas nadie lo miraria -- el fallo de siempre.
          #   Se IMPRIME para que la diferencia tenga numero. El dia que el backup traiga
          #   los privilegios, esto pasa a ser una comprobacion mas y entonces si falla.
          # 🔒 LA FORMULA NO SE ESCRIBE AQUI: vive en `sql/huella_acl.sql` y la consumen
          #   los dos lados -- este workflow y quien la compruebe a mano. Una huella
          #   calculada con dos codigos no es una huella: basta otro separador, otro
          #   orden o otro texto para el `(sin acl)` para que dos md5 distintos no
          #   prueben nada aunque el estado sea el mismo. Y que hoy coincidan es una
          #   coincidencia, no una garantia. El porque completo, en la cabecera del
          #   fichero.
          # 🔒 Los tres numeros salen de LA MISMA consulta, asi que el denominador y el
          #   numerador de "cuantas con anon" son por construccion la misma poblacion.
          IFS='|' read -r HUELLA_ACL REL_TOTAL CON_ANON < <(psql "$SIM_DB_URL" -At -F'|' -f sql/huella_acl.sql)
          if [ -z "$HUELLA_ACL" ]; then
            echo "::error::No he podido calcular la huella de los ACL con sql/huella_acl.sql."
            echo "::error::Sin ella, este paso no puede decir cuanto reabre el restore. Para y mira."
            exit 1
          fi
          echo ""
          echo "======= PERMISOS: lo que el backup NO restaura ======="
          echo "  huella md5 de los ACL de public en la base : $HUELLA_ACL"
          # 🔴 EL DENOMINADOR SON LAS RELACIONES, NO LOS OBJETOS. Aqui puso `$STOT`
          #   (los 181 objetos de las CINCO clases) frente a un recuento que solo mira
          #   relaciones, y salio "83 de 181": se lee como menos de la mitad cuando la
          #   verdad es 83 de 83, o sea TODAS. Un denominador equivocado no es un
          #   detalle de formato: minimiza justo el hallazgo que esta linea existe para
          #   medir. Medido en el run 31318814366, que es donde se vio.
          #   Ahora el denominador lo da la propia consulta compartida, asi que no puede
          #   volver a desparejarse del numerador.
          echo "  relaciones (tablas+vistas)                 : $REL_TOTAL"
          echo "  … de ellas, con permiso para anon          : $CON_ANON"
          # 🔒 Aviso si la poblacion de la huella no cuadra con la del inventario. Hoy
          #   coinciden (0 objetos de extension en public, medido); si algun dia una
          #   extension planta una tabla ahi, las dos cifras se separan y conviene
          #   saberlo en vez de que una de las dos mienta en silencio.
          if [ "$REL_TOTAL" != "$((ST+SV))" ]; then
            echo "  ⚠️  ojo: el inventario ve $((ST+SV)) relaciones y la huella $REL_TOTAL."
            echo "      La huella NO excluye objetos de extension y el inventario si."
          fi
          echo "====================================================="
          echo "El volcado va con --no-privileges: NO trae permisos. Los devuelve el fichero"
          echo "de permisos (4b), y el que juzga si son los de produccion es el paso 5b."

          comm -23 dump_objetos.txt stg_objetos.txt > faltan.txt
          comm -13 dump_objetos.txt stg_objetos.txt > sobran.txt

          if [ -s faltan.txt ]; then
            FALLO=1
            echo "::error::EL BACKUP NO LO TRAJO: $(wc -l < faltan.txt) objeto(s) que el fichero"
            echo "::error::prometia y que no estan en la base:"
            sed 's/^/  /' faltan.txt
            echo "  (ojo: el paso 4 corre con ON_ERROR_STOP=1, asi que si el dump lo hubiera"
            echo "   traido y hubiera fallado, el restore entero habria reventado. Que llegue"
            echo "   hasta aqui significa que la COPIA venia incompleta.)"
          fi
          if [ -s sobran.txt ]; then
            FALLO=1
            echo "::error::SOBRA ALGO: $(wc -l < sobran.txt) objeto(s) en la base que"
            echo "::error::NO venian del backup:"
            sed 's/^/  /' sobran.txt
            echo "  (la base nace vacia -lo comprueba el paso 2b-, asi que esto lo ha creado la"
            echo "   restauracion o el proyecto nuevo de Supabase: se mira cual y se arregla aqui.)"
          fi

          # 🔒 La comparacion de arriba es POR NOMBRE, y dos funciones sobrecargadas
          #   comparten nombre: si el dump trae `f(int)` y `f(text)` y la restauracion
          #   solo deja una, los NOMBRES cuadran y el fallo pasaria inadvertido. El
          #   recuento en bruto no se deja enganar. (Medido el 9-ago-2026: hoy no hay
          #   ninguna sobrecarga en produccion -- 16 rutinas, 16 nombres distintos --
          #   pero esto es para el dia que la haya.)
          if [ "$NRUT_DUMP" != "$NRUT_STG" ]; then
            FALLO=1
            echo "::error::El backup trae $NRUT_DUMP rutina(s) y en la base hay $NRUT_STG."
            echo "::error::Si los nombres cuadran pero el recuento no, hay una sobrecarga perdida."
          fi

          if [ "$FALLO" = "0" ]; then
            echo "Objetos: los $DTOT que trae el backup estan en la base, y ni uno de mas."
          fi

          # ── B) FILAS: cada bloque COPY del dump, contra su tabla ──────────────
          # 🔑 IGUALDAD EXACTA, no un umbral. El dump dice cuantas filas trae de cada
          #   tabla, y tras restaurar sobre un esquema VACIO la base no puede tener ni
          #   una mas ni una menos. Nada escribe en ella durante el job, y pg_dump
          #   crea los disparadores DESPUES de cargar los datos, asi que no hay nada
          #   que pueda anadir filas por su cuenta.
          # Y se comprueban TODAS las tablas del dump, no cinco elegidas a mano.
          # (La lista `dump_filas.txt` ya la saco el lector unico del apartado A.)
          if [ ! -s dump_filas.txt ]; then
            echo "::error::El dump no trae ni un bloque COPY. Una copia sin datos no es una copia."
            exit 1
          fi

          # Un solo viaje a la base: el runner esta en EEUU y Supabase en Irlanda
          # (~90 ms por ida y vuelta). 59 count(*) sueltos serian 59 viajes.
          awk -F'|' -v q="'" '{ if (NR > 1) printf " union all ";
                                printf "select %s%s%s, count(*) from %s", q, $1, q, $1 }' \
              dump_filas.txt > cuenta.sql
          psql "$SIM_DB_URL" -At -F'|' -f cuenta.sql | sort > stg_filas.txt
          join -t'|' dump_filas.txt stg_filas.txt > filas.txt

          # 🔴 SIN ESTA GUARDA EL VEREDICTO TIENE UN AGUJERO: si una tabla del dump no
          #   existe en la base, el `join` simplemente NO produce esa fila, el bucle no
          #   la recorre y nadie marca fallo. Un recuento que se salta lo que falta es
          #   justo la clase de comprobacion que nos ha traido hasta aqui.
          ND=$(wc -l < dump_filas.txt); NJ=$(wc -l < filas.txt)
          if [ "$ND" -ne "$NJ" ]; then
            FALLO=1
            echo "::error::El dump trae $ND tablas con datos pero solo he podido comparar $NJ."
            echo "::error::Alguna no existe en la base. Es el HALLAZGO, no un fallo del script."
            comm -23 <(cut -d'|' -f1 dump_filas.txt) <(cut -d'|' -f1 stg_filas.txt) | sed 's/^/  falta: /'
          fi

          echo ""
          echo "======== FILAS: lo que trae el backup vs lo que hay en la base ========"
          printf "%-44s %12s %12s  %s\n" "tabla" "en el backup" "en la base" "veredicto"
          TOTD=0; TOTS=0; DESCUADRES=0
          while IFS='|' read -r T D S; do
            if [ "$D" = "$S" ]; then
              VER="OK"
            else
              VER="*** NO CUADRA ***"; FALLO=1; DESCUADRES=$((DESCUADRES+1))
              echo "$T|$D|$S" >> descuadres.txt
            fi
            TOTD=$((TOTD+D)); TOTS=$((TOTS+S))
            printf "%-44s %12s %12s  %s\n" "$T" "$D" "$S" "$VER"
          done < filas.txt
          printf "%-44s %12s %12s\n" "TOTAL" "$TOTD" "$TOTS"
          echo "======================================================================="
          echo "$NJ tabla(s) comparada(s), $DESCUADRES descuadre(s)."

          # ── C) El veredicto, tambien al resumen del job ───────────────────────
          {
            echo "### Simulacro de restauracion: veredicto"
            echo ""
            echo "backup restaurado: \`${BACKUP_RUTA:-?}\`"
            echo ""
            echo "| | trae el backup | hay en la base |"
            echo "|---|---|---|"
            echo "| tablas | $DT | $ST |"
            echo "| vistas | $DV | $SV |"
            echo "| funciones | $DF | $SF |"
            echo "| secuencias | $DS | $SS |"
            echo "| politicas RLS | $DP | $SP |"
            echo "| **objetos** | **$DTOT** | **$STOT** |"
            echo "| filas (todas las tablas) | $TOTD | $TOTS |"
            echo ""
            echo "\`setval\` en el dump: $NSETVAL — **sin comprobar** (agujero conocido)."
            echo ""
            echo "> **$NPOL_FUERA políticas RLS de \`storage\`** en la base: el volcado no las trae; si hay, vienen del fichero de permisos (4b)."
            echo ""
            echo "> Huella md5 de los ACL de \`public\` en la base: \`$HUELLA_ACL\` — **$CON_ANON de $REL_TOTAL relaciones con permiso para \`anon\`**."
            echo "> El volcado no trae permisos (\`--no-privileges\`); los juzga el paso 5b contra producción."
            if [ -s faltan.txt ]; then
              echo ""
              echo "**El backup NO lo trajo:**"
              echo ""
              sed 's/^\([a-z]*\)  /- \1 `/; s/$/`/' faltan.txt
            fi
            if [ -s sobran.txt ]; then
              echo ""
              echo "**Sobra en la base (no venia en el backup):**"
              echo ""
              sed 's/^\([a-z]*\)  /- \1 `/; s/$/`/' sobran.txt
            fi
            if [ -s descuadres.txt ]; then
              echo ""
              echo "**Tablas cuyo numero de filas NO cuadra:**"
              echo ""
              echo "| tabla | en el backup | en la base |"
              echo "|---|---|---|"
              sed 's/^/| /; s/|/ | /g; s/$/ |/' descuadres.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FALLO" != "0" ]; then
            echo ""
            echo "::error::LA COPIA NO ESTA DEMOSTRADA: la base no tiene todo lo que el fichero traia."
            echo "Ojo al nombre: esto NO dice 'produccion ha cambiado desde la copia'. Eso seria"
            echo "DERIVA y es otra pregunta. Esto dice que la copia no reconstruye ni siquiera"
            echo "su propio contenido. Es el incendio."
            {
              echo ""
              echo "**resultado: LA COPIA NO ESTA DEMOSTRADA -- no reconstruye ni su propio contenido**"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo ""
          echo "VERIFICADO: el backup traia $DTOT objetos y $TOTD filas, y eso es exactamente"
          echo "lo que hay en la base. La copia reconstruye lo que contiene."
          echo ""
          echo "Lo que esto NO dice: si produccion ha cambiado desde que se hizo la copia."
          echo "Eso es DERIVA, es otra pregunta."
          {
            echo ""
            echo "**resultado: VERIFICADO -- el backup reconstruye lo que contiene ($DTOT objetos, $TOTD filas),"
            echo "en un Supabase nuevo y vacio, con $NPOL_FUERA politicas de storage (del fichero de permisos)**"
          } >> "$GITHUB_STEP_SUMMARY"

      # ════════════════════════════════════════════════════════════════════════
      # 🔴 5b) VEREDICTO - ¿PUEDE ALGUIEN ABRIR LA BASE QUE ACABA DE VOLVER?
      #
      # El paso 5 demuestra que están los DATOS. Este demuestra lo otro, que hasta hoy
      # no lo demostraba nadie: que quien tiene que poder leerlos, puede.
      #
      # 🔑 CÓMO SE JUZGA. Una línea por privilegio de `public` —relaciones, columnas,
      #   funciones y el esquema—, sacadas con el MISMO fichero (`sql/huella_acl_public.sql`)
      #   en los dos lados, ordenadas igual y comparadas. El md5 es el titular; las
      #   líneas son lo que se arregla.
      #
      # 🔒 PRODUCCIÓN SE LEE EN SOLO LECTURA FORZADA, igual que en el paso 10:
      #   `default_transaction_read_only=on` no es un acuerdo, es el servidor negándose.
      #
      # ⚠️ ROJO AQUÍ SIGNIFICA UNA DE DOS, Y HAY QUE SABER CUÁL:
      #     · el fichero de permisos no ha devuelto lo que decía  → es un fallo de la COPIA;
      #     · producción se ha movido DESDE que se hizo la copia  → no es un fallo, es
      #       deriva, y se ve en la línea «produccion se ha movido» de aquí abajo, que
      #       compara la huella de producción AHORA con la que el fichero anotó el día
      #       que se generó.
      #   Las dos salen rojas a propósito: un simulacro que no distingue no sirve, pero
      #   uno que se calla porque «seguro que es deriva» sirve menos.
      #
      # ⚠️ LOS ROLES QUE NO EXISTEN EN LA BASE SE SACAN DE LA COMPARACIÓN, y no es una
      #   manga ancha: el propio fichero los ha dicho por su nombre y los ha contado en
      #   el paso 4b. Con staging eran los propios (`moloka_cargadores`, `moloka_copias`,
      #   `moloka_detector_ro`: medido el 17-sep-2026). Desde el 30-sep-2026 el paso 4b
      #   CREA los propios antes de aplicar, así que aquí solo pueden quedar fuera roles
      #   de Supabase que el proyecto nuevo no traiga, y el resumen dice cuáles.
      # ════════════════════════════════════════════════════════════════════════
      - name: 5b) VEREDICTO - los permisos de la base son los de produccion
        if: ${{ github.event.inputs.permisos == 'si' }}
        env:
          PROD_DB_URL:    ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          if [ -z "${PROD_DB_URL:-}" ]; then
            echo "::error::Falta SUPABASE_DB_URL. Sin produccion no hay contra que comparar los permisos, y dar por bueno lo que no se ha mirado es justo lo que este paso evita."
            exit 1
          fi
          AUSENTES="${PERMISOS_ROLES_AUSENTES:-}"
          echo "Roles que no existen en la base y quedan fuera de la comparacion: ${AUSENTES:-(ninguno)}"

          # 🔴 LC_ALL=C: `sort` ordena segun el idioma y el `diff` compara byte a byte.
          #    Mismo motivo que en el paso 5.
          PGOPTIONS='-c default_transaction_read_only=on' \
            psql "$PROD_DB_URL" -X -q -At -v ON_ERROR_STOP=1 -v excluir="$AUSENTES" \
                 -f sql/huella_acl_public.sql | LC_ALL=C sort > acl_prod.txt
          psql "$SIM_DB_URL" -X -q -At -v ON_ERROR_STOP=1 -v excluir="$AUSENTES" \
                 -f sql/huella_acl_public.sql | LC_ALL=C sort > acl_stg.txt

          # 🔒 CERO ES ROJO. Una huella vacia no es «todo cuadra», es «no he podido mirar».
          if [ ! -s acl_prod.txt ] || [ ! -s acl_stg.txt ]; then
            echo "::error::Una de las dos huellas ha salido VACIA (produccion: $(wc -l < acl_prod.txt) lineas, base: $(wc -l < acl_stg.txt)). Esto no ha comprobado nada."
            exit 1
          fi
          MD5_PROD=$(md5sum < acl_prod.txt | cut -d' ' -f1)
          MD5_STG=$(md5sum  < acl_stg.txt  | cut -d' ' -f1)
          echo "produccion: $(wc -l < acl_prod.txt) privilegios · md5 $MD5_PROD"
          echo "base:       $(wc -l < acl_stg.txt) privilegios · md5 $MD5_STG"

          # ¿Se ha movido produccion desde que se hizo la copia? El fichero anoto su
          # huella de origen (sin excluir a nadie), asi que se compara con la de ahora.
          HUELLA_ORIGEN=$(sed -n 's/^-- huella_acl_origen: \([0-9a-f]*\).*/\1/p' "${PERMISOS_FICHERO}")
          PGOPTIONS='-c default_transaction_read_only=on' \
            psql "$PROD_DB_URL" -X -q -At -v ON_ERROR_STOP=1 -v excluir='' \
                 -f sql/huella_acl_public.sql | LC_ALL=C sort > acl_prod_entera.txt
          # 🔴 SIN EL SALTO DE LÍNEA FINAL, Y ESTO NO ES UNA FINURA: es la diferencia
          #    entre una línea que informa y una que MIENTE SIEMPRE. `huella_acl_origen`
          #    la calcula el exportador dentro de la base, con
          #    `md5(string_agg(linea, <salto> ORDER BY linea COLLATE "C"))` — una cadena
          #    que NO termina en salto. `md5sum < fichero` sí incluye el salto final que
          #    tiene todo fichero de texto, así que los dos md5 no coinciden NUNCA y
          #    esta línea decía «produccion se ha movido: SI» aunque no se hubiera
          #    movido ni una coma.
          #    🔬 Medido el 17-sep-2026 sobre el simulacro del encargo P (run
          #    35228086083): el fichero traía `2ed2ca6e90378fd8b45d1889f2beb907` y aquí
          #    salía `98c0980c19c1a8ee08ab3418fba7a5d3`. En producción, las MISMAS 3.990
          #    líneas dan 2ed2ca6e… sin salto final y 98c0980c… con él. No se había
          #    movido nada.
          #    `$(cat …)` quita los saltos finales, que es justo lo que hace falta para
          #    comparar con lo que calculó la base.
          if [ ! -s acl_prod_entera.txt ]; then
            echo "::error::La huella entera de produccion ha salido vacia. No se puede decir si se ha movido."
            exit 1
          fi
          MD5_PROD_HOY=$(printf '%s' "$(cat acl_prod_entera.txt)" | md5sum | cut -d' ' -f1)
          if [ -n "$HUELLA_ORIGEN" ] && [ "$HUELLA_ORIGEN" = "$MD5_PROD_HOY" ]; then
            MOVIDA="NO (la copia sigue siendo la foto de hoy)"
          elif [ -n "$HUELLA_ORIGEN" ]; then
            MOVIDA="SI (el fichero se genero con $HUELLA_ORIGEN y produccion esta hoy en $MD5_PROD_HOY)"
          else
            MOVIDA="no se sabe (el fichero no trae huella de origen)"
          fi
          echo "produccion se ha movido desde la copia: $MOVIDA"

          # Las politicas de storage, del resumen que dejo el propio fichero en el 4b.
          POL_FICHERO=$(sed -n 's/^storage_politicas_del_fichero|//p'  permisos_resumen.txt)
          POL_REEMP=$(sed -n  's/^storage_politicas_reemplazadas|//p'  permisos_resumen.txt)
          POL_NUEVAS=$(sed -n 's/^storage_politicas_nuevas|//p'        permisos_resumen.txt)
          POL_CONS=$(sed -n   's/^storage_politicas_conservadas|//p'   permisos_resumen.txt)
          POL_CONS_D=$(sed -n 's/^storage_politicas_conservadas_detalle|//p' permisos_resumen.txt)
          SALT_ROL=$(sed -n   's/^sentencias_saltadas_rol|//p'         permisos_resumen.txt)
          SALT_POT=$(sed -n   's/^sentencias_saltadas_potestad|//p'    permisos_resumen.txt)
          HECHAS=$(sed -n     's/^sentencias_ejecutadas|//p'           permisos_resumen.txt)
          RLS_NO=$(sed -n     's/^storage_rls_no_se_pudo|//p'          permisos_resumen.txt)

          # 🔒 CERO NO ES «CERO PROBLEMAS», ES «NO HE PODIDO LEERLO». Si el resumen del
          #    fichero no trae los recuentos, las comparaciones de abajo compararian
          #    cadenas vacias y el veredicto diria que todo bien sin haber mirado.
          for par in "sentencias_ejecutadas=$HECHAS" "storage_politicas_del_fichero=$POL_FICHERO"                      "storage_politicas_reemplazadas=$POL_REEMP" "storage_politicas_nuevas=$POL_NUEVAS"                      "storage_politicas_conservadas=$POL_CONS"; do
            if [ -z "${par#*=}" ]; then
              echo "::error::El resumen del fichero de permisos no trae '${par%%=*}'. Sin eso este veredicto no puede juzgar nada. Mira la salida del paso 4b."
              exit 1
            fi
          done

          {
            echo ""
            echo "### 5b · ¿los permisos de la base son los de produccion?"
            echo ""
            echo "| | produccion | base desechable |"
            echo "|---|---|---|"
            echo "| privilegios de \`public\` | $(wc -l < acl_prod.txt) | $(wc -l < acl_stg.txt) |"
            echo "| huella md5 | \`$MD5_PROD\` | \`$MD5_STG\` |"
            echo ""
            echo "- roles fuera de la comparacion (no existen en la base): ${AUSENTES:-ninguno}"
            echo "- sentencias del fichero: **$HECHAS** ejecutadas, $SALT_ROL saltadas por rol ausente, $SALT_POT por falta de potestad"
            echo "- politicas de storage: **$POL_REEMP reemplazadas + $POL_NUEVAS nuevas = las $POL_FICHERO del fichero**, y $POL_CONS conservadas de la base (${POL_CONS_D:-ninguna})"
            echo "- produccion se ha movido desde la copia: $MOVIDA"
          } >> "$GITHUB_STEP_SUMMARY"

          # 🔴 QUE LAS POLITICAS VENGAN DEL FICHERO, NO DE LA BASE. Es el punto del
          #    encargo: hasta hoy el veredicto decia «CONSERVADAS, NO restauradas del
          #    backup». Si reemplazadas + nuevas no suman las del fichero, alguna se ha
          #    dado por buena sin tocarla.
          if [ "$((POL_REEMP + POL_NUEVAS))" -ne "$POL_FICHERO" ]; then
            echo "::error::Las politicas de storage no cuadran: $POL_REEMP reemplazadas + $POL_NUEVAS nuevas no suman las $POL_FICHERO del fichero."
            exit 1
          fi
          if [ "${RLS_NO:-0}" -gt 0 ]; then
            echo "::error::En $RLS_NO tabla(s) de storage la RLS NO coincide con la de produccion y no se ha podido cambiar (hace falta ser su dueno, supabase_storage_admin). Mira los avisos del paso 4b."
            exit 1
          fi

          if [ "$MD5_STG" != "$MD5_PROD" ]; then
            echo "::error::Los permisos de la base NO son los de produccion. Lineas que difieren (< produccion, > base):"
            diff acl_prod.txt acl_stg.txt | head -40
            {
              echo ""
              echo "**resultado: ROJO -- el ACL de la base no es el de produccion**"
              echo '```'
              diff acl_prod.txt acl_stg.txt | head -40
              echo '```'
              echo ""
              echo "Dos lecturas, y la de arriba dice cual: si produccion NO se ha movido, el fichero de permisos no devuelve lo que dice. Si SI se ha movido, mira el diff: lo que sobre en produccion y no este en la base puede ser sencillamente lo que ha cambiado desde la copia."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "VERDE: los $(wc -l < acl_stg.txt) privilegios de la base son, uno a uno, los de produccion."
          {
            echo ""
            echo "**resultado: VERIFICADO -- tras restaurar, quien tiene que poder leer la base PUEDE:"
            echo "$(wc -l < acl_stg.txt) privilegios identicos a los de produccion, y las $POL_FICHERO politicas"
            echo "de storage restauradas DEL FICHERO (ninguna dada por buena por conservarse)**"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 6) Apagar la base desechable ──────────────────────────────────────
      # El runner se destruye igual al acabar; esto es para que el log diga que la
      # base murio aqui, pase lo que pase arriba.
      - name: 6) Apagar la base desechable
        if: always()
        run: |
          cd "$DESECHABLE_DIR" 2>/dev/null && supabase stop --no-backup || echo "(no habia base que apagar)"
