name: Moloka - Sincronizar Stock Web

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sync-stock-web]

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -U supabase

      - name: Sincronizar stock de la web con el inventario
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # 🔴 La otra mitad. Sin esta linea el script lee `productos` como `anon`,
          # que desde el 10-sep-2026 recibe CERO FILAS sin error: el inventario llega
          # vacio, todas las fichas calculan stock 0, y del destrozo solo salva el
          # freno del 40% -- avisando por la razon equivocada y en VERDE.
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: python moloka_sync_stock_web.py
