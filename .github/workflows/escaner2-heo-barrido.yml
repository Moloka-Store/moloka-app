# ============================================================
# Moloka - Escaner 2 · BARRIDO DE HEO (en sombra, encargo B, 24-sep-2026)
#
# Lo disparan los dos botones de la v2 (moloka-app-v2, Escaneo PRO · pestaña HEO), con el
# mismo mecanismo que el escaneo de factura (workflow_dispatch con GH_TOKEN). Vive aqui porque
# aqui estan las credenciales de HEO. El input `modo` dice cual de los tres:
#   marcas   · las marcas de reglas_director, como siempre (y el valor si no llega nada);
#   todas    · (B2) todas las marcas, solo lo disponible, SIN leer reglas_director;
#   elegidas · (B4) las marcas del selector de la v2 (input `marcas`, lista JSON) y, si se marca
#              la casilla (input `ofertas`), las ofertas de cualquier marca. SIN leer reglas_director.
#
# 🔴 LOS INPUTS VIAJAN POR `env:`, NUNCA DENTRO DE `run:`. Un `${{ inputs.marcas }}` escrito en el
#    `run:` se pega en el script de bash ANTES de ejecutarlo: una marca con comillas o `$(...)`
#    seria codigo. Por env llegan como texto, y el programa los valida (JSON, lista de textos,
#    topes, sin comillas ni saltos de linea) antes de abrir ningun cliente; si no valen, no corre.
#
# Baja el catalogo de HEO con descargar_heo.py (la misma funcion del director), aplica el
# filtro de director_heo_prep.py y las reglas de EAN/chase/caja del escaner viejo (leidas de
# sus ficheros, sin tocarlos), guarda la FOTO en escaner2_foto y deja la lista de EAN para el
# Visualizador de Keepa en el bucket cerrado `escaner2`.
#
# 🔒 NO TOCA EL ESCANER VIEJO: ni director-heo.yml, ni su buzon, ni escaner_memoria, ni la
#    puente de chase. Cero tokens de Keepa.
# >>> SIN RELOJ <<<  Solo cuando se pulsa el boton (o a mano desde Actions).
# ============================================================
name: Moloka - Escaner 2 · Barrido HEO

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'marcas (las de siempre), todas (todas las marcas) o elegidas (las del selector de la v2)'
        type: choice
        options: ['marcas', 'todas', 'elegidas']
        default: 'marcas'
        required: false
      marcas:
        description: 'Solo en el modo elegidas: la lista de marcas, en JSON (["Funko", "CID"])'
        type: string
        default: ''
        required: false
      ofertas:
        description: 'Solo en el modo elegidas: ademas, las ofertas de cualquier marca'
        type: boolean
        default: false
        required: false

# 🔒 Barrido y cruce de HEO, de uno en uno: el cruce lee la foto que el barrido deja.
concurrency:
  group: escaner2-heo
  cancel-in-progress: false

jobs:
  barrer:
    runs-on: ubuntu-24.04
    # La API de HEO son tres endpoints paginados de 500 en 500: minutos, no horas.
    timeout-minutes: 30
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        # Las versiones FIJADAS de requirements.txt (requests: API de HEO · supabase: base y
        # Storage). psycopg2 no hace falta: aqui no se habla con Postgres directamente.
        run: pip install supabase==2.31.0 requests==2.34.2

      - name: Barrer HEO y dejar la foto
        # El tope va en el PASO (25 min), no solo en el job (30): asi, si se agota, el paso
        # falla y el rescate de abajo tiene tiempo de correr.
        timeout-minutes: 25
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HEO_USER:             ${{ secrets.HEO_USER }}
          HEO_PASS:             ${{ secrets.HEO_PASS }}
          MODO_BARRIDO:         ${{ inputs.modo }}
          MARCAS_ELEGIDAS:      ${{ inputs.marcas }}
          OFERTAS_ELEGIDAS:     ${{ inputs.ofertas }}
        run: python -u escaner2_heo_barrido.py

      # 🔴 SI EL RUN MUERE A MEDIAS, LA FILA NO SE QUEDA COLGADA: sin esto, una pasada que se
      #    queda en su estado de trabajo bloquea la pantalla de la v2 para siempre.
      - name: Rescate · si el run ha fallado, la fila de este run queda 'fallida'
        if: failure() || cancelled()
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -u escaner2_rescate.py pasada
