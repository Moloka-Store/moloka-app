# ============================================================
# Moloka - Trackeador de precios (snapshots) en la nube
# Ubicacion: .github/workflows/tracker-app.yml
#
# Corre moloka_tracker_snapshot_nube.py: lee del buzon informes/tracker/ el
# informe de inventario FBA + el CSV del Keepa "Resumen del Vendedor" (los sube
# la app), cruza por ASIN con la tabla productos, calcula el margen con la
# formula validada del escaner y guarda una foto por producto en
# monitor_snapshots. No usa Keepa API -> no gasta tokens.
#
# >>> SIN RELOJ <<<  Solo cuando lo lanza el boton de la app.
# ============================================================
name: Moloka - Trackeador

on:
  workflow_dispatch:

jobs:
  trackear:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install supabase pandas

      - name: Ejecutar Trackeador
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # El trackeador escribía como `anon`: SUPABASE_KEY es la clave PUBLICABLE
          # (`sb_publishable_…`, rol anon — medido el 11-ago-2026). Con esta línea pasa a
          # escribir con la clave de servicio, que salta la RLS por `rolbypassrls`.
          # No hace falta tocar el código: moloka_tracker_snapshot_nube.py ya hace
          # `os.environ.get('SUPABASE_SERVICE_KEY') or os.environ['SUPABASE_KEY']`.
          # 🔑 Es el paso PREVIO y obligatorio para poder cerrar a `anon`
          # monitor_snapshots / monitor_recomendaciones / monitor_reglas (bloque D3).
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -u moloka_tracker_snapshot_nube.py
