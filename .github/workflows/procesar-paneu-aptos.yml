name: Moloka - Procesar PANEU_APTOS

# 5ª pieza de la Fase 0 de la v2 (EJE PAÍS, PR #1). A DEMANDA, sin reloj.
# Espejo de procesar-keepa-escaparate.yml. Por defecto: STAGING + ENSAYO.
# Escalera: staging ensayo → staging aplicar → verificación SQL →
#           producción ensayo → producción aplicar → verificación SQL.
on:
  workflow_dispatch:
    inputs:
      entorno:
        description: 'Base de datos destino'
        type: choice
        options: [staging, produccion]
        default: staging
      modo:
        description: 'ensayo = solo comprueba y dice qué escribiría; aplicar = vuelca las dos tablas'
        type: choice
        options: [ensayo, aplicar]
        default: ensayo

concurrency:
  group: procesar-paneu-aptos
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --quiet supabase psycopg2-binary

      # 🔒 La mesa de pruebas de «sin evaluar» contra «corrupto», ANTES del procesador —
      #    como en keepa y salud. En este repo nada corre en push ni en PR: un test que no
      #    se lanza aquí es decoración.
      # 🔒 CÓMO SE LEE UN TSV DE AMAZON, antes del procesador. La comilla es TEXTO y
      #    una que abra un campo sin cerrar FUSIONA FILAS en silencio. El test lleva los
      #    cuatro casos medidos y vigila también que el LEDGER siga fuera del cambio.
      #    En este repo nada corre en push ni en PR: un test que no se lanza aquí es
      #    decoración.
      - name: Mesa de pruebas del parseo TSV
        run: python -u test_tsv_quote_none.py

      - name: Mesa de pruebas de las fichas sin evaluar
        run: python -u test_paneu_pendiente.py

      - name: Ejecutar procesador
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ENTORNO: ${{ inputs.entorno }}
          MODO: ${{ inputs.modo }}
          DB_URL: ${{ inputs.entorno == 'produccion' && secrets.SUPABASE_DB_URL || secrets.STAGING_DB_URL }}
        run: python -u procesador_paneu_aptos.py
