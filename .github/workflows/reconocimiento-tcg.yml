name: Moloka - Reconocimiento TCG (solo lectura)

# Encargo T1 (12-oct-2026). Baja el catalogo de TCG por el mismo camino que el
# director (login + smcatalog) VECES veces, separadas CADA_MINUTOS, y lo sube como
# artefacto CIFRADO. Sin reloj: solo se lanza a mano. No toca Supabase.
#
# Por que cifrado: el repo es PUBLICO y cualquier cuenta de GitHub puede bajar sus
# artefactos; sin cifrar, publicariamos la lista de precios de mayorista de TCG.
# Se cifra con la llave PUBLICA de abajo (publicarla no es un riesgo); la privada
# no esta en el repo ni en Secrets: solo en el equipo de quien lanzo el reconocimiento.
#   Abrir:  openssl cms -decrypt -binary -inform DER -in tcg.tar.gz.p7 -inkey privada.pem -out tcg.tar.gz

on:
  workflow_dispatch:
    inputs:
      veces:
        description: 'Cuantas descargas en este run (1-6)'
        type: string
        default: '1'
      cada_minutos:
        description: 'Minutos entre descargas'
        type: string
        default: '60'

concurrency:
  group: reconocimiento-tcg
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install curl_cffi beautifulsoup4 openpyxl

      - name: Descargar el catalogo TCG (solo lectura)
        env:
          TCG_USER: ${{ secrets.TCG_USER }}
          TCG_PASS: ${{ secrets.TCG_PASS }}
          VECES: ${{ inputs.veces }}
          CADA_MINUTOS: ${{ inputs.cada_minutos }}
        run: python -u reconocimiento_tcg.py

      - name: Cifrar lo descargado
        if: always()
        run: |
          if [ -z "$(ls -A salida 2>/dev/null)" ]; then echo "Nada que cifrar"; exit 0; fi
          cat > publica.pem <<'PEM'
