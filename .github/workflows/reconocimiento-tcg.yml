          rm -rf salida tcg.tar.gz

      - name: Subir el artefacto cifrado
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reconocimiento-tcg-${{ github.run_id }}
          path: tcg.tar.gz.p7
          retention-days: 7
          if-no-files-found: ignore
