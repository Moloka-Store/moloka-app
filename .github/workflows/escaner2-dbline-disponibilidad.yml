# ============================================================
# Moloka - Escaner 2 · DISPONIBILIDAD DE DBLINE (encargo DB2-A, 09-oct-2026)
#
# Baja el catalogo general de DBLine con descargar_dbline.py (el mismo del director viejo, tal cual), lo lee con las
# reglas de escaner2_dbline.py y deja en la base lo que tiene DBLine ahora (disp_estado) y lo que ha cambiado
# (disp_cambio), con la MISMA funcion que HEO, OSMA y OcioStock (disp_aplicar_pasada). EN SOMBRA: sin fila en
# disp_fuente; el director viejo sigue como siempre. Sin Amazon.
#
# 🔴 TODAVIA NO SE PUEDE LANZAR: falta la migracion de la v2 que añade fin_oferta (disp_lectura y disp_estado),
#    huella_contenido (disp_pasada) y la fila DBLINE de disp_parametros. Sin ella, rojo y la pasada 'fallida'.
#
# 🔴 REPO PUBLICO: este registro lo ve cualquiera. El programa SOLO imprime estados y recuentos; la salida de
#    descargar_dbline.py (la respuesta del login, URLs) se TRAGA. Lo comprueba test_escaner2_dbline_disponibilidad.py.
#
# 🔒 SOLO TOCA disp_pasada, disp_lectura, la funcion disp_aplicar_pasada, y lee disp_parametros.
#
# >>> SIN RELOJ, A PROPOSITO <<<  Se lanza a mano desde Actions. El reloj (cron-job.org) se decide tras la primera
#     pasada de verdad.
# ============================================================
name: Moloka - Escaner 2 · Disponibilidad DBLine

on:
  workflow_dispatch:

# 🔒 GRUPO PROPIO: nunca dos pasadas de DBLine a la vez, sin cancelar la que corre.
concurrency:
  group: escaner2-dbline
  cancel-in-progress: false

jobs:
  leer:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      # 🔴 PRIMERO, LOS SECRETOS: sin ellos, rojo aqui y sin tocar la base (el rescate tampoco corre).
      - name: Comprobar los secretos
        id: secretos
        env:
          DBLINE_USER:          ${{ secrets.DBLINE_USER }}
          DBLINE_PASS:          ${{ secrets.DBLINE_PASS }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$DBLINE_USER" ] || [ -z "$DBLINE_PASS" ]; then
            echo "::error title=Faltan secretos::faltan DBLINE_USER/DBLINE_PASS en los secretos de moloka-app; no se abre ninguna pasada"
            exit 1
          fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error title=Faltan secretos::faltan SUPABASE_URL/SUPABASE_SERVICE_KEY; no se abre ninguna pasada"
            exit 1
          fi
          echo "secretos: presentes"

      - name: Descargar el repo
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        # curl_cffi: la descarga de DBLine (descargar_dbline.py) · openpyxl: el Excel · supabase: la base.
        run: pip install --quiet supabase==2.31.0 openpyxl==3.1.5 curl_cffi

      - name: Leer DBLine y aplicar la pasada
        # El tope va en el PASO (15 min), no solo en el job (20): si se agota, el rescate corre.
        timeout-minutes: 15
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DBLINE_USER:          ${{ secrets.DBLINE_USER }}
          DBLINE_PASS:          ${{ secrets.DBLINE_PASS }}
          PYTHONIOENCODING:     utf-8
        run: python -u escaner2_dbline_disponibilidad.py

      # 🔴 SI EL RUN MUERE A MEDIAS, LA PASADA NO SE QUEDA 'leyendo' PARA SIEMPRE. Solo si los secretos estaban.
      - name: Rescate · si el run ha fallado, la pasada de este run queda 'fallida'
        if: (failure() || cancelled()) && steps.secretos.outcome == 'success'
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONIOENCODING:     utf-8
        run: python -u escaner2_dbline_disponibilidad.py --rescate
