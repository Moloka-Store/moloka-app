# ============================================================
# Moloka - Escaner 2 · CRUCE DEL ESCANEO PRO DE OSMA con los CSV del Visualizador (encargo AG, 02-oct-2026)
#
# Lo dispara la v2 (Escaneo PRO · pestaña OSMA) cuando el buzon de Keepa tiene su CSV: desde el encargo AG2
# (02-oct-2026), uno, el de España. Decide cada articulo con las reglas de compra del PRO de HEO (el corte de
# ventas, los paises de escaner2_parametros, la ficha compartida y la formula de rentabilidad del viejo, sin tocar),
# con el cruce por codigo de OSMA y el coste de nuestros packs; cuadra contra la base y deja el Excel, que la
# biblioteca de escaneos enseña como OSMA.
#
# 🔴 REPO PUBLICO: el programa SOLO imprime estados, recuentos y el nombre de los CSV subidos.
# 🔒 CERO tokens de Keepa y cero llamadas a Amazon: todo sale de los CSV.
# ============================================================
name: Moloka - Escaner 2 · Cruce OSMA

on:
  workflow_dispatch:
    inputs:
      pasada:
        description: 'id de la pasada de OSMA (escaner2_pasada.id) que se cruza con los CSV subidos'
        type: string
        required: true

concurrency:
  group: escaner2-osma-pro
  cancel-in-progress: false

jobs:
  cruzar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        # Las mismas versiones FIJADAS que el cruce de HEO.
        run: pip install supabase==2.31.0 openpyxl==3.1.5 pandas==3.0.0 numpy==2.4.6 psycopg2-binary==2.9.13

      - name: Cruzar los CSV con la foto
        timeout-minutes: 25
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PASADA:               ${{ inputs.pasada }}
        run: python -u escaner2_osma_cruce.py

      # (Encargo AN, 03-oct-2026) EL ULTIMO PASO, DETRAS DEL CRUCE Y SIN TOCAR NADA DE LO QUE PRODUCE NI SU EXCEL: apunta
      # en osma_packs_cola las familias que el cartero de la v2 buscara en Amazon (los packs que no vendemos). Solo si el
      # cruce ha salido bien; si este paso falla, el run sale rojo y el cruce se queda «lista» (el rescate solo toca lo que
      # sigue «cruzando»).
      - name: Apuntar la cola de packs de Amazon
        if: success()
        timeout-minutes: 5
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PASADA:               ${{ inputs.pasada }}
        run: python -u escaner2_osma_packs.py encolar

      - name: Rescate · si el run ha fallado, la fila de este run queda 'fallida'
        if: failure() || cancelled()
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -u escaner2_rescate.py cruce
