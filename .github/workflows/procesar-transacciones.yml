name: Moloka - Procesar TRANSACCIONES

# Procesador propio de Fase 0 para el Custom Transaction Report (el único informe
# que trae los EUROS: comisión y logística reales). A DEMANDA, sin reloj. Espejo
# de procesar-ledger.yml + input PAIS (el país lo manda el selector, nunca el
# fichero). Carga POR RANGO de fechas Y PAÍS: reemplaza [fecha_min, fecha_max] del
# país elegido y deja intacto lo anterior y los otros países. PELÍCULA, no foto.
# Escalera: staging ensayo → staging aplicar → verificación SQL → producción
#           ensayo → producción aplicar → SQL.
on:
  workflow_dispatch:
    inputs:
      entorno:
        description: 'Base de datos destino'
        type: choice
        options: [staging, produccion]
        default: staging
      modo:
        description: 'ensayo = solo comprueba y dice qué escribiría; aplicar = recierra el rango en transacciones_movimientos'
        type: choice
        options: [ensayo, aplicar]
        default: ensayo
      pais:
        description: 'País del fichero (LO MANDA EL SELECTOR, no se deduce del fichero). Sube a informes/transacciones/ el CSV de ESE país.'
        type: choice
        options: [ES, IT, FR]
        default: ES

concurrency:
  group: procesar-transacciones
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --quiet supabase psycopg2-binary

      - name: Ejecutar procesador
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ENTORNO: ${{ inputs.entorno }}
          MODO: ${{ inputs.modo }}
          PAIS: ${{ inputs.pais }}
          DB_URL: ${{ inputs.entorno == 'produccion' && secrets.SUPABASE_DB_URL || secrets.STAGING_DB_URL }}
        run: python -u procesador_transacciones.py
