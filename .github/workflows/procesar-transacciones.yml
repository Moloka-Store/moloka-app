name: Moloka - Procesar TRANSACCIONES

# Procesador propio de Fase 0 para el Custom Transaction Report (el único informe
# que trae los EUROS: comisión y logística reales). A DEMANDA, sin reloj. Espejo
# de procesar-ledger.yml + input PAIS (el país lo manda el selector, nunca el
# fichero). Carga POR RANGO de fechas Y PAÍS: reemplaza [fecha_min, fecha_max] del
# país elegido y deja intacto lo anterior y los otros países. PELÍCULA, no foto.
# Escalera: staging ensayo → staging aplicar → verificación SQL → producción
#           ensayo → producción aplicar → SQL.
on:
  workflow_dispatch:
    inputs:
      entorno:
        description: 'Base de datos destino'
        type: choice
        options: [staging, produccion]
        default: staging
      modo:
        description: 'ensayo = solo comprueba y dice qué escribiría; aplicar = recierra el rango en transacciones_movimientos'
        type: choice
        options: [ensayo, aplicar]
        default: ensayo
      pais:
        description: 'País del fichero (LO MANDA EL SELECTOR, no se deduce del fichero). Sube a informes/transacciones/ el CSV de ESE país. DE ya está medido (26-ago): entra como ES/IT/FR.'
        type: choice
        # 🔒 Entrecomilladas por el «problema de Noruega»: en YAML un `NO` suelto es el
        #    BOOLEANO false, no la cadena «NO». Aquí ninguna de las cuatro lo dispara, pero
        #    la regla de la casa es que las opciones de texto van con comillas — y la lista
        #    de países es justo la que va a seguir creciendo.
        options: ['ES', 'IT', 'FR', 'DE']
        default: ES
      fichero:
        # Igual que procesar-salud-fba.yml y procesar-keepa-escaparate.yml: procesa
        # UN informe concreto del buzón en vez del más reciente. Aquí es lo NORMAL,
        # no la excepción: con ES/IT/FR en la misma carpeta, "el más reciente" es una
        # lotería. El catálogo de la v2 pasa el nombre exacto (inputFichero: 'fichero')
        # y puede encolar los tres seguidos. Vacío = el más reciente. Si el nombre no
        # está en el buzón, ABORTA (no cae al más reciente).
        description: 'Nombre EXACTO del .csv a procesar. Vacío = el más reciente.'
        type: string
        required: false
        default: ''

concurrency:
  group: procesar-transacciones
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ubuntu-24.04
    # 🔴 TOPE CONTRA CUELGUES (encargo AJ, 24-sep-2026). Sin él, GitHub espera 6 h. El
    #    24-sep el ledger se quedó 71 min colgado esperando la respuesta del refresco
    #    del Trackeador: la base se reinició a mitad (06:35:16) y nadie se lo dijo (run 35956134193).
    #    15 min, medido con los runs de los nueve procesar-*.yml (622 runs): el éxito más
    #    largo de todos fue paneu-aptos, 587 s, el 29-jul; desde el 29-jul ninguno pasa
    #    de 137 s. Un corte por tope sale `cancelled` y el paso del registro lo apunta
    #    así (probado con tope de 1 min en staging, run 35843826193).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --quiet supabase psycopg2-binary

      # 🔒 La mesa de pruebas del país, ANTES del procesador — igual que hace
      #    procesar-keepa-escaparate.yml con la suya, y por el mismo motivo: en este repo
      #    NADA corre en push ni en PR, así que un test que no se lanza aquí es decoración.
      #    Tarda menos de un segundo, no toca red ni base, y sólo ejercita las guardas.
      - name: Mesa de pruebas del país y su mapa de columnas
        run: python -u test_transacciones_pais.py

      # 🔴 EL GANCHO DEL REFRESCO. `refrescar_vistas()` corre DESPUES del commit y
      #    NO aborta: si falla, la carga ya esta escrita y lo unico que queda es el
      #    grito. O sea que un fallo suyo no tumba este workflow y se descubriria
      #    dias despues, con la pantalla enseñando ventas viejas. Esta mesa prueba
      #    que GRITA, que grita lo que hace falta para arreglarlo, y --la mitad que
      #    se olvida-- que NO avisa a la app cuando el refresco fue mal.
      - name: Mesa de pruebas del refresco de materializadas
        run: python -u test_refrescar_vistas.py

      - name: Ejecutar procesador
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ENTORNO: ${{ inputs.entorno }}
          MODO: ${{ inputs.modo }}
          PAIS: ${{ inputs.pais }}
          FICHERO: ${{ inputs.fichero }}
          DB_URL: ${{ inputs.entorno == 'produccion' && secrets.SUPABASE_DB_URL || secrets.STAGING_DB_URL }}
        run: python -u procesador_transacciones.py

      # ═══ LA LÍNEA DEL REGISTRO (encargo H, 23-sep-2026) · SIEMPRE EL ÚLTIMO PASO DEL JOB ═══
      # 🔴 POR QUÉ: hasta hoy este procesador no dejaba en la base ninguna fila de «esto falló»: un
      #    rollback no deja rastro (parte E, 23-sep, tabla a-bis). Este paso apunta en
      #    `registro_ejecuciones` una línea con el color REAL del job (`job.status`) y el modo. La
      #    lee la revisión mensual con el conector de solo lectura.
      # 🔑 VA A LA MISMA BASE QUE LA CARGA: la misma expresión de `DB_URL` que el paso del procesador.
      #    Un ensayo en staging se apunta en staging, y uno en producción en producción, con su modo:
      #    un ensayo verde NO es una carga.
      # 🔒 UN FALLO AL APUNTAR NUNCA CAMBIA EL COLOR DEL JOB NI LO RETRASA: `continue-on-error`, un
      #    minuto de tope y 45 s para psql. Sin credenciales nuevas: la cadena de siempre, que entra
      #    como `postgres`, el dueño de `registrar_ejecucion`.
      - name: Apuntar la ejecución en el registro
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          DB_URL: ${{ inputs.entorno == 'produccion' && secrets.SUPABASE_DB_URL || secrets.STAGING_DB_URL }}
          R_RESULTADO: ${{ job.status }}
          R_MODO: ${{ inputs.modo }}
        run: |
          set -uo pipefail
          if [ -z "${DB_URL:-}" ]; then
            echo "::warning title=Registro sin apuntar::Este run no tiene cadena de la base; la línea no se escribe y el job conserva su color."
            exit 0
          fi
          wf="${GITHUB_WORKFLOW_REF%%@*}"; wf="${wf##*/}"
          empezado=""
          arranque="$(ps -o lstart= -C Runner.Worker 2>/dev/null | head -n1 || true)"
          [ -n "$arranque" ] && empezado="$(date -u -d "$arranque" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || true)"
          guardas=""
          filas=""
          if timeout 45 psql "$DB_URL" -X -q -At -v ON_ERROR_STOP=1 \
               -v repo="$GITHUB_REPOSITORY" -v workflow="$wf" -v job="$GITHUB_JOB" \
               -v run_id="$GITHUB_RUN_ID" -v run_attempt="$GITHUB_RUN_ATTEMPT" -v evento="$GITHUB_EVENT_NAME" \
               -v resultado="$R_RESULTADO" -v modo="${R_MODO:-}" -v filas="$filas" -v guardas="$guardas" \
               -v empezado="$empezado" <<'SQL'
          set statement_timeout = '15s';
          select public.registrar_ejecucion(
            p_repo => :'repo', p_workflow => :'workflow', p_job => :'job',
            p_run_id => :'run_id'::bigint, p_run_attempt => :'run_attempt'::integer,
            p_evento => :'evento', p_resultado => :'resultado', p_modo => nullif(:'modo', ''),
            p_filas => nullif(:'filas', '')::jsonb, p_guardas_saltadas => nullif(:'guardas', '')::jsonb,
            p_empezado_en => nullif(:'empezado', '')::timestamptz);
          SQL
          then
            echo "Apuntado en registro_ejecuciones: ${wf} · ${GITHUB_JOB} · ${R_RESULTADO} · modo ${R_MODO:-—}${guardas:+ · guardas saltadas: $guardas}"
          else
            rc=$?
            echo "::warning title=Registro sin apuntar::No se pudo escribir la línea en registro_ejecuciones (salida ${rc}). El job conserva su color."
            exit "$rc"
          fi
