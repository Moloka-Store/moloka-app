name: Moloka - Comprimir CSV antiguos de Keepa

# ============================================================================
# 🔴 DESDE EL 11-SEP-2026 EL DISPARO AUTOMATICO BORRA DE VERDAD, y solo lo hace
#    si la guarda del paso 4 salio VERDE. Antes no borraba nunca -- ni queriendo:
#    la expresion del MODO caia a 'ensayo' siempre, y las 21 corridas
#    automaticas fueron simulacros. El motivo entero, con el run medido, esta en
#    el `env:` del paso 5. Lo de abajo sigue valiendo palabra por palabra, y
#    ahora mas: es la red de la que cuelga ese borrado.
#
# ============================================================================
# 🔴 POR QUE CUELGA DEL BACKUP Y NO DE UN CRON PROPIO
#   Este workflow BORRA originales. La unica red que hay debajo es la copia en
#   Cloudflare R2 que deja `backup-bd.yml` (paso 6), y esa copia se hace
#   `aws s3 sync` SIN `--delete` a proposito -- o sea que lo que ya subio a R2
#   sobrevive aunque se borre en Supabase.
#
#   Encadenarlo por `workflow_run` a que el backup TERMINE EN VERDE convierte
#   esa red en una precondicion en vez de en una suposicion: no se comprime
#   nada que no acabe de copiarse a R2 esta misma noche. Un cron independiente
#   podria correr la noche que el backup fallo, que es justo la noche en la que
#   no hay que borrar nada.
#
# 🔒 Y POR ESO NO VA DENTRO DE backup-bd.yml. Si esto se cayera, no puede
#    arrastrar al backup: la copia es mas importante que el espacio. Workflows
#    separados, uno depende del otro, y el que manda es el backup.
#
# 🔒 TAMPOCO VA PEGADO A procesar-keepa-escaparate.yml, que era la otra opcion
#    obvia. Ese corre cuando Fernando sube un export -- justo cuando hay un
#    fichero recien llegado y el buzon esta en su momento mas delicado. La
#    ventana de DIAS ya lo protege, pero no hay ninguna razon para acercar un
#    borrado al momento de la carga.
#
# LA VENTANA. DIAS=2: el procesador coge "el mas reciente" y filtra por
# `.endswith('.csv')`, asi que un `.csv.gz` desaparece de su listado. Dos dias
# es margen de sobra para que la pasada nunca alcance a un fichero en juego.
# (Y ademas el script excluye SIEMPRE lo que cite la tabla viva; ver su cabecera.)
#
# LIMITE=20 en la corrida automatica: por tandas, no porque no quepa -- los 64
# ficheros en alcance ocupan 15,6 MB comprimidos y hay ~151 MiB libres -- sino
# porque una tanda corta hace barato el arreglo si algo sale mal.
#
# ============================================================================
# 🔴 SIN_HIST=incluir NO SE EJECUTA. NUNCA. Y NO ES UN DESCUIDO.
# ----------------------------------------------------------------------------
#   Decidido por Fernando el 29-ago-2026. Tres ficheros del buzon NO los cita el
#   historico -- los `ResumenDelVendedor-9` (España) del 16, 20 y 23 de julio --
#   y se quedan en `.csv` PARA SIEMPRE. El plan son 64 ficheros, no 67.
#
#   POR QUE, que es lo que hay que entender antes de "arreglarlo":
#   · Son los unicos candidatos REALES a reprocesarse. En concreto, el `-9` del
#     20-jul es el que taparia el hueco de España de esa fecha en
#     `keepa_escaparate_hist` (medido: el 2026-07-20 tiene de/fr/it y le falta
#     `es`). Reprocesar un fichero es subirlo al buzon y lanzar el procesador.
#   · Y `procesador_keepa_escaparate.py` filtra por `.endswith('.csv')`: un
#     `.csv.gz` DESAPARECE de su listado. O sea que comprimirlos es cerrar la
#     unica puerta por la que ese hueco se puede tapar.
#   · Lo que se gana comprimiendolos: 2,82 MB (3,49 MB -> 0,67 MB). Lo que se
#     pierde: la posibilidad de arreglar el histórico. No hay color.
#
#   🔒 Por eso `posponer` no es un "de momento": es el modo PERMANENTE. La
#      opcion `incluir` se deja en el menu por si algun dia se revisa la
#      decision -- pero revisarla es una decision de Fernando, no una tarea de
#      limpieza. Si estas leyendo esto porque te chirria que sobren tres CSV sin
#      comprimir: sobran a proposito, y esta escrito aqui justamente para que no
#      los toques.
# ============================================================================

on:
  workflow_run:
    workflows: ["Moloka - Backup BD"]
    types: [completed]
  workflow_dispatch:
    inputs:
      modo:
        description: 'ensayo = solo dice que haria · aplicar = comprime y borra · guarda = solo el chequeo'
        type: choice
        options: [ensayo, aplicar, guarda]
        default: ensayo
      dias:
        description: 'Antiguedad minima para tocar un fichero (dias)'
        default: '2'
      limite:
        description: 'Maximo de ficheros en esta tanda (0 = sin limite)'
        default: '20'
      sin_hist:
        description: 'DEJALO EN posponer. Los 3 que el historico no cita se quedan en .csv para siempre (ver la cabecera). incluir = NO SE USA'
        type: choice
        options: [posponer, incluir]
        default: posponer

concurrency:
  # 🔒 Nunca dos pasadas a la vez sobre el mismo buzon: la segunda veria un
  #    estado a medias (un .gz subido y su .csv todavia vivo) y podria decidir
  #    sobre el. `cancel-in-progress: false` a proposito: una pasada a medio
  #    hacer se termina, no se corta.
  group: comprimir-keepa-antiguos
  cancel-in-progress: false

jobs:
  comprimir:
    # 🔴 Solo si el backup de esta noche acabo BIEN. Un `completed` incluye
    #    `failure` y `cancelled`: sin este `if`, la noche que el backup se cae
    #    seria exactamente la noche en la que borrariamos sin red.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      # 🔴 MODO YA NO VIVE AQUI, Y NO ES UN DETALLE DE ESTILO. Desde el
      #    11-sep-2026 depende de lo que MIDIO la guarda del paso 4, y el `env`
      #    del job se resuelve ANTES de que exista ningun paso: no puede ver
      #    `steps.*`. Se decide en el `env` del paso 5, que es donde esta
      #    escrito el motivo entero. No lo devuelvas aqui.
      DIAS:   ${{ github.event.inputs.dias   || '2' }}
      LIMITE: ${{ github.event.inputs.limite || '20' }}
      # Sin input (o sea, en el disparo automatico) -> `posponer`, que es el lado
      # conservador: los de 0 filas nunca entran por accidente en una tanda que
      # no los esperaba.
      SIN_HIST: ${{ github.event.inputs.sin_hist || 'posponer' }}

    steps:
      - name: 1) Checkout
        uses: actions/checkout@v4

      - name: 2) Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3) Dependencias
        # Las mismas que los procesadores: `supabase` para Storage y psycopg2
        # para el UPDATE del historico. requirements.txt no lleva psycopg2.
        run: pip install --quiet psycopg2-binary supabase==2.31.0

      - name: 4) La guarda ANTES (si ya venimos rotos, no se toca nada)
        # 🔒 Lleva `id` porque el paso 5 decide con lo que esta guarda MIDE: el
        #    script deja `guarda_verde=true|false` (y las dos cifras de
        #    huerfanas) en $GITHUB_OUTPUT. Ver el motivo largo en el paso 5.
        id: guarda
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DB_URL:       ${{ secrets.SUPABASE_DB_URL }}
          MODO: guarda
        run: python -u comprimir_keepa_antiguos.py

      - name: 5) La pasada
        id: pasada
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DB_URL:       ${{ secrets.SUPABASE_DB_URL }}
          GUARDA_VERDE: ${{ steps.guarda.outputs.guarda_verde }}
          # ==================================================================
          # 🔴 EL DISPARO AUTOMATICO SI BORRA -- PERO SOLO SI LA GUARDA DEL
          #    PASO 4 SALIO VERDE. Cambiado el 11-sep-2026. Hasta ese dia aqui
          #    ponia "el disparo automatico no borra nunca", y hay que leer POR
          #    QUE dejo de ser verdad antes de tocar la linea de abajo.
          #
          #    LO QUE ESTABA ROTO. La forma vieja era
          #      github.event_name == 'workflow_dispatch' && github.event.inputs.modo || 'ensayo'
          #    y en `workflow_run` NO HAY `inputs`: la izquierda era falsa
          #    siempre, asi que el automatico caia a 'ensayo' SIEMPRE. Medido:
          #    21 corridas automaticas seguidas, las 21 simulacros (run
          #    34574217878, job 103182910140, paso 5: MODO=ensayo, alcance 99
          #    en el buzon, 20 "a tocar", 8.724 filas a reapuntar y de cierre
          #    "ENSAYO: no se ha escrito nada"). La limpieza que este fichero
          #    existe para hacer NO se hacia, y no lo noto nadie porque el run
          #    salia VERDE. Esa mitad -- que no se note -- la arregla el paso 7.
          #
          #    LO QUE SUSTITUYE A "no borra nunca" COMO RED. No es que el
          #    automatico no pueda borrar: es que no puede borrar A CIEGAS. Son
          #    tres cosas, y ninguna es esta linea sola:
          #      · el `if:` del job -- solo si el backup de esta noche acabo en
          #        VERDE, porque esa copia en R2 es la unica red que hay debajo;
          #      · el paso 4 -- la guarda de integridad tiene que salir verde, y
          #        lo dice ELLA en `guarda_verde`, no su codigo de salida, que
          #        vale 1 tanto por huerfanas como por un secreto que falta;
          #      · DIAS, el LIMITE de 20 por tanda y la exclusion de lo citado
          #        en la tabla viva, que no se han tocado.
          #
          #    FALLA CERRADO, Y ESO ES LO QUE HAY QUE CONSERVAR. Si
          #    `guarda_verde` no vale EXACTAMENTE la cadena 'true' -- porque
          #    valga 'false', porque el paso 4 muriera antes de escribirla, o
          #    porque alguien le cambie el nombre al output -- la expresion cae
          #    a 'ensayo'. El respaldo NUNCA es 'aplicar'. Lo caza
          #    test_comprimir_keepa.py, seccion (I), leyendo este fichero POR
          #    ESTRUCTURA (jobs -> steps -> env), no con un grep sobre el texto.
          #
          #    Y `workflow_dispatch` NO CAMBIA: manda su input `modo`, con
          #    'ensayo' de defecto y de respaldo si llegara vacio.
          # ==================================================================
          MODO: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.modo || 'ensayo') || (steps.guarda.outputs.guarda_verde == 'true' && 'aplicar' || 'ensayo') }}
        run: |
          # El modo de verdad se apunta ANTES de correr: si la pasada muere a
          # mitad, el veredicto del paso 7 tiene que poder decir en que modo
          # murio. Y se imprime, para que el log no obligue a deducirlo.
          echo "modo=$MODO" >> "$GITHUB_OUTPUT"
          echo "MODO=$MODO  ·  guarda_verde=${GUARDA_VERDE:-(sin medir)}"
          python -u comprimir_keepa_antiguos.py

      - name: 6) La guarda DESPUES
        # 🔒 El paso 5 ya la corre al final, pero se repite aqui como paso
        #    SUELTO: si el 5 muriera a mitad por cualquier razon, su guarda
        #    final no llegaria a ejecutarse y el workflow acabaria rojo sin
        #    decir en que estado quedo el historico. Este paso lo dice.
        id: guarda_despues
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DB_URL:       ${{ secrets.SUPABASE_DB_URL }}
          MODO: guarda
        run: python -u comprimir_keepa_antiguos.py

      - name: 7) EL VEREDICTO, en la PRIMERA linea del resumen de la corrida
        # 🔴 POR QUE EXISTE ESTE PASO. Durante 21 corridas seguidas el
        #    automatico no comprimio ni un fichero, y no lo noto nadie: el run
        #    salia VERDE, y lo unico que lo decia era el `env` del paso 5 y la
        #    ultima linea de su log ("ENSAYO: no se ha escrito nada"). Un dato
        #    que hay que ir a buscar no es un dato que se mire. Desde aqui, la
        #    PRIMERA linea del resumen dice si se escribio algo -- y si no, por
        #    que no.
        #
        # 🔒 `if: always()` porque el caso que mas falta hace contar es justo el
        #    que acaba en rojo: guarda roja, o paso 5 caido a mitad.
        #
        # 🔒 Ningun paso anterior escribe en $GITHUB_STEP_SUMMARY, y eso es lo
        #    que hace que esta sea LA PRIMERA linea. No se fuerza con un `>`
        #    (que borraria lo que escribiera otro): se MIDE en
        #    test_comprimir_keepa.py, seccion (L). Si manana alguien anade un
        #    paso que escriba antes, el banco se pone rojo en vez de dejar el
        #    veredicto enterrado en mitad del resumen.
        if: always()
        env:
          EVENTO:       ${{ github.event_name }}
          MODO_USADO:   ${{ steps.pasada.outputs.modo }}
          GUARDA_VERDE: ${{ steps.guarda.outputs.guarda_verde }}
          HUERFANAS_H:  ${{ steps.guarda.outputs.huerfanas_hist }}
          HUERFANAS_V:  ${{ steps.guarda.outputs.huerfanas_viva }}
          COMPRIMIDOS:  ${{ steps.pasada.outputs.comprimidos }}
          RESULTADO:    ${{ steps.pasada.outcome }}
          GUARDA_FINAL: ${{ steps.guarda_despues.outcome }}
        run: |
          # 🔴 EL ORDEN DE LAS PREGUNTAS NO ES COSMETICO: "¿se ha escrito algo?"
          #    manda sobre "¿por que no?". Una pasada que arranco en aplicar y
          #    murio a mitad NO puede leerse como un simulacro -- puede haber
          #    ficheros ya comprimidos y originales ya borrados.
          if [ "$MODO_USADO" = "aplicar" ] && [ "$RESULTADO" = "success" ]; then
            LINEA="APLICADO: ${COMPRIMIDOS:-0} ficheros comprimidos"
          elif [ "$MODO_USADO" = "aplicar" ]; then
            LINEA="APLICADO A MEDIAS: la pasada arranco en aplicar y NO termino; puede haber ficheros ya comprimidos. Mirar el log del paso 5."
          elif [ "$GUARDA_VERDE" = "false" ]; then
            LINEA="SIMULACRO: no se ha escrito nada (motivo: guarda roja)"
          elif [ -z "$GUARDA_VERDE" ]; then
            LINEA="SIMULACRO: no se ha escrito nada (motivo: la guarda no llego a medir)"
          elif [ "$MODO_USADO" = "ensayo" ] && [ "$EVENTO" = "workflow_dispatch" ]; then
            LINEA="SIMULACRO: no se ha escrito nada (motivo: lanzamiento manual en ensayo)"
          elif [ "$MODO_USADO" = "ensayo" ]; then
            # 🔴 ESTE ES EL FALLO DE LAS 21 CORRIDAS, VUELTO. Con la guarda
            #    verde el automatico tiene que aplicar; si llega aqui en ensayo
            #    es que la expresion del MODO volvio a caerse sola, y esta vez
            #    lo dice la primera linea en vez de callarlo un run verde.
            LINEA="SIMULACRO: no se ha escrito nada (motivo: el disparo automatico cayo a ensayo con la guarda verde -- eso es el fallo viejo; mirar el MODO del paso 5)"
          elif [ "$MODO_USADO" = "guarda" ]; then
            LINEA="SIMULACRO: no se ha escrito nada (motivo: lanzamiento manual en modo guarda)"
          else
            LINEA="SIMULACRO: no se ha escrito nada (motivo: la pasada no llego a correr)"
          fi
          {
            echo "$LINEA"
            echo
            echo '---'
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| disparo | ${EVENTO} |"
            echo "| MODO del paso 5 | ${MODO_USADO:-(no llego a correr)} |"
            echo "| guarda ANTES | ${GUARDA_VERDE:-(sin medir)} · huerfanas hist=${HUERFANAS_H:-?} viva=${HUERFANAS_V:-?} |"
            echo "| paso 5 | ${RESULTADO:-skipped} |"
            echo "| guarda DESPUES | ${GUARDA_FINAL:-skipped} |"
            echo "| DIAS · LIMITE · SIN_HIST | ${DIAS} · ${LIMITE} · ${SIN_HIST} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$LINEA"

      - name: 8) Telegram FALLO
        if: failure()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="FALLO comprimir-keepa-antiguos - mirar GitHub Actions" >/dev/null
