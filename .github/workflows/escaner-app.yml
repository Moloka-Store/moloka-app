# ============================================================
# Moloka - Escaner solo-Keepa en la nube
# Ubicacion en el repo: .github/workflows/escaner-app.yml
#
# Lanza moloka_escaner_nube.py en un runner de GitHub. Lee el recado y el
# catalogo del buzon (informes/escaner/), escanea con Keepa, sube el Excel a
# Storage (informes/resultados/) y lo registra en la tabla escaner_resultados.
#
# >>> SIN RELOJ <<<  Solo se ejecuta cuando TU lo lanzas (Run workflow o boton).
# timeout 350 min: el "todo" de TCG son 3-4h; el "nuevos" diario es de minutos.
# ============================================================
name: Moloka - Escaner

on:
  workflow_dispatch:        # SOLO disparo manual / por boton. SIN reloj.

jobs:
  escanear:
    runs-on: ubuntu-latest
    timeout-minutes: 350     # margen para un "todo" largo (GitHub corta a 360)
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt   # versiones FIJADAS ahi (xlrd: .xls OSMA | curl_cffi: API BEMS)

      - name: Ejecutar escaner
        env:
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
          # 🔒 service key para escribir escaner_detalle (lleva precio de coste; anon revocada) y para
          #    el puente de chase (linea 1531). Sin esto, las dos quedaban apagadas en silencio.
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          KEEPA_TIMEOUT: '120'    # la libreria trae 10s por defecto: demasiado poco para un lote grande
          LOTE_FASE1: '50'        # lotes mas pequenos = agujero mas pequeno si se pierde uno
          RESCATE_INTENTOS: '2'   # rondas de rescate al final de la Fase 1
          RESCATE_ESPERA: '60'    # segundos de espera antes de cada rescate
          BEMS_LOGIN:      ${{ secrets.BEMS_LOGIN }}
          BEMS_PASSWORD:   ${{ secrets.BEMS_PASSWORD }}
          BEMS_SECRET_KEY: ${{ secrets.BEMS_SECRET_KEY }}
        run: python -u moloka_escaner_nube.py
